<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Simple Point Cloud Explorer
  </title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
  </script>
  <!-- begin 'style.css' -->
  <style>
   body {
			margin: 0;
			padding: 0;
			background: #000;
			font-family: 'Courier New', monospace;
			overflow: hidden;
		}
		
		#container {
			position: relative;
			width: 100vw;
			height: 100vh;
		}
		
		#controls {
			position: absolute;
			top: 20px;
			left: 20px;
			background: rgba(0, 0, 0, 0.8);
			padding: 15px;
			border-radius: 8px;
			color: #00ff00;
			z-index: 100;
			min-width: 250px;
		}
		
		.control-group {
			margin-bottom: 10px;
		}
		
		label {
			display: block;
			margin-bottom: 5px;
			font-size: 12px;
		}
		
		input[type="range"] {
			width: 100%;
			background: #333;
			color: #00ff00;
			border: 1px solid #555;
			padding: 5px;
			height: 20px;
		}
		
		.value-display {
			display: inline-block;
			float: right;
			font-weight: bold;
		}
		
		#info {
			position: absolute;
			bottom: 20px;
			left: 20px;
			background: rgba(0, 0, 0, 0.8);
			padding: 10px;
			border-radius: 8px;
			color: #00ff00;
			font-size: 12px;
		}
  </style>
  <!-- end 'style.css' -->
  <!-- begin 'PointCloud.js' -->
  <script>
   class PointCloud {
		    constructor() {
		        this.scene = new THREE.Scene();
		        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
		        this.renderer = new THREE.WebGLRenderer({ antialias: true });
		        
		        this.points = null;
		        this.settings = {
		            pointSize: 3.0,
		            opacity: 0.8,
		            speed: 10,
		            pointCount: 25000
		        };
		        
		        // Movement
		        this.keys = {};
		        this.mouseX = 0;
		        this.mouseY = 0;
		        this.roll = 0;
		        this.velocity = new THREE.Vector3();
		        
		        this.init();
		    }
		    
		    init() {
		        this.setupRenderer();
		        this.setupControls();
		        this.setupMovement();
		        this.generatePoints();
		        this.animate();
		    }
		    
		    setupRenderer() {
		        this.renderer.setSize(window.innerWidth, window.innerHeight);
		        this.renderer.setClearColor(0x000011);
		        document.getElementById('container').appendChild(this.renderer.domElement);
		        this.camera.position.set(0, 0, 0);
		    }
		    
		    setupControls() {
		        const controls = {
		            pointSize: { element: document.getElementById('pointSize'), display: document.getElementById('pointSizeValue') },
		            opacity: { element: document.getElementById('opacity'), display: document.getElementById('opacityValue') },
		            speed: { element: document.getElementById('speed'), display: document.getElementById('speedValue') },
		            pointCount: { element: document.getElementById('pointCount'), display: document.getElementById('pointCountValue') }
		        };
		        
		        Object.keys(controls).forEach(key => {
		            const control = controls[key];
		            control.element.addEventListener('input', () => {
		                const value = parseFloat(control.element.value);
		                this.settings[key] = value;
		                control.display.textContent = value;
		                this.handleSettingChange(key, value);
		            });
		        });
		        
		        window.addEventListener('resize', () => {
		            this.camera.aspect = window.innerWidth / window.innerHeight;
		            this.camera.updateProjectionMatrix();
		            this.renderer.setSize(window.innerWidth, window.innerHeight);
		        });
		    }
		    
		    setupMovement() {
		        document.addEventListener('keydown', (e) => {
		            this.keys[e.code] = true;
		        });
		        
		        document.addEventListener('keyup', (e) => {
		            this.keys[e.code] = false;
		        });
		        
		        document.addEventListener('mousemove', (e) => {
		            if (document.pointerLockElement === document.body) {
		                this.mouseX -= e.movementX * 0.002;
		                this.mouseY -= e.movementY * 0.002;
		                this.mouseY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, this.mouseY));
		            }
		        });
		        
		        document.addEventListener('dblclick', () => {
		            if (document.pointerLockElement === document.body) {
		                document.exitPointerLock();
		            } else {
		                document.body.requestPointerLock();
		            }
		        });
		        
		        document.addEventListener('keydown', (e) => {
		            if (e.code === 'Escape' && document.pointerLockElement === document.body) {
		                document.exitPointerLock();
		            }
		        });
		    }
		    
		    generatePoints() {
		        if (this.points) {
		            this.scene.remove(this.points);
		            this.points.geometry.dispose();
		            this.points.material.dispose();
		        }
		        
		        const geometry = new THREE.BufferGeometry();
		        const positions = [];
		        const colors = [];
		        
		        const range = 1000;
		        
		        for (let i = 0; i < this.settings.pointCount; i++) {
		            // Random positions in 3D space
		            positions.push(
		                (Math.random() - 0.5) * range,
		                (Math.random() - 0.5) * range,
		                (Math.random() - 0.5) * range
		            );
		            
		            // Random colors
		            const color = new THREE.Color().setHSL(Math.random(), 0.7, 0.6);
		            colors.push(color.r, color.g, color.b);
		        }
		        
		        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
		        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
		        
		        const material = new THREE.PointsMaterial({
		            size: this.settings.pointSize,
		            opacity: this.settings.opacity,
		            transparent: this.settings.opacity < 1,
		            vertexColors: true,
		            sizeAttenuation: true
		        });
		        
		        this.points = new THREE.Points(geometry, material);
		        this.scene.add(this.points);
		        
		        document.getElementById('renderedCount').textContent = this.settings.pointCount;
		    }
		    
		    handleSettingChange(property, value) {
		        if (property === 'pointCount') {
		            this.generatePoints();
		        } else if (property === 'pointSize' || property === 'opacity') {
		            if (this.points && this.points.material) {
		                this.points.material.size = this.settings.pointSize;
		                this.points.material.opacity = this.settings.opacity;
		                this.points.material.transparent = this.settings.opacity < 1;
		                this.points.material.needsUpdate = true;
		            }
		        }
		    }
		    
		    updateMovement() {
		        // Roll rotation with Q/E
		        if (this.keys['KeyQ']) this.roll += 0.02;
		        if (this.keys['KeyE']) this.roll -= 0.02;
		        
		        // Apply rotation in order: Y (yaw), X (pitch), Z (roll)
		        this.camera.rotation.set(this.mouseY, this.mouseX, this.roll, 'YXZ');
		        
		        // Movement relative to camera orientation
		        this.velocity.set(0, 0, 0);
		        
		        if (this.keys['KeyW']) this.velocity.z -= 1;  // Forward (negative Z in camera space)
		        if (this.keys['KeyS']) this.velocity.z += 1;  // Back
		        if (this.keys['KeyA']) this.velocity.x -= 1;  // Left
		        if (this.keys['KeyD']) this.velocity.x += 1;  // Right
		        
		        const speedMultiplier = this.keys['ShiftLeft'] ? 3 : 1;
		        this.velocity.normalize().multiplyScalar(this.settings.speed * speedMultiplier * 0.016);
		        
		        // Transform movement vector by camera rotation
		        this.velocity.applyQuaternion(this.camera.quaternion);
		        
		        // Apply movement to camera position
		        this.camera.position.add(this.velocity);
		    }
		    
		    animate() {
		        requestAnimationFrame(() => this.animate());
		        this.updateMovement();
		        this.renderer.render(this.scene, this.camera);
		    }
		}
  </script>
  <!-- end 'PointCloud.js' -->
 </head>
 <body>
  <div id="container">
   <div id="controls">
    <div class="control-group">
     <label>
      Point Size:
      <span class="value-display" id="pointSizeValue">
       3.0
      </span>
     </label>
     <input id="pointSize" max="10" min="0.5" step="0.1" type="range" value="3.0"/>
    </div>
    <div class="control-group">
     <label>
      Opacity:
      <span class="value-display" id="opacityValue">
       0.8
      </span>
     </label>
     <input id="opacity" max="1" min="0.1" step="0.05" type="range" value="0.8"/>
    </div>
    <div class="control-group">
     <label>
      Speed:
      <span class="value-display" id="speedValue">
       10
      </span>
     </label>
     <input id="speed" max="50" min="1" step="1" type="range" value="10"/>
    </div>
    <div class="control-group">
     <label>
      Point Count:
      <span class="value-display" id="pointCountValue">
       25000
      </span>
     </label>
     <input id="pointCount" max="100000" min="1000" step="5000" type="range" value="25000"/>
    </div>
   </div>
   <div id="info">
    WASD: Move | Q/E: Roll | Shift: Sprint | Double-click: Mouse look | ESC: Exit mouse look
    <br/>
    Points:
    <span id="renderedCount">
     0
    </span>
   </div>
  </div>
 </body>
 <script>
  document.addEventListener('DOMContentLoaded', () => {
    new PointCloud();
});
 </script>
</html>
