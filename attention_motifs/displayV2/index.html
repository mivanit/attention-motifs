<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   3D Point Cloud Explorer
  </title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
  </script>
  <!-- begin 'style.css' -->
  <style>
   body {
			margin: 0;
			padding: 0;
			background: #000;
			font-family: 'Courier New', monospace;
			overflow: hidden;
		}
		
		#container {
			position: relative;
			width: 100vw;
			height: 100vh;
		}
		
		#controls {
			position: absolute;
			top: 20px;
			left: 20px;
			background: rgba(0, 0, 0, 0.8);
			padding: 15px;
			border-radius: 8px;
			color: #00ff00;
			z-index: 100;
			min-width: 250px;
		}
		
		.control-group {
			margin-bottom: 10px;
		}
		
		label {
			display: block;
			margin-bottom: 5px;
			font-size: 12px;
		}
		
		select,
		input[type="range"] {
			width: 100%;
			background: #333;
			color: #00ff00;
			border: 1px solid #555;
			padding: 5px;
		}
		
		input[type="range"] {
			height: 20px;
		}
		
		.value-display {
			display: inline-block;
			float: right;
			font-weight: bold;
		}
		
		#info {
			position: absolute;
			bottom: 20px;
			left: 20px;
			background: rgba(0, 0, 0, 0.8);
			padding: 10px;
			border-radius: 8px;
			color: #00ff00;
			font-size: 12px;
		}
		
		#hover-info {
			position: absolute;
			background: rgba(0, 0, 0, 0.9);
			color: #00ff00;
			padding: 8px;
			border-radius: 4px;
			font-size: 11px;
			pointer-events: none;
			z-index: 200;
			display: none;
		}
  </style>
  <!-- end 'style.css' -->
  <!-- begin 'VoxelGrid.js' -->
  <script>
   class VoxelGrid {
			constructor(voxelSize = 20, worldSize = 500) {
				this.voxelSize = voxelSize;
				this.worldSize = worldSize;
				this.voxelsPerSide = Math.ceil(this.worldSize * 2 / this.voxelSize);
				this.voxelGrid = new Map();
				this.activeVoxels = new Set();
			}
		
			clear() {
				this.voxelGrid.clear();
				this.activeVoxels.clear();
			}
		
			getVoxelKey(position) {
				const x = Math.floor((position.x + this.worldSize) / this.voxelSize);
				const y = Math.floor((position.y + this.worldSize) / this.voxelSize);
				const z = Math.floor((position.z + this.worldSize) / this.voxelSize);
				return `${x},${y},${z}`;
			}
		
			getVoxelCenter(voxelKey) {
				const [x, y, z] = voxelKey.split(',').map(Number);
				return new THREE.Vector3(
					(x + 0.5) * this.voxelSize - this.worldSize,
					(y + 0.5) * this.voxelSize - this.worldSize,
					(z + 0.5) * this.voxelSize - this.worldSize
				);
			}
		
			distributePoints(points) {
				this.voxelGrid.clear();
		
				points.forEach(point => {
					const voxelKey = this.getVoxelKey(point.position);
		
					if (!this.voxelGrid.has(voxelKey)) {
						this.voxelGrid.set(voxelKey, {
							points: [],
							mesh: null,
							center: this.getVoxelCenter(voxelKey)
						});
					}
		
					this.voxelGrid.get(voxelKey).points.push(point);
				});
			}
		
			getVoxel(voxelKey) {
				return this.voxelGrid.get(voxelKey);
			}
		
			getAllVoxels() {
				return this.voxelGrid;
			}
		
			clearMeshes(scene) {
				this.activeVoxels.forEach(voxelKey => {
					const voxel = this.voxelGrid.get(voxelKey);
					if (voxel && voxel.mesh) {
						scene.remove(voxel.mesh);
						if (voxel.mesh.geometry) voxel.mesh.geometry.dispose();
						if (voxel.mesh.material) voxel.mesh.material.dispose();
						voxel.mesh = null;
					}
				});
				this.activeVoxels.clear();
			}
		
			setActiveVoxels(voxelKeys) {
				this.activeVoxels = new Set(voxelKeys);
			}
		
			getActiveVoxels() {
				return this.activeVoxels;
			}
		}
  </script>
  <!-- end 'VoxelGrid.js' -->
  <!-- begin 'controls.js' -->
  <script>
   class Controls {
		    constructor(camera) {
		        this.camera = camera;
		        this.settings = {
		            pointSize: 2.0,
		            opacity: 0.8,
		            renderDistance: 50,
		            speed: 5,
		            pointCount: 10000
		        };
		
		        this.keys = {};
		        this.mouseX = 0;
		        this.mouseY = 0;
		        this.velocity = new THREE.Vector3();
		        this.direction = new THREE.Vector3();
		
		        this.onSettingChange = null;
		        this.onWindowResize = null;
		        this.onMouseMove = null;
		
		        this.setupEventListeners();
		        this.setupControls();
		    }
		
		    setupEventListeners() {
		        document.addEventListener('keydown', (e) => {
		            this.keys[e.code] = true;
		        });
		
		        document.addEventListener('keyup', (e) => {
		            this.keys[e.code] = false;
		        });
		
		        document.addEventListener('mousemove', (e) => {
		            if (document.pointerLockElement === document.body) {
		                // Fixed: Reverse mouse X axis and Y axis
		                this.mouseX -= e.movementX * 0.002;
		                this.mouseY -= e.movementY * 0.002;
		                this.mouseY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, this.mouseY));
		            }
		
		            if (this.onMouseMove) {
		                this.onMouseMove(e);
		            }
		        });
		
		        // Fixed: Use double-click instead of single click for pointer lock
		        document.addEventListener('dblclick', () => {
		            if (document.pointerLockElement === document.body) {
		                document.exitPointerLock();
		            } else {
		                document.body.requestPointerLock();
		            }
		        });
		
		        // Add escape key to exit pointer lock
		        document.addEventListener('keydown', (e) => {
		            if (e.code === 'Escape' && document.pointerLockElement === document.body) {
		                document.exitPointerLock();
		            }
		        });
		
		        window.addEventListener('resize', () => {
		            if (this.onWindowResize) {
		                this.onWindowResize();
		            }
		        });
		    }
		
		    setupControls() {
		        const controlElements = {
		            pointSize: document.getElementById('pointSize'),
		            opacity: document.getElementById('opacity'),
		            renderDistance: document.getElementById('lodDistance'),
		            speed: document.getElementById('speed'),
		            pointCount: document.getElementById('pointCount')
		        };
		
		        const valueElements = {
		            pointSize: document.getElementById('pointSizeValue'),
		            opacity: document.getElementById('opacityValue'),
		            renderDistance: document.getElementById('lodDistanceValue'),
		            speed: document.getElementById('speedValue'),
		            pointCount: document.getElementById('pointCountValue')
		        };
		
		        Object.keys(controlElements).forEach(key => {
		            const control = controlElements[key];
		            const valueDisplay = valueElements[key];
		
		            if (control && valueDisplay) {
		                control.addEventListener('input', () => {
		                    const value = parseFloat(control.value);
		                    this.settings[key] = value;
		                    valueDisplay.textContent = value;
		
		                    if (this.onSettingChange) {
		                        this.onSettingChange(key, value);
		                    }
		                });
		            }
		        });
		    }
		
		    updateMovement() {
		        // Mouse look
		        this.camera.rotation.set(this.mouseY, this.mouseX, 0, 'YXZ');
		
		        // Movement
		        this.velocity.set(0, 0, 0);
		
		        // Fixed: Reverse forward/back movement
		        if (this.keys['KeyW']) this.velocity.z += 1;  // Forward
		        if (this.keys['KeyS']) this.velocity.z -= 1;  // Back
		        if (this.keys['KeyA']) this.velocity.x -= 1;  // Left
		        if (this.keys['KeyD']) this.velocity.x += 1;  // Right
		
		        const speedMultiplier = this.keys['ShiftLeft'] ? 3 : 1;
		        this.velocity.normalize().multiplyScalar(this.settings.speed * speedMultiplier * 0.016);
		
		        // Apply movement relative to camera direction
		        this.direction.set(0, 0, -1);
		        this.direction.applyQuaternion(this.camera.quaternion);
		
		        const right = new THREE.Vector3();
		        right.crossVectors(this.direction, this.camera.up).normalize();
		
		        const forward = new THREE.Vector3();
		        forward.crossVectors(this.camera.up, right).normalize();
		
		        this.camera.position.addScaledVector(right, this.velocity.x);
		        this.camera.position.addScaledVector(forward, this.velocity.z);
		    }
		
		    isMoving() {
		        return this.velocity.length() > 0;
		    }
		
		    setOnSettingChange(callback) {
		        this.onSettingChange = callback;
		    }
		
		    setOnWindowResize(callback) {
		        this.onWindowResize = callback;
		    }
		
		    setOnMouseMove(callback) {
		        this.onMouseMove = callback;
		    }
		
		    checkHover(event, activeVoxels, allVoxels) {
		        // Simple hover implementation - you can expand this
		        const hoverInfo = document.getElementById('hover-info');
		        if (hoverInfo) {
		            hoverInfo.style.display = 'none';
		        }
		    }
		}
  </script>
  <!-- end 'controls.js' -->
  <!-- begin 'PointCloudExplorer.js' -->
  <script>
   class PointCloudExplorer {
			constructor() {
				this.scene = new THREE.Scene();
				this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
				this.renderer = new THREE.WebGLRenderer({ antialias: true });
		
				this.voxelGrid = new VoxelGrid(20, 500);
				this.controls = new Controls(this.camera);
				this.points = [];
				this.frameCount = 0;
		
				this.init();
			}
		
			init() {
				this.setupRenderer();
				this.setupCallbacks();
				this.generatePoints();
				this.animate();
			}
		
			setupRenderer() {
				this.renderer.setSize(window.innerWidth, window.innerHeight);
				this.renderer.setClearColor(0x000011);
				document.getElementById('container').appendChild(this.renderer.domElement);
				this.camera.position.set(0, 0, 0);
			}
		
			setupCallbacks() {
				this.controls.setOnSettingChange((property, value) => {
					this.handleSettingChange(property, value);
				});
		
				this.controls.setOnWindowResize(() => {
					this.camera.aspect = window.innerWidth / window.innerHeight;
					this.camera.updateProjectionMatrix();
					this.renderer.setSize(window.innerWidth, window.innerHeight);
				});
		
				this.controls.setOnMouseMove((event) => {
					this.controls.checkHover(event, this.voxelGrid.getActiveVoxels(), this.voxelGrid.getAllVoxels());
				});
			}
		
			generatePoints() {
				this.points = [];
				const count = this.controls.settings.pointCount;
		
				for (let i = 0; i < count; i++) {
					const point = {
						id: i,
						position: new THREE.Vector3(
							(Math.random() - 0.5) * this.voxelGrid.worldSize * 2,
							(Math.random() - 0.5) * this.voxelGrid.worldSize * 2,
							(Math.random() - 0.5) * this.voxelGrid.worldSize * 2
						),
						color: new THREE.Color().setHSL(Math.random(), 0.7, 0.6)
					};
					this.points.push(point);
				}
		
				this.voxelGrid.distributePoints(this.points);
				this.updateVisibility();
			}
		
			updateVisibility() {
				const cameraPos = this.camera.position;
				const newActiveVoxels = [];
				let totalRenderedPoints = 0;
		
				// Clear old meshes
				this.voxelGrid.clearMeshes(this.scene);
		
				// Create new meshes for visible voxels
				this.voxelGrid.getAllVoxels().forEach((voxel, voxelKey) => {
					const distance = cameraPos.distanceTo(voxel.center);
		
					// Simple distance culling - no LOD
					if (distance < this.controls.settings.renderDistance) {
						newActiveVoxels.push(voxelKey);
		
						const geometry = new THREE.BufferGeometry();
						const positions = [];
						const colors = [];
		
						// Render all points in this voxel
						voxel.points.forEach(point => {
							positions.push(point.position.x, point.position.y, point.position.z);
							colors.push(point.color.r, point.color.g, point.color.b);
						});
		
						if (positions.length > 0) {
							totalRenderedPoints += voxel.points.length;
		
							geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
							geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
		
							const material = new THREE.PointsMaterial({
								size: this.controls.settings.pointSize,
								opacity: this.controls.settings.opacity,
								transparent: this.controls.settings.opacity < 1,
								vertexColors: true,
								sizeAttenuation: true
							});
		
							voxel.mesh = new THREE.Points(geometry, material);
							voxel.mesh.userData = { voxelKey, points: voxel.points };
							this.scene.add(voxel.mesh);
						}
					}
				});
		
				this.voxelGrid.setActiveVoxels(newActiveVoxels);
				document.getElementById('renderedCount').textContent = totalRenderedPoints;
			}
		
			handleSettingChange(property, value) {
				if (property === 'pointCount') {
					// Regenerate all points
					this.voxelGrid.clearMeshes(this.scene);
					this.voxelGrid.clear();
					this.generatePoints();
				} else if (property === 'pointSize' || property === 'opacity') {
					// Update existing materials
					this.voxelGrid.getActiveVoxels().forEach(voxelKey => {
						const voxel = this.voxelGrid.getVoxel(voxelKey);
						if (voxel && voxel.mesh && voxel.mesh.material) {
							voxel.mesh.material.size = this.controls.settings.pointSize;
							voxel.mesh.material.opacity = this.controls.settings.opacity;
							voxel.mesh.material.transparent = this.controls.settings.opacity < 1;
							voxel.mesh.material.needsUpdate = true;
						}
					});
				} else {
					// Refresh visibility for distance changes
					this.updateVisibility();
				}
			}
		
			animate() {
				requestAnimationFrame(() => this.animate());
		
				this.controls.updateMovement();
		
				// Only update visibility every few frames for performance, or when movement occurs
				if (this.frameCount % 3 === 0 || this.controls.isMoving()) {
					this.updateVisibility();
				}
				this.frameCount++;
		
				this.renderer.render(this.scene, this.camera);
			}
		}
  </script>
  <!-- end 'PointCloudExplorer.js' -->
 </head>
 <body>
  <div id="container">
   <div id="controls">
    <div class="control-group">
     <label>
      Point Size:
      <span class="value-display" id="pointSizeValue">
       2.0
      </span>
     </label>
     <input id="pointSize" max="10" min="0.5" step="0.1" type="range" value="2.0"/>
    </div>
    <div class="control-group">
     <label>
      Opacity:
      <span class="value-display" id="opacityValue">
       0.8
      </span>
     </label>
     <input id="opacity" max="1" min="0.1" step="0.05" type="range" value="0.8"/>
    </div>
    <div class="control-group">
     <label>
      LOD Distance:
      <span class="value-display" id="lodDistanceValue">
       50
      </span>
     </label>
     <input id="lodDistance" max="200" min="20" step="5" type="range" value="50"/>
    </div>
    <div class="control-group">
     <label>
      Speed:
      <span class="value-display" id="speedValue">
       5
      </span>
     </label>
     <input id="speed" max="20" min="1" step="0.5" type="range" value="5"/>
    </div>
    <div class="control-group">
     <label>
      Point Count:
      <span class="value-display" id="pointCountValue">
       10000
      </span>
     </label>
     <input id="pointCount" max="50000" min="1000" step="1000" type="range" value="10000"/>
    </div>
   </div>
   <div id="info">
    WASD: Move | Shift: Sprint | Mouse: Look around
    <br/>
    Points rendered:
    <span id="renderedCount">
     0
    </span>
   </div>
   <div id="hover-info">
   </div>
  </div>
  <script>
   // Initialize the application when DOM is loaded
		document.addEventListener('DOMContentLoaded', () => {
			new PointCloudExplorer();
		});
  </script>
 </body>
</html>
