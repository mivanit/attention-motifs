<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" fill="#000011"/>
  
  <!-- 3D coordinate axes -->
  <!-- X-axis (red) -->
  <line x1="16" y1="16" x2="26" y2="16" stroke="#ff4444" stroke-width="1.5" opacity="0.8"/>
  <polygon points="26,16 24,15 24,17" fill="#ff4444" opacity="0.8"/>
  
  <!-- Y-axis (green) -->
  <line x1="16" y1="16" x2="16" y2="6" stroke="#44ff44" stroke-width="1.5" opacity="0.8"/>
  <polygon points="16,6 15,8 17,8" fill="#44ff44" opacity="0.8"/>
  
  <!-- Z-axis (blue, isometric) -->
  <line x1="16" y1="16" x2="9" y2="23" stroke="#4444ff" stroke-width="1.5" opacity="0.8"/>
  <polygon points="9,23 11,22 10,24" fill="#4444ff" opacity="0.8"/>
  
  <!-- Data points scattered in 3D space -->
  <circle cx="20" cy="12" r="1.5" fill="#00ff00" opacity="0.9"/>
  <circle cx="12" cy="14" r="1" fill="#00ff00" opacity="0.7"/>
  <circle cx="18" cy="20" r="1.2" fill="#00ff00" opacity="0.8"/>
  <circle cx="14" cy="18" r="0.8" fill="#00ff00" opacity="0.6"/>
  <circle cx="22" cy="18" r="1" fill="#00ff00" opacity="0.8"/>
  <circle cx="11" cy="11" r="1" fill="#00ff00" opacity="0.7"/>
  <circle cx="24" cy="14" r="0.8" fill="#00ff00" opacity="0.6"/>
  
  <!-- Crosshair at center -->
  <line x1="14" y1="16" x2="18" y2="16" stroke="#ffff00" stroke-width="1" opacity="0.4"/>
  <line x1="16" y1="14" x2="16" y2="18" stroke="#ffff00" stroke-width="1" opacity="0.4"/>
</svg>