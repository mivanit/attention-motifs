<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />
	<title>Notification System Test</title>
	<!-- styles -->
	<link rel="stylesheet" href="notif.css">
	<!-- code -->
	<script src="notif.js"></script>
</head>

<body>
	<h1>Notification System Test</h1>
	<p>Click the buttons below to test different notification types:</p>
	
	<div style="margin: 20px 0; display: flex; gap: 10px; flex-wrap: wrap;">
		<button onclick="testSpinner()">Test Spinner</button>
		<button onclick="testProgressBar()">Test Progress Bar</button>
		<button onclick="testMessages()">Test Messages</button>
		<button onclick="testStacking()">Test Stacking</button>
		<button onclick="testAll()">Test All Features</button>
		<button onclick="NOTIF.clear()">Clear All</button>
	</div>

	<script>
		function testSpinner() {
			console.log('Testing spinner...');
			const spinner = NOTIF.spinner('Loading data...');
			
			// Auto-complete after 3 seconds
			setTimeout(() => {
				spinner.complete();
				NOTIF.success('Data loaded!');
			}, 3000);
		}

		function testProgressBar() {
			console.log('Testing progress bar...');
			const pbar = NOTIF.pbar('Processing files...');
			
			// Simulate progress updates
			let progress = 0;
			const interval = setInterval(() => {
				progress += 0.1;
				pbar.progress(progress);
				
				if (progress >= 1.0) {
					clearInterval(interval);
					setTimeout(() => {
						pbar.complete();
						NOTIF.success('Processing complete!');
					}, 500);
				}
			}, 300);
		}

		function testMessages() {
			console.log('Testing different message types...');
			NOTIF.show('This is a regular message', 3000);
			
			setTimeout(() => {
				NOTIF.success('This is a success message!');
			}, 1000);
			
			setTimeout(() => {
				NOTIF.error('This is an error message', new Error('Test error'));
			}, 2000);
		}

		function testStacking() {
			console.log('Testing notification stacking...');
			NOTIF.show('Message 1 (will auto-hide)', 2000);
			
			setTimeout(() => {
				NOTIF.show('Message 2 (will auto-hide)', 2000);
			}, 500);
			
			setTimeout(() => {
				NOTIF.show('Message 3 (will auto-hide)', 2000);
			}, 1000);
			
			setTimeout(() => {
				NOTIF.success('All messages stacked!');
			}, 1500);
		}

		function testAll() {
			console.log('Testing all features together...');
			
			// Start with a spinner
			const spinner = NOTIF.spinner('Initializing...');
			
			// Add some regular messages
			setTimeout(() => {
				NOTIF.show('Step 1: Preparing data');
			}, 500);
			
			setTimeout(() => {
				NOTIF.show('Step 2: Validating input');
			}, 1000);
			
			// Complete spinner and start progress bar
			setTimeout(() => {
				spinner.complete();
				const pbar = NOTIF.pbar('Processing data...');
				
				// Update progress
				let progress = 0;
				const interval = setInterval(() => {
					progress += 0.2;
					pbar.progress(progress);
					
					if (progress >= 1.0) {
						clearInterval(interval);
						setTimeout(() => {
							pbar.complete();
							NOTIF.success('All operations completed successfully!');
						}, 300);
					}
				}, 400);
			}, 1500);
			
			// Add an error notification
			setTimeout(() => {
				NOTIF.error('Warning: This is just a test error');
			}, 3000);
		}

		// Initialize message
		document.addEventListener('DOMContentLoaded', () => {
			setTimeout(() => {
				NOTIF.show('Notification system ready! Click buttons to test.', 3000);
			}, 100);
		});
	</script>
</body>

</html>
