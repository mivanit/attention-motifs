<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta content="width=device-width, initial-scale=1.0" name="viewport" />
	<title>Simple Point Cloud Explorer</title>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<link rel="stylesheet" href="style.css">
	<script src="PointCloud.js"></script>
</head>

<body>
	<div id="container">
		<div id="controls">
			<div class="control-group">
				<label> Point Size: <span class="value-display" id="pointSizeValue">3.0</span>
				</label>
				<input id="pointSize" max="10" min="0.5" step="0.1" type="range" value="3.0" />
			</div>
			<div class="control-group">
				<label> Opacity: <span class="value-display" id="opacityValue">0.8</span>
				</label>
				<input id="opacity" max="1" min="0.1" step="0.05" type="range" value="0.8" />
			</div>
			<div class="control-group">
				<label> Speed: <span class="value-display" id="speedValue">10</span>
				</label>
				<input id="speed" max="100" min="1" step="1" type="range" value="10" />
			</div>
			<div class="control-group">
				<label> Point Count: <span class="value-display" id="pointCountValue">25000</span>
				</label>
				<input id="pointCount" max="500000" min="5000" step="5000" type="range" value="25000" />
			</div>
		</div>
		<div id="info"> WASD: Move | Q/E: Roll | Shift: Sprint | Double-click: Mouse look | ESC: Exit mouse look <br /> Points: <span id="renderedCount">0</span>
		</div>
	</div>
</body>
<script>
	document.addEventListener('DOMContentLoaded', () => {
		new PointCloud();
	});
</script>

</html>
