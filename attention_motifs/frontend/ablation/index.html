    class DataTable {
    	/**
    	 * Creates a new DataTable instance.
    	 * @param {HTMLElement|string} container - DOM element or CSS selector for the table container
    	 * @param {DataTableConfig} [config={}] - Configuration options
    	 * @throws {Error} If container element is not found
    	 */
    	constructor(container, config = {}) {
    		this.container =
    			typeof container === "string"
    				? document.querySelector(container)
    				: container;
    		if (!this.container) {
    			throw new Error(`DataTable container not found: ${container}`);
    		}
    		this.data = config.data || [];
    		this.columns = config.columns || [];
    		this.pageSizeOptions =
    			config.pageSizeOptions ||
    			_TABLE_CONSTS.PAGINATION.DEFAULT_PAGE_SIZES;
    		this.pageSize = config.pageSize || this.pageSizeOptions[0];
    		this.showFilters = config.showFilters !== false; // Default to true
    		this.showInfo = config.showInfo === true; // Default to false
    		this.minColumnWidth =
    			config.minColumnWidth || _TABLE_CONSTS.SPACING.MIN_COLUMN_WIDTH;
    		this.currentPage = 1;
    		this.sortColumnId = null;
    		this.sortDirection = null;
    		this.filters = {};
    		this.filteredData = [];
    		this.paginationListeners = []; // Store listeners for cleanup
    		if (this.columns.length === 0 && this.data.length > 0) {
    			this.columns = Object.keys(this.data[0]).map((key) => ({
    				key: key,
    				label: key.charAt(0).toUpperCase() + key.slice(1),
    				type: this.inferType(this.data[0][key]),
    				filterable: true,
    			}));
    		}
    
    		this.init();
    	}
    
    	/**
    	 * Infers the data type of a value.
    	 * @param {*} value - Value to analyze
    	 * @returns {'string'|'number'|'boolean'|'date'} Inferred type
    	 */
    	inferType(value) {
    		if (value === null || value === undefined) return "string";
    		if (typeof value === "number") return "number";
    		if (typeof value === "boolean") return "boolean";
    		if (value instanceof Date) return "date";
    		return "string";
    	}
    
    	/**
    	 * Gets a value from an object using dot notation for nested properties.
    	 * @param {Object} obj - Object to extract value from
    	 * @param {string} key - Property key (supports dot notation, e.g., 'user.address.city')
    	 * @returns {*} Value at the specified path, or undefined if not found
    	 */
    	getNestedValue(obj, key) {
    		// Support dot notation for nested keys (e.g., 'stats.entropy')
    		if (!key.includes(".")) {
    			return obj[key];
    		}
    
    		const keys = key.split(".");
    		let value = obj;
    		for (const k of keys) {
    			if (value === null || value === undefined) {
    				return undefined;
    			}
    			value = value[k];
    		}
    		return value;
    	}
    
    	/**
    	 * Gets the unique identifier for a column.
    	 * @param {ColumnConfig} col - Column configuration
    	 * @returns {string} Column ID (uses id if provided, otherwise key)
    	 */
    	getColumnId(col) {
    		// Use id if provided, otherwise fall back to key
    		return col.id || col.key;
    	}
    
    	/**
    	 * Prefixes a class name with the table's CSS prefix.
    	 * @param {string} className - Base class name
    	 * @returns {string} Prefixed class name (e.g., 'tablejs-header')
    	 */
    	cssClass(className) {
    		return _TABLE_CONSTS.CSS_PREFIX + className;
    	}
    
    	/**
    	 * Creates a DOM element with optional class name and inline styles.
    	 * @param {string} tagName - HTML tag name
    	 * @param {string} [className] - CSS class name (will be prefixed)
    	 * @param {Object} [styles={}] - Inline styles to apply
    	 * @returns {HTMLElement} Created element
    	 */
    	createStyledElement(tagName, className, styles = {}) {
    		const element = document.createElement(tagName);
    		if (className) {
    			element.className = this.cssClass(className);
    		}
    		Object.assign(element.style, styles);
    		return element;
    	}
    
    	/**
    	 * Calculates the minimum column width in pixels based on the configured minColumnWidth.
    	 * @returns {number} Minimum width in pixels
    	 */
    	getMinColumnWidthInPixels() {
    		// Create a temporary element to measure the minimum width
    		const tempDiv = document.createElement("div");
    		tempDiv.style.position = "absolute";
    		tempDiv.style.visibility = "hidden";
    		tempDiv.style.width = this.minColumnWidth;
    		tempDiv.style.fontSize = window.getComputedStyle(
    			this.container,
    		).fontSize;
    		document.body.appendChild(tempDiv);
    		const pixelWidth = tempDiv.offsetWidth;
    		document.body.removeChild(tempDiv);
    		return pixelWidth;
    	}
    
    	/**
    	 * Initializes the table by creating structure, applying filters, and rendering.
    	 * @private
    	 */
    	init() {
    		this.createTableStructure();
    		this.applyFiltersAndSort();
    		this.render();
    	}
    
    	/**
    	 * Creates the DOM structure for the table including header, filters, and pagination.
    	 * @private
    	 */
    	createTableStructure() {
    		this.container.innerHTML = "";
    
    		// Create wrapper
    		const wrapper = this.createStyledElement("div", "wrapper", {});
    
    		// Create table container
    		const tableContainer = this.createStyledElement("div", "container");
    
    		const table = this.createStyledElement("table", "table");
    
    		// Create header
    		const thead = this.createStyledElement("thead", "thead");
    
    		// Header row with column names, sort, and resize handles
    		const headerRow = this.createStyledElement("tr", "header-row", {
    			backgroundColor: _TABLE_CONSTS.COLORS.HEADER_BG,
    		});
    		this.columns.forEach((col, index) => {
    			const thStyles = {
    				position: "relative",
    				padding: _TABLE_CONSTS.SPACING.PADDING_CELL,
    				borderBottom: `${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}`,
    				// Don't set minWidth here - it will be enforced during resize
    			};
    
    			if (col.width) {
    				thStyles.width = col.width;
    			}
    
    			if (col.align) {
    				thStyles.textAlign = col.align;
    			}
    
    			const th = this.createStyledElement("th", "header-cell", thStyles);
    
    			const headerContent = this.createStyledElement(
    				"div",
    				"header-content",
    				{
    					display: "flex",
    					justifyContent: "space-between",
    					alignItems: "center",
    					minWidth: "0", // allow flex children to shrink
    				},
    			);
    
    			const label = this.createStyledElement("span", "header-label", {
    				overflow: "hidden",
    				textOverflow: "ellipsis",
    				whiteSpace: "nowrap",
    			});
    			label.textContent = col.label || col.key;
    			headerContent.appendChild(label);
    
    			const sortIcon = this.createStyledElement("span", "sort-icon", {
    				marginLeft: _TABLE_CONSTS.SPACING.MARGIN_ICON,
    				opacity: _TABLE_CONSTS.FEEDBACK.ICON_OPACITY_INACTIVE,
    			});
    			sortIcon.innerHTML = _TABLE_CONSTS.ICONS.sort;
    			headerContent.appendChild(sortIcon);
    
    			headerContent.onclick = () =>
    				this.handleSort(this.getColumnId(col));
    
    			// Add resize handle
    			const resizeHandle = this.createStyledElement(
    				"div",
    				"resize-handle",
    				{
    					position: "absolute",
    					right: "0",
    					top: "0",
    					bottom: "0",
    					width: _TABLE_CONSTS.SPACING.RESIZE_HANDLE_WIDTH,
    					cursor: "col-resize",
    					background: "transparent",
    					borderRight: `2px solid transparent`,
    					transition: "border-color 0.2s",
    				},
    			);
    
    			// Add hover effect
    			resizeHandle.addEventListener("mouseenter", () => {
    				resizeHandle.style.borderRightColor =
    					_TABLE_CONSTS.COLORS.BORDER;
    			});
    			resizeHandle.addEventListener("mouseleave", () => {
    				resizeHandle.style.borderRightColor = "transparent";
    			});
    
    			this.addResizeListener(resizeHandle, th, index);
    
    			th.appendChild(headerContent);
    			th.appendChild(resizeHandle);
    			headerRow.appendChild(th);
    		});
    		thead.appendChild(headerRow);
    
    		// Info row (conditional)
    		if (this.showInfo) {
    			const infoRow = this.createStyledElement("tr", "info-row", {
    				backgroundColor: _TABLE_CONSTS.COLORS.HEADER_BG,
    				borderTop: `${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}`,
    			});
    
    			this.columns.forEach((col) => {
    				const tdStyles = {
    					padding: _TABLE_CONSTS.SPACING.PADDING_CELL,
    					backgroundColor: _TABLE_CONSTS.COLORS.HEADER_BG,
    					fontSize: "0.9em",
    					fontStyle: "italic",
    					color: _TABLE_CONSTS.COLORS.MUTED_TEXT,
    				};
    
    				if (col.align) {
    					tdStyles.textAlign = col.align;
    				}
    
    				const td = this.createStyledElement(
    					"td",
    					"info-cell",
    					tdStyles,
    				);
    				td.innerHTML = this.calculateColumnInfo(col);
    				infoRow.appendChild(td);
    			});
    			thead.appendChild(infoRow);
    			this.infoRow = infoRow;
    		}
    
    		// Filter row (conditional)
    		if (this.showFilters) {
    			const filterRow = this.createStyledElement("tr", "filter-row", {
    				backgroundColor: _TABLE_CONSTS.COLORS.FILTER_BG,
    				borderTop: `${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}`,
    			});
    
    			this.columns.forEach((col) => {
    				const tdStyles = {
    					padding: _TABLE_CONSTS.SPACING.PADDING_FILTER,
    					backgroundColor: _TABLE_CONSTS.COLORS.FILTER_BG,
    				};
    
    				if (col.align) {
    					tdStyles.textAlign = col.align;
    				}
    
    				const td = this.createStyledElement(
    					"td",
    					"filter-cell",
    					tdStyles,
    				);
    
    				// Check if column is filterable
    				const isFilterable = col.filterable !== false;
    
    				if (isFilterable) {
    					const filterContainer = this.createStyledElement(
    						"div",
    						"filter-container",
    						{
    							display: "flex",
    							alignItems: "center",
    							minWidth: "0", // allow this flex container to shrink inside the cell
    						},
    					);
    
    					// Add filter icon
    					const filterIcon = this.createStyledElement(
    						"span",
    						"filter-icon",
    						{
    							marginRight: _TABLE_CONSTS.SPACING.MARGIN_ICON,
    							opacity: "0.5",
    							display: "flex",
    							alignItems: "center",
    						},
    					);
    					filterIcon.innerHTML = _TABLE_CONSTS.ICONS.filter;
    
    					const input = this.createStyledElement(
    						"input",
    						"filter-input",
    						{
    							flex: "1 1 0", // allow shrinking and growing; 0 basis avoids intrinsic width bias
    							minWidth: "0", // critical: override flexbox min-width:auto
    							width: "0", // ensures the flex-basis drives width, not the default input width
    							border: `${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}`,
    							padding: "2px 4px",
    							borderRadius: "3px",
    							overflow: "hidden", // optional: clip when very narrow
    						},
    					);
    					input.type = "text";
    					input.placeholder = "";
    
    					// Add tooltip for filter help
    					const tooltipText = this.getFilterTooltip(col);
    					input.title = tooltipText;
    					filterIcon.title = tooltipText;
    
    					const clearBtn = this.createStyledElement(
    						"button",
    						"filter-clear-btn",
    						{
    							border: "none",
    							background: "none",
    							cursor: "pointer",
    							padding: "2px 8px",
    							fontSize: "16px",
    							color: _TABLE_CONSTS.COLORS.MUTED_TEXT,
    							marginLeft: _TABLE_CONSTS.SPACING.MARGIN_ICON,
    						},
    					);
    					clearBtn.textContent = _TABLE_CONSTS.ICONS.clear;
    					clearBtn.title = _TABLE_CONSTS.MESSAGES.CLEAR_FILTER;
    
    					input.addEventListener("input", (e) => {
    						this.handleFilter(
    							this.getColumnId(col),
    							col.key,
    							e.target.value,
    							col.type,
    							input,
    							col,
    						);
    					});
    
    					clearBtn.addEventListener("click", () => {
    						this.clearFilter(this.getColumnId(col), input);
    					});
    
    					filterContainer.appendChild(filterIcon);
    					filterContainer.appendChild(input);
    					filterContainer.appendChild(clearBtn);
    					td.appendChild(filterContainer);
    				}
    				filterRow.appendChild(td);
    			});
    			thead.appendChild(filterRow);
    		}
    
    		table.appendChild(thead);
    
    		// Create body
    		const tbody = this.createStyledElement("tbody", "tbody");
    		table.appendChild(tbody);
    
    		tableContainer.appendChild(table);
    		wrapper.appendChild(tableContainer);
    
    		// Create bottom pagination with page size selector
    		const paginationBottom = this.createStyledElement(
    			"div",
    			"pagination-bottom",
    			{
    				backgroundColor: _TABLE_CONSTS.COLORS.FOOTER_BG,
    				borderTop: `${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}`,
    				padding: _TABLE_CONSTS.SPACING.PADDING_CELL,
    			},
    		);
    		wrapper.appendChild(paginationBottom);
    
    		this.container.appendChild(wrapper);
    
    		// Store references
    		this.tbody = tbody;
    		this.paginationBottom = paginationBottom;
    		this.headerRow = headerRow;
    
    		// Store table reference on container for button access
    		this.container.table = this;
    	}
    
    	/**
    	 * Adds mouse event listeners for column resize functionality.
    	 * @param {HTMLElement} handle - Resize handle element
    	 * @param {HTMLElement} th - Table header cell element
    	 * @param {number} columnIndex - Index of the column being resized
    	 * @private
    	 */
    	addResizeListener(handle, th, columnIndex) {
    		let startX, startWidth;
    
    		handle.addEventListener("mousedown", (e) => {
    			e.preventDefault(); // Prevent text selection
    			e.stopPropagation(); // Prevent header click events
    			startX = e.clientX;
    			startWidth = parseInt(
    				document.defaultView.getComputedStyle(th).width,
    				10,
    			);
    			document.body.style.cursor = "col-resize";
    			document.body.style.userSelect = "none"; // Prevent text selection during drag
    			document.addEventListener("mousemove", doDrag);
    			document.addEventListener("mouseup", stopDrag);
    		});
    
    		const doDrag = (e) => {
    			const minWidthPx = this.getMinColumnWidthInPixels();
    			const newWidth = startWidth + e.clientX - startX;
    			const width = Math.max(minWidthPx, newWidth);
    			th.style.width = width + "px";
    			th.style.minWidth = width + "px"; // Must update minWidth to allow shrinking below current size
    			// Update column width in config
    			this.columns[columnIndex].width = width + "px";
    		};
    
    		const stopDrag = () => {
    			document.body.style.cursor = ""; // Reset cursor
    			document.body.style.userSelect = ""; // Reset text selection
    			document.removeEventListener("mousemove", doDrag);
    			document.removeEventListener("mouseup", stopDrag);
    		};
    	}
    
    	/**
    	 * Handles column header click to cycle through sort states (asc -> desc -> none).
    	 * @param {string} columnId - ID of the column to sort
    	 */
    	handleSort(columnId) {
    		if (this.sortColumnId === columnId) {
    			// Cycle through: asc -> desc -> none
    			if (this.sortDirection === "asc") {
    				this.sortDirection = "desc";
    			} else if (this.sortDirection === "desc") {
    				this.sortColumnId = null;
    				this.sortDirection = null;
    			}
    		} else {
    			this.sortColumnId = columnId;
    			this.sortDirection = "asc";
    		}
    
    		this.applyFiltersAndSort();
    		this.render();
    	}
    
    	/**
    	 * Parses a numeric filter string into operator and value.
    	 * @param {string} value - Filter string (e.g., '>50', '<=100', '42')
    	 * @returns {NumericFilter|null} Parsed filter object, or null if invalid
    	 */
    	parseNumericFilter(value) {
    		const trimmed = value.trim();
    		if (!trimmed) return null;
    
    		const match = trimmed.match(/^(==|!=|>=|<=|>|<)?\s*(-?\d+\.?\d*)$/);
    		if (!match) return null;
    
    		const operator = match[1] || "==";
    		const number = parseFloat(match[2]);
    
    		if (isNaN(number)) return null;
    
    		return { operator, value: number };
    	}
    
    	/**
    	 * Applies a numeric filter comparison to a cell value.
    	 * @param {*} cellValue - Cell value to test
    	 * @param {NumericFilter} filter - Parsed numeric filter
    	 * @returns {boolean} True if value passes the filter
    	 */
    	applyNumericFilter(cellValue, filter) {
    		if (!filter) return true;
    
    		const value = parseFloat(cellValue);
    		if (isNaN(value)) return false;
    
    		switch (filter.operator) {
    			case "==":
    				return value === filter.value;
    			case "!=":
    				return value !== filter.value;
    			case ">":
    				return value > filter.value;
    			case "<":
    				return value < filter.value;
    			case ">=":
    				return value >= filter.value;
    			case "<=":
    				return value <= filter.value;
    			default:
    				return true;
    		}
    	}
    
    	/**
    	 * Gets the filter tooltip text for a column.
    	 * @param {ColumnConfig} col - Column configuration
    	 * @returns {string} Tooltip text explaining filter syntax
    	 */
    	getFilterTooltip(col) {
    		// Check for custom tooltip in column definition
    		if (col.filterTooltip) {
    			return col.filterTooltip;
    		}
    
    		// Default tooltips based on type
    		if (col.type === "number") {
    			return _TABLE_CONSTS.FILTER_TOOLTIPS.NUMBER;
    		}
    		return _TABLE_CONSTS.FILTER_TOOLTIPS.DEFAULT;
    	}
    
    	/**
    	 * Calculates statistics or summary info for a column.
    	 * For number columns: shows range, mean, and median.
    	 * For other types: shows unique value count.
    	 * @param {ColumnConfig} col - Column configuration
    	 * @returns {string} HTML string with column statistics
    	 */
    	calculateColumnInfo(col) {
    		// Check for custom info function in column definition
    		if (col.infoFunction) {
    			const columnData = this.data
    				.map((row) => row[col.key])
    				.filter((val) => val !== null && val !== undefined);
    			const result = col.infoFunction(columnData, col);
    			return typeof result === "string" ? result : result.outerHTML || "";
    		}
    
    		// Default statistical calculations
    		const columnData = this.data
    			.map((row) => row[col.key])
    			.filter((val) => val !== null && val !== undefined);
    
    		if (columnData.length === 0) {
    			return "No data";
    		}
    
    		if (col.type === "number") {
    			const numbers = columnData.filter((val) => typeof val === "number");
    			if (numbers.length === 0) return "No numeric data";
    
    			const min = Math.min(...numbers);
    			const max = Math.max(...numbers);
    			const sum = numbers.reduce((a, b) => a + b, 0);
    			const mean = sum / numbers.length;
    
    			// Calculate median
    			const sorted = [...numbers].sort((a, b) => a - b);
    			const median =
    				sorted.length % 2 === 0
    					? (sorted[sorted.length / 2 - 1] +
    							sorted[sorted.length / 2]) /
    						2
    					: sorted[Math.floor(sorted.length / 2)];
    
    			return `R=[${min.toLocaleString()}, ${max.toLocaleString()}] μ=${mean.toFixed(1)} x̃=${median.toLocaleString()}`;
    		} else {
    			// For string/other types, show unique count
    			const uniqueValues = new Set(columnData.map((val) => String(val)));
    			const count = uniqueValues.size;
    			return `${count} unique value${count === 1 ? "" : "s"}`;
    		}
    	}
    
    	/**
    	 * Handles filter input changes for a column.
    	 * @param {string} columnId - Column identifier
    	 * @param {string} columnKey - Column key for data access
    	 * @param {string} filterValue - Raw filter input value
    	 * @param {string} type - Column data type
    	 * @param {HTMLInputElement} inputElement - Filter input element
    	 * @param {ColumnConfig} col - Column configuration
    	 */
    	handleFilter(columnId, columnKey, filterValue, type, inputElement, col) {
    		if (!filterValue) {
    			delete this.filters[columnId];
    			inputElement.style.backgroundColor = "";
    		} else {
    			let isValid = true;
    			let customFilter = null;
    
    			// col is already passed in
    			if (col?.filterFunction) {
    				try {
    					customFilter = col.filterFunction(filterValue);
    					// If custom function returns null, fall back to default
    					if (customFilter === null) {
    						customFilter = null;
    						if (type === "number") {
    							const numFilter =
    								this.parseNumericFilter(filterValue);
    							isValid = numFilter !== null;
    						}
    					} else {
    						isValid = typeof customFilter === "function";
    					}
    				} catch (e) {
    					isValid = false;
    				}
    			} else if (type === "number") {
    				const numFilter = this.parseNumericFilter(filterValue);
    				isValid = numFilter !== null;
    			}
    
    			this.filters[columnId] = {
    				key: columnKey, // Store the key for data access
    				value: filterValue,
    				type: type,
    				valid: isValid,
    				customFilter: customFilter,
    			};
    
    			inputElement.style.backgroundColor = isValid
    				? ""
    				: _TABLE_CONSTS.COLORS.ERROR_BG;
    		}
    
    		this.currentPage = 1;
    		this.applyFiltersAndSort();
    		this.validateCurrentPage();
    		this.render();
    	}
    
    	/**
    	 * Clears the filter for a single column.
    	 * @param {string} columnId - Column identifier
    	 * @param {HTMLInputElement} inputElement - Filter input element
    	 */
    	clearFilter(columnId, inputElement) {
    		inputElement.value = "";
    		delete this.filters[columnId];
    		inputElement.style.backgroundColor = "";
    		this.currentPage = 1;
    		this.applyFiltersAndSort();
    		this.validateCurrentPage();
    		this.render();
    	}
    
    	/**
    	 * Applies all active filters and sorting to the data.
    	 * Updates this.filteredData with the result.
    	 */
    	applyFiltersAndSort() {
    		// Start with all data
    		let filtered = [...this.data];
    
    		filtered = filtered.filter((row) => {
    			for (const [columnId, filter] of Object.entries(this.filters)) {
    				if (!filter.valid) continue;
    
    				// Get cellValue using the stored key (supports nested keys)
    				const cellValue = this.getNestedValue(row, filter.key);
    
    				// Apply custom filter if available
    				if (filter.customFilter) {
    					try {
    						if (!filter.customFilter(cellValue)) {
    							return false;
    						}
    					} catch (e) {
    						// If custom filter fails, treat as no match
    						return false;
    					}
    				} else if (filter.type === "number") {
    					const numFilter = this.parseNumericFilter(filter.value);
    					if (
    						numFilter &&
    						!this.applyNumericFilter(cellValue, numFilter)
    					) {
    						return false;
    					}
    				} else {
    					if (cellValue === null || cellValue === undefined)
    						return false;
    					const strValue = String(cellValue).toLowerCase();
    					const filterStr = filter.value.toLowerCase();
    
    					if (filterStr.includes("*")) {
    						const regex = new RegExp(
    							"^" + filterStr.replace(/\*/g, ".*") + "$",
    						);
    						if (!regex.test(strValue)) return false;
    					} else {
    						if (!strValue.includes(filterStr)) return false;
    					}
    				}
    			}
    			return true;
    		});
    
    		// Apply sorting
    		if (this.sortColumnId) {
    			// Find the column config for custom sort function
    			const columnConfig = this.columns.find(
    				(col) => this.getColumnId(col) === this.sortColumnId,
    			);
    			const sortFunction = columnConfig?.sortFunction;
    
    			filtered.sort((a, b) => {
    				// Get values using nested key support (use column's key, not id)
    				let aVal = this.getNestedValue(a, columnConfig.key);
    				let bVal = this.getNestedValue(b, columnConfig.key);
    
    				// Apply custom sort function if provided
    				if (sortFunction) {
    					aVal = sortFunction(aVal, a);
    					bVal = sortFunction(bVal, b);
    				}
    
    				// Handle nulls
    				if (aVal === null || aVal === undefined) return 1;
    				if (bVal === null || bVal === undefined) return -1;
    
    				let comparison = 0;
    				if (typeof aVal === "number" && typeof bVal === "number") {
    					comparison = aVal - bVal;
    				} else {
    					comparison = String(aVal).localeCompare(String(bVal));
    				}
    
    				return this.sortDirection === "desc" ? -comparison : comparison;
    			});
    		}
    
    		this.filteredData = filtered;
    	}
    
    	/**
    	 * Gets the data rows for the current page.
    	 * @returns {Array<Object>} Array of row objects for the current page
    	 */
    	getPageData() {
    		const start = (this.currentPage - 1) * this.pageSize;
    		const end = start + this.pageSize;
    		return this.filteredData.slice(start, end);
    	}
    
    	/**
    	 * Calculates the total number of pages based on filtered data and page size.
    	 * @returns {number} Total page count
    	 */
    	getTotalPages() {
    		return Math.ceil(this.filteredData.length / this.pageSize);
    	}
    
    	/**
    	 * Validates and adjusts currentPage to be within valid bounds.
    	 * @private
    	 */
    	validateCurrentPage() {
    		const totalPages = this.getTotalPages();
    		if (this.currentPage > totalPages && totalPages > 0) {
    			this.currentPage = totalPages;
    		} else if (this.currentPage < 1) {
    			this.currentPage = 1;
    		}
    	}
    
    	/**
    	 * Renders the complete table including data rows, pagination, and icons.
    	 */
    	render() {
    		this.renderTable();
    		this.renderPagination();
    		this.updateSortIcons();
    		this.updateInfoRow();
    	}
    
    	/**
    	 * Updates the sort indicator icons in column headers.
    	 * @private
    	 */
    	updateSortIcons() {
    		const headers = this.headerRow.querySelectorAll("th");
    		headers.forEach((th, index) => {
    			const col = this.columns[index];
    			const sortIcon = th.querySelector(`.${this.cssClass("sort-icon")}`);
    			if (!sortIcon) return;
    
    			if (this.sortColumnId === this.getColumnId(col)) {
    				if (this.sortDirection === "asc") {
    					sortIcon.innerHTML = _TABLE_CONSTS.ICONS.sortUp;
    					sortIcon.style.opacity =
    						_TABLE_CONSTS.FEEDBACK.ICON_OPACITY_ACTIVE;
    				} else if (this.sortDirection === "desc") {
    					sortIcon.innerHTML = _TABLE_CONSTS.ICONS.sortDown;
    					sortIcon.style.opacity =
    						_TABLE_CONSTS.FEEDBACK.ICON_OPACITY_ACTIVE;
    				}
    			} else {
    				sortIcon.innerHTML = _TABLE_CONSTS.ICONS.sort;
    				sortIcon.style.opacity =
    					_TABLE_CONSTS.FEEDBACK.ICON_OPACITY_INACTIVE;
    			}
    		});
    	}
    
    	/**
    	 * Updates the info row with recalculated column statistics.
    	 * @private
    	 */
    	updateInfoRow() {
    		if (!this.showInfo || !this.infoRow) return;
    
    		const infoCells = this.infoRow.querySelectorAll("td");
    		infoCells.forEach((cell, index) => {
    			const col = this.columns[index];
    			cell.innerHTML = this.calculateColumnInfo(col);
    		});
    	}
    
    	/**
    	 * Renders the table body with current page data.
    	 * @private
    	 */
    	renderTable() {
    		this.tbody.innerHTML = "";
    
    		const pageData = this.getPageData();
    
    		if (pageData.length === 0) {
    			const tr = this.createStyledElement("tr", "empty-row");
    			const td = this.createStyledElement("td", "empty-cell", {
    				textAlign: "center",
    				padding: _TABLE_CONSTS.SPACING.PADDING_CELL,
    				fontStyle: "italic",
    				color: _TABLE_CONSTS.COLORS.MUTED_TEXT,
    			});
    			td.colSpan = this.columns.length;
    			td.textContent = _TABLE_CONSTS.MESSAGES.NO_DATA;
    			tr.appendChild(td);
    			this.tbody.appendChild(tr);
    			return;
    		}
    
    		pageData.forEach((row) => {
    			const tr = this.createStyledElement("tr", "data-row");
    
    			this.columns.forEach((col) => {
    				const tdStyles = {
    					padding: _TABLE_CONSTS.SPACING.PADDING_CELL,
    					borderBottom: `${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}`,
    				};
    
    				if (col.align) {
    					tdStyles.textAlign = col.align;
    				}
    
    				const td = this.createStyledElement(
    					"td",
    					"data-cell",
    					tdStyles,
    				);
    				let value;
    				try {
    					value = this.getNestedValue(row, col.key);
    				} catch (e) {
    					console.error(
    						`Error accessing key '${col.key}' in row '${row}' for col '${col}'. error: '${e}'`,
    					);
    					console.error("col", col);
    					console.error("row", row);
    					console.error("this.data", this.data);
    					console.error("this.columns", this.columns);
    					console.error("this.filteredData", this.filteredData);
    					console.error("this.pageData", pageData);
    					console.error("this.tbody", this.tbody);
    					throw e;
    				}
    
    				// Check for custom renderer in column definition
    				if (col.renderer) {
    					const rendered = col.renderer(value, row, col);
    					if (typeof rendered === "string") {
    						td.innerHTML = rendered;
    					} else {
    						td.appendChild(rendered);
    					}
    				} else {
    					// Default rendering
    					if (value === null || value === undefined) {
    						td.textContent = "";
    					} else if (
    						col.type === "number" &&
    						typeof value === "number"
    					) {
    						td.textContent = value.toLocaleString();
    					} else {
    						td.textContent = String(value);
    					}
    				}
    
    				tr.appendChild(td);
    			});
    
    			this.tbody.appendChild(tr);
    		});
    	}
    
    	/**
    	 * Renders the pagination controls and attaches event listeners.
    	 * @private
    	 */
    	renderPagination() {
    		const totalPages = this.getTotalPages();
    		const paginationHTML = this.createPaginationHTML(totalPages);
    
    		this.paginationBottom.innerHTML = paginationHTML;
    
    		// Clear old listeners to prevent memory leaks
    		this.paginationListeners = [];
    
    		// Add page button listeners
    		this.paginationBottom.querySelectorAll("button").forEach((btn) => {
    			const handler = (e) => {
    				const page = parseInt(e.target.dataset.page);
    				if (!isNaN(page)) {
    					this.currentPage = page;
    					this.render();
    				}
    			};
    			btn.addEventListener("click", handler);
    			this.paginationListeners.push({
    				element: btn,
    				event: "click",
    				handler,
    			});
    		});
    
    		// Add page size selector listener
    		const pageSizeSelect = this.paginationBottom.querySelector(
    			`.${this.cssClass("page-size-select")}`,
    		);
    		if (pageSizeSelect) {
    			const handler = (e) => {
    				this.setPageSize(parseInt(e.target.value));
    			};
    			pageSizeSelect.addEventListener("change", handler);
    			this.paginationListeners.push({
    				element: pageSizeSelect,
    				event: "change",
    				handler,
    			});
    		}
    
    		// Add export CSV button listeners
    		const exportDownloadBtn = this.paginationBottom.querySelector(
    			`.${this.cssClass("export-download-btn")}`,
    		);
    		if (exportDownloadBtn) {
    			const handler = () => {
    				this.exportAndDownloadCSV();
    			};
    			exportDownloadBtn.addEventListener("click", handler);
    			this.paginationListeners.push({
    				element: exportDownloadBtn,
    				event: "click",
    				handler,
    			});
    		}
    
    		const exportCopyBtn = this.paginationBottom.querySelector(
    			`.${this.cssClass("export-copy-btn")}`,
    		);
    		if (exportCopyBtn) {
    			const handler = () => {
    				this.copyCSVToClipboard();
    			};
    			exportCopyBtn.addEventListener("click", handler);
    			this.paginationListeners.push({
    				element: exportCopyBtn,
    				event: "click",
    				handler,
    			});
    		}
    
    		// Add clear filters button listener
    		const clearBtn = this.paginationBottom.querySelector(
    			`.${this.cssClass("clear-filters-btn")}`,
    		);
    		if (clearBtn) {
    			const handler = () => {
    				this.clearAllFilters();
    			};
    			clearBtn.addEventListener("click", handler);
    			this.paginationListeners.push({
    				element: clearBtn,
    				event: "click",
    				handler,
    			});
    		}
    	}
    
    	/**
    	 * Creates the HTML string for pagination controls.
    	 * @param {number} totalPages - Total number of pages
    	 * @returns {string} HTML string for pagination
    	 * @private
    	 */
    	createPaginationHTML(totalPages) {
    		let html =
    			'<div style="display: flex; justify-content: space-between; align-items: center;">';
    
    		// Left side - controls
    		html += '<div style="display: flex; align-items: center; gap: 10px;">';
    		html += this.createExportCSVButton();
    		if (this.showFilters) {
    			const clearBtnStyle = `border: ${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}; background: white; padding: ${_TABLE_CONSTS.SPACING.PADDING_BUTTON}; cursor: pointer; border-radius: 3px;`;
    			html += `<button class="${this.cssClass("clear-filters-btn")}" style="${clearBtnStyle}">${_TABLE_CONSTS.MESSAGES.CLEAR_FILTERS}</button>`;
    		}
    		html += this.createPageSizeSelector();
    		html += "</div>";
    
    		if (totalPages <= 1) {
    			html += "</div>";
    			return html;
    		}
    
    		// Right side - pagination controls
    		html += '<div style="display: flex; align-items: center; gap: 2px;">';
    
    		// Previous button
    		const prevBtnStyle = `min-width: ${_TABLE_CONSTS.PAGINATION.BUTTON_MIN_WIDTH}; padding: ${_TABLE_CONSTS.SPACING.PADDING_BUTTON}; border: ${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}; background: white; cursor: pointer;`;
    		html += `<button class="${this.cssClass("pagination-btn")}" style="${prevBtnStyle}" ${this.currentPage === 1 ? "disabled" : ""} data-page="${this.currentPage - 1}">${_TABLE_CONSTS.ICONS.prev}</button>`;
    
    		// Page buttons - always show 10 elements for consistent width
    		const pageButtons = this.generatePageButtons(totalPages);
    		pageButtons.forEach((item) => {
    			if (item.type === "page") {
    				const isActive = item.page === this.currentPage;
    				const activeBg = isActive
    					? _TABLE_CONSTS.COLORS.BORDER
    					: "white";
    				const pageBtnStyle = `min-width: ${_TABLE_CONSTS.PAGINATION.BUTTON_MIN_WIDTH}; padding: ${_TABLE_CONSTS.SPACING.PADDING_BUTTON}; border: ${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}; background: ${activeBg}; cursor: pointer;`;
    				html += `<button class="${this.cssClass("pagination-btn")}" style="${pageBtnStyle}" ${isActive ? "disabled" : ""} data-page="${item.page}">${item.page}</button>`;
    			} else if (item.type === "dots") {
    				html += `<span class="${this.cssClass("pagination-dots")}" style="min-width: ${_TABLE_CONSTS.PAGINATION.BUTTON_MIN_WIDTH}; padding: ${_TABLE_CONSTS.SPACING.PADDING_BUTTON}; text-align: center; display: inline-block;">…</span>`;
    			}
    		});
    
    		// Next button
    		const nextBtnStyle = `min-width: ${_TABLE_CONSTS.PAGINATION.BUTTON_MIN_WIDTH}; padding: ${_TABLE_CONSTS.SPACING.PADDING_BUTTON}; border: ${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}; background: white; cursor: pointer;`;
    		html += `<button class="${this.cssClass("pagination-btn")}" style="${nextBtnStyle}" ${this.currentPage === totalPages ? "disabled" : ""} data-page="${this.currentPage + 1}">${_TABLE_CONSTS.ICONS.next}</button>`;
    
    		html += "</div>"; // End pagination controls
    		html += "</div>"; // End main container
    
    		return html;
    	}
    
    	/**
    	 * Generates page button configuration array with ellipsis handling.
    	 * @param {number} totalPages - Total number of pages
    	 * @returns {Array<{type: 'page'|'dots', page?: number}>} Array of page button configs
    	 * @private
    	 */
    	generatePageButtons(totalPages) {
    		if (totalPages <= 10) {
    			// Show all pages
    			return Array.from({ length: totalPages }, (_, i) => ({
    				type: "page",
    				page: i + 1,
    			}));
    		}
    
    		// Always show exactly 10 elements (pages + dots)
    		const items = [];
    
    		// Always show page 1
    		items.push({ type: "page", page: 1 });
    
    		// Determine the window around current page
    		let start = Math.max(2, this.currentPage - 3);
    		let end = Math.min(totalPages - 1, this.currentPage + 3);
    
    		// Add dots after 1 if needed
    		if (start > 2) {
    			items.push({ type: "dots" });
    			// Adjust to maintain 10 elements total
    			if (end === totalPages - 1) start = Math.max(start, totalPages - 7);
    		} else {
    			start = 2;
    		}
    
    		// Add middle pages
    		for (let i = start; i <= end && items.length < 9; i++) {
    			items.push({ type: "page", page: i });
    		}
    
    		// Add dots before last page if needed
    		if (end < totalPages - 1) {
    			items.push({ type: "dots" });
    		}
    
    		// Always show last page (if different from 1)
    		if (totalPages > 1) {
    			items.push({ type: "page", page: totalPages });
    		}
    
    		// Pad with pages if we have less than 10 items
    		while (items.length < 10 && totalPages > items.length) {
    			const initialLength = items.length;
    
    			// Find gaps and fill them
    			for (let i = 1; i < items.length; i++) {
    				if (
    					items[i].type === "page" &&
    					items[i - 1].type === "page" &&
    					items[i].page - items[i - 1].page > 1
    				) {
    					items.splice(i, 0, {
    						type: "page",
    						page: items[i - 1].page + 1,
    					});
    					break;
    				}
    			}
    
    			// Safety check: if no progress was made, break to avoid infinite loop
    			if (items.length === initialLength) {
    				break;
    			}
    		}
    
    		return items.slice(0, 10); // Ensure exactly 10 elements
    	}
    
    	/**
    	 * Creates the HTML string for the CSV export button group.
    	 * @returns {string} HTML string for export buttons
    	 * @private
    	 */
    	createExportCSVButton() {
    		const containerStyle = `display: flex; align-items: center; gap: 4px; border: ${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}; border-radius: 4px; padding: 2px; margin: 3px;`;
    		const btnStyle = `border: none; background: none; padding: ${_TABLE_CONSTS.SPACING.PADDING_BUTTON}; cursor: pointer; display: flex; align-items: center; gap: 4px;`;
    		const copyBtnStyle = `border: none; background: none; padding: ${_TABLE_CONSTS.SPACING.PADDING_BUTTON}; cursor: pointer; display: flex; align-items: center;`;
    		const separatorStyle = `border-left: ${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}; height: 20px;`;
    
    		return `<div class="${this.cssClass("export-container")}" style="${containerStyle}">
                <button class="${this.cssClass("export-download-btn")}" style="${btnStyle}">
                    ${_TABLE_CONSTS.MESSAGES.EXPORT_CSV} ${_TABLE_CONSTS.ICONS.download}
                </button>
                <div style="${separatorStyle}"></div>
                <button class="${this.cssClass("export-copy-btn")}" style="${copyBtnStyle}" title="${_TABLE_CONSTS.MESSAGES.COPY_TITLE}">
                    ${_TABLE_CONSTS.ICONS.copy}
                </button>
            </div>`;
    	}
    
    	/**
    	 * Creates the HTML string for the page size selector dropdown.
    	 * @returns {string} HTML string for page size selector
    	 * @private
    	 */
    	createPageSizeSelector() {
    		const options = this.pageSizeOptions
    			.map(
    				(size) =>
    					`<option value="${size}" ${this.pageSize === size ? "selected" : ""}>${size}</option>`,
    			)
    			.join("");
    
    		const selectStyle = `border: ${_TABLE_CONSTS.SPACING.BORDER_WIDTH} solid ${_TABLE_CONSTS.COLORS.BORDER}; padding: 2px 4px; margin: 0 4px;`;
    
    		return `<label class="${this.cssClass("page-size-label")}">Show
                <select class="${this.cssClass("page-size-select")}" style="${selectStyle}">
                    ${options}
                </select>
                entries</label>`;
    	}
    
    	/**
    	 * Replaces the table data and re-renders.
    	 * @param {Array<Object>} data - New array of row data objects
    	 */
    	setData(data) {
    		this.data = data;
    		this.currentPage = 1;
    		this.applyFiltersAndSort();
    		this.validateCurrentPage();
    		this.render();
    	}
    
    	/**
    	 * Adds a single row to the table data and re-renders.
    	 * @param {Object} row - Row data object to add
    	 */
    	addRow(row) {
    		this.data.push(row);
    		this.applyFiltersAndSort();
    		this.validateCurrentPage();
    		this.render();
    	}
    
    	/**
    	 * Changes the number of rows displayed per page.
    	 * Resets to the first page after changing.
    	 * @param {number} size - New page size
    	 */
    	setPageSize(size) {
    		this.pageSize = size;
    		this.currentPage = 1;
    		this.applyFiltersAndSort();
    		this.validateCurrentPage();
    		this.render();
    	}
    
    	/**
    	 * Exports the filtered data to a CSV string.
    	 * Handles escaping of commas, quotes, and newlines.
    	 * @returns {string} CSV formatted string
    	 */
    	exportCSV() {
    		const csv = [];
    
    		// Headers
    		csv.push(this.columns.map((col) => col.label || col.key).join(","));
    
    		// Data
    		this.filteredData.forEach((row) => {
    			const values = this.columns.map((col) => {
    				const val = row[col.key];
    				if (val === null || val === undefined) return "";
    				let str = String(val);
    
    				// Escape newlines in cell content
    				str = str.replace(/\n/g, "\\n");
    
    				// Escape if contains comma or quotes
    				if (str.includes(",") || str.includes('"')) {
    					return '"' + str.replace(/"/g, '""') + '"';
    				}
    				return str;
    			});
    			csv.push(values.join(","));
    		});
    
    		return csv.join("\n");
    	}
    
    	/**
    	 * Exports the filtered data to CSV and triggers a file download.
    	 */
    	exportAndDownloadCSV() {
    		const csv = this.exportCSV();
    		const blob = new Blob([csv], { type: "text/csv" });
    		const url = URL.createObjectURL(blob);
    		const a = document.createElement("a");
    		a.href = url;
    		a.download = _TABLE_CONSTS.MESSAGES.DOWNLOAD_FILENAME;
    		a.click();
    		URL.revokeObjectURL(url);
    	}
    
    	/**
    	 * Copies the filtered data as CSV to the clipboard.
    	 * Shows visual feedback on success.
    	 * @returns {Promise<void>}
    	 */
    	async copyCSVToClipboard() {
    		const csv = this.exportCSV();
    		try {
    			await navigator.clipboard.writeText(csv);
    			// Provide visual feedback
    			const copyBtn = this.paginationBottom.querySelector(
    				`.${this.cssClass("export-copy-btn")}`,
    			);
    			if (copyBtn) {
    				const originalTitle = copyBtn.title;
    				copyBtn.title = _TABLE_CONSTS.MESSAGES.COPY_SUCCESS;
    				copyBtn.style.color = _TABLE_CONSTS.COLORS.SUCCESS_COLOR;
    				setTimeout(() => {
    					copyBtn.title = originalTitle;
    					copyBtn.style.color = "";
    				}, _TABLE_CONSTS.FEEDBACK.SUCCESS_TIMEOUT);
    			}
    		} catch (err) {
    			console.error("Failed to copy CSV to clipboard:", err);
    			// Fallback for older browsers
    			this.fallbackCopyToClipboard(csv);
    		}
    	}
    
    	/**
    	 * Fallback clipboard copy method for older browsers.
    	 * Uses execCommand('copy') as a fallback.
    	 * @param {string} text - Text to copy to clipboard
    	 * @private
    	 */
    	fallbackCopyToClipboard(text) {
    		const textArea = document.createElement("textarea");
    		textArea.value = text;
    		textArea.style.position = "fixed";
    		textArea.style.left = "-999999px";
    		textArea.style.top = "-999999px";
    		document.body.appendChild(textArea);
    		textArea.focus();
    		textArea.select();
    		try {
    			document.execCommand("copy");
    			const copyBtn = this.paginationBottom.querySelector(
    				`.${this.cssClass("export-copy-btn")}`,
    			);
    			if (copyBtn) {
    				const originalTitle = copyBtn.title;
    				copyBtn.title = _TABLE_CONSTS.MESSAGES.COPY_SUCCESS;
    				copyBtn.style.color = _TABLE_CONSTS.COLORS.SUCCESS_COLOR;
    				setTimeout(() => {
    					copyBtn.title = originalTitle;
    					copyBtn.style.color = "";
    				}, _TABLE_CONSTS.FEEDBACK.SUCCESS_TIMEOUT);
    			}
    		} catch (err) {
    			console.error("Fallback copy failed:", err);
    		}
    		document.body.removeChild(textArea);
    	}
    
    	/**
    	 * Clears all active filters and resets to the first page.
    	 */
    	clearAllFilters() {
    		this.filters = {};
    		this.container
    			.querySelectorAll(`.${this.cssClass("filter-input")}`)
    			.forEach((input) => {
    				input.value = "";
    				input.style.backgroundColor = "";
    			});
    		this.currentPage = 1;
    		this.applyFiltersAndSort();
    		this.render();
    	}
    }
    
    </script>

        <!-- begin 'app.js' -->
    <script>
    // === Configuration ===
    
    const urlParams = new URLSearchParams(window.location.search);
    
    // CONFIG object used by ClusteringLoader and AttentionPedia
    const CONFIG = {
      dataUrl: urlParams.get("data") || "ablation_results.json",
      clustering_methods_url: "../features/clustering_methods.json",
      clustering_meta_url: "../features/clustering/clustering_meta.json",
      clustering_linkage_url: "../features/clustering/linkage.json",
      cluster_labels_url: "../features/clustering/cluster_labels.json",
      clustering_hdbscan_meta_url:
        "../features/clustering_hdbscan/clustering_meta.json",
      clustering_hdbscan_partitions_url:
        "../features/clustering_hdbscan/partitions.json",
      clustering_hdbscan_labels_url:
        "../features/clustering_hdbscan/cluster_labels.json",
      clustering_leiden_meta_url:
        "../features/clustering_leiden/clustering_meta.json",
      clustering_leiden_partitions_url:
        "../features/clustering_leiden/partitions.json",
      clustering_leiden_labels_url:
        "../features/clustering_leiden/cluster_labels.json",
      attnpedia_url: "../vis/attnpedia/ap.json",
    };
    
    const DEFAULT_HEAD = "gpt2-small:L5:H5";
    const DEFAULT_CUT_HEIGHT = 5.0;
    
    // === Metric definitions ===
    
    const METRIC_GROUPS = {
      Loss: ["baseline_repeated_loss", "ablated_repeated_loss", "loss_increase"],
      "Induction Scores": ["prefix_score", "copying_score", "ov_copying_score"],
      "Prefix (legacy)": ["prefix_score_legacy"],
      ICL: ["baseline_icl_score", "ablated_icl_score", "icl_degradation"],
    };
    
    const DEFAULT_VISIBLE_GROUPS = new Set(["Loss", "Induction Scores", "ICL"]);
    
    const DISTRIBUTION_METRICS = [
      "loss_increase",
      "prefix_score",
      "copying_score",
      "ov_copying_score",
      "icl_degradation",
    ];
    
    const DELTA_COLUMNS = {
      loss_increase: { higher_is_worse: true, thresholds: [0.1, 0.5] },
      icl_degradation: { higher_is_worse: true, thresholds: [0.05, 0.2] },
      prefix_score: { higher_is_worse: false, thresholds: [0.1, 0.3] },
      prefix_score_legacy: { higher_is_worse: false, thresholds: [0.1, 0.3] },
      copying_score: { higher_is_worse: false, thresholds: [0.5, 2.0] },
      ov_copying_score: { higher_is_worse: false, thresholds: [0.05, 0.2] },
    };
    
    const COLUMN_LABELS = {
      head: "Head",
      cluster: "Cluster",
      classifications: "Class",
      ablation_method: "Method",
      baseline_repeated_loss: "Base Loss",
      ablated_repeated_loss: "Abl. Loss",
      loss_increase: "\u0394 Loss",
      prefix_score: "Prefix",
      prefix_score_legacy: "Pfx Leg.",
      copying_score: "Copying",
      ov_copying_score: "OV Copy",
      baseline_icl_score: "Base ICL",
      ablated_icl_score: "Abl. ICL",
      icl_degradation: "\u0394 ICL",
    };
    
    const METRIC_DISPLAY_NAMES = {
      loss_increase: "Loss Increase (\u0394 Loss)",
      prefix_score: "Prefix Matching Score",
      copying_score: "Copying Score",
      ov_copying_score: "OV Copying Score",
      icl_degradation: "ICL Degradation",
    };
    
    // === Chart margins ===
    const ABLATION_CHART_MARGIN = { top: 28, right: 20, bottom: 40, left: 50 };
    
    // === Helpers ===
    
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    
    // === State ===
    
    let allData = null;
    let clustering = null;
    let attnpedia = null;
    let apData = null;
    let clusteringAvailable = false;
    let clusterStatsTable = null;
    
    let selectedCluster = null; // null = "show all", number = single cluster
    let hoveredCluster = null; // used in show-all mode for highlight
    let modelFilter = "all"; // "all" | "gpt2" | "pythia"
    let selectedMethod = null; // null = first available
    let chartType = "boxplot"; // "histogram" | "boxplot" | "sina" | "lettervalue"
    let logScale = false; // log frequency axis for histograms
    let sortMode = "ks-d"; // "none" | "mean" | "median" | "ks-d"
    let showRefBoxplot = false; // show grey reference boxplot for all clusters combined
    let visibleGroups = new Set(DEFAULT_VISIBLE_GROUPS);
    let tableClusterFilter = false; // filter table to selected cluster only
    let dataTable = null;
    
    // === Model family helpers ===
    
    function getModelFamily(modelName) {
      if (modelName.startsWith("gpt2") || modelName === "distillgpt2")
        return "gpt2";
      if (modelName.startsWith("pythia")) return "pythia";
      return "other";
    }
    
    function matchesModelFilter(modelName) {
      if (modelFilter === "all") return true;
      return getModelFamily(modelName) === modelFilter;
    }
    
    // === Initialization ===
    
    async function init() {
      // Load data sources in parallel
      clustering = new ClusteringLoader();
    
      let ablationResp;
      try {
        ablationResp = await fetch(CONFIG.dataUrl);
      } catch {
        showError("Failed to load data. Serve this directory over HTTP.");
        return;
      }
      if (!ablationResp.ok) {
        showError(`No data found at ${CONFIG.dataUrl}.`);
        return;
      }
    
      // Load ablation data and clustering in parallel
      const [ablationData, clusteringReady, apResp] = await Promise.all([
        ablationResp.json(),
        clustering._ensureLoaded().then(() => clustering.isAvailable()),
        fetch(CONFIG.attnpedia_url)
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null),
      ]);
    
      allData = ablationData;
      apData = apResp;
      clusteringAvailable = clusteringReady;
    
      if (!clusteringReady) {
        const el = document.getElementById("clustering-controls");
        if (el)
          el.innerHTML =
            '<p style="color:#c33;font-size:13px;font-weight:bold;">\u26A0 Clustering data failed to load. Cluster features disabled.</p>';
      }
    
      if (!allData.models || Object.keys(allData.models).length === 0) {
        showError("No model results found in data.");
        return;
      }
    
      // Set up initial clustering state
      if (clusteringReady) {
        await setupClusteringControls();
      }
    
      // Collect all ablation methods
      const methods = new Set();
      for (const modelData of Object.values(allData.models)) {
        for (const r of modelData.results) {
          methods.add(r.ablation_method);
        }
      }
      selectedMethod = [...methods].sort()[0] || null;
      setupMethodSelect([...methods].sort());
    
      // Set up UI
      setupModelFamilyButtons();
      setupChartTypeButtons();
      setupLogScaleButton();
      setupSortSelect();
      setupRefBoxplotToggle();
      setupChartWidthSlider();
      if (clusteringReady) setupMinClusterSizeSlider();
      setupColumnToggles();
    
      // Initial render
      renderClusterChips();
      setupClusterChipHandler();
      createChartContainers();
      renderCharts();
      renderConfigSummary();
      renderTables();
    }
    
    function showError(msg) {
      document.querySelector(".container").innerHTML =
        `<p style="color:#999;text-align:center;padding:60px;">${msg}</p>`;
    }
    
    // === UI Setup ===
    
    async function setupClusteringControls() {
      const availableMethods = clustering.getAvailableMethods();
      const methodSelect = document.getElementById("cluster-method-select");
    
      // Populate method dropdown
      methodSelect.innerHTML = availableMethods
        .map((m) => `<option value="${m}">${m}</option>`)
        .join("");
    
      // Restore saved method, default to leiden, then first available
      const savedMethod = ClusteringConfig.getMethod();
      const initialMethod =
        savedMethod && availableMethods.includes(savedMethod)
          ? savedMethod
          : availableMethods.includes("leiden")
            ? "leiden"
            : availableMethods[0];
      methodSelect.value = initialMethod;
    
      // Initialize the clustering method
      if (initialMethod === "hierarchical") {
        const savedCutHeight = ClusteringConfig.getCutHeight();
        const initialCutHeight = savedCutHeight || DEFAULT_CUT_HEIGHT;
        await clustering.setCutHeight(initialCutHeight);
        setupCutHeightSlider(initialCutHeight);
      } else {
        clustering.setMethod(initialMethod);
      }
    
      updateClusteringControlVisibility();
      updateClusterStats();
    
      // Bind method change
      methodSelect.addEventListener("change", async () => {
        clustering.setMethod(methodSelect.value);
        if (clustering.isHierarchical()) {
          const savedCutHeight = ClusteringConfig.getCutHeight();
          const h = savedCutHeight || DEFAULT_CUT_HEIGHT;
          await clustering.setCutHeight(h);
          setupCutHeightSlider(h);
        }
        updateClusteringControlVisibility();
        updateClusterStats();
        selectedCluster = null;
        renderClusterChips();
        renderCharts();
        renderTables();
      });
    }
    
    let _cutHeightSliderBound = false;
    
    function setupCutHeightSlider(initialValue) {
      const slider = document.getElementById("cut-height-slider");
      const maxH = clustering.getMaxCutHeight() || 20;
      slider.min = 0;
      slider.max = maxH;
      slider.step = (maxH / 1000).toFixed(4);
      slider.value = initialValue;
      document.getElementById("cut-height-value").textContent =
        initialValue.toFixed(2);
    
      if (_cutHeightSliderBound) return;
      _cutHeightSliderBound = true;
    
      let _sliderTimeout = null;
      slider.addEventListener("input", () => {
        const h = parseFloat(slider.value);
        document.getElementById("cut-height-value").textContent = h.toFixed(2);
        clearTimeout(_sliderTimeout);
        _sliderTimeout = setTimeout(async () => {
          await clustering.setCutHeight(h);
          ClusteringConfig.setCutHeight(h);
          updateClusterStats();
    
          selectedCluster = null;
          renderClusterChips();
          renderCharts();
          renderTables();
        }, 50);
      });
    }
    
    function updateClusteringControlVisibility() {
      const isHier = clustering.isHierarchical();
      document.getElementById("cluster-hier-controls").style.display = isHier
        ? ""
        : "none";
      document.getElementById("cluster-param-controls").style.display = isHier
        ? "none"
        : "";
    
      if (!isHier) {
        setupParamSelect();
      }
    }
    
    function setupParamSelect() {
      const info = clustering.getFlatParamInfo();
      if (!info) return;
    
      const paramLabel = document.getElementById("cluster-param-label");
      const oldSelect = document.getElementById("cluster-param-select");
    
      paramLabel.textContent = info.paramName + ":";
    
      // Replace select element to avoid duplicate listeners
      const paramSelect = oldSelect.cloneNode(false);
      paramSelect.id = "cluster-param-select";
      oldSelect.parentNode.replaceChild(paramSelect, oldSelect);
    
      paramSelect.innerHTML = info.paramKeys
        .map((pk) => {
          const meta = info.meta[pk];
          const extra = meta
            ? ` (${meta.n_clusters} clusters${meta.n_outliers ? `, ${meta.n_outliers} outliers` : ""})`
            : "";
          return `<option value="${pk}">${pk}${extra}</option>`;
        })
        .join("");
    
      const savedKey = ClusteringConfig.getParamKey();
      paramSelect.value =
        savedKey && info.paramKeys.includes(savedKey)
          ? savedKey
          : info.paramKeys[0];
    
      // Apply initial param key
      clustering.setParamKey(paramSelect.value);
    
      paramSelect.addEventListener("change", async () => {
        await clustering.setParamKey(paramSelect.value);
        updateClusterStats();
        selectedCluster = null;
        renderClusterChips();
        renderCharts();
        renderTables();
      });
    }
    
    function updateClusterStats() {
      const n = clustering.getNClusters();
      const unclustered = clustering.getUnclusteredCount();
      let text = `(${n} clusters`;
      if (unclustered > 0) text += `, ${unclustered} unclustered`;
      text += ")";
      document.getElementById("n-clusters-label").textContent = text;
    }
    
    function setupMethodSelect(methods) {
      const select = document.getElementById("method-select");
      select.innerHTML = methods
        .map(
          (m) =>
            `<option value="${m}" ${m === selectedMethod ? "selected" : ""}>${m}</option>`,
        )
        .join("");
      select.addEventListener("change", () => {
        selectedMethod = select.value;
        renderCharts();
        renderTables();
      });
    }
    
    function setupModelFamilyButtons() {
      const container = document.getElementById("model-family-buttons");
      const families = ["all", "gpt2", "pythia"];
      const labels = { all: "All", gpt2: "GPT-2", pythia: "Pythia" };
      container.innerHTML = families
        .map(
          (f) =>
            `<button class="family-btn${f === modelFilter ? " active" : ""}" data-family="${f}">${labels[f]}</button>`,
        )
        .join("");
      container.addEventListener("click", (e) => {
        const btn = e.target.closest(".family-btn");
        if (!btn) return;
        modelFilter = btn.dataset.family;
        container
          .querySelectorAll(".family-btn")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.family === modelFilter),
          );
        renderCharts();
        renderTables();
      });
    }
    
    function setupChartTypeButtons() {
      const container = document.getElementById("chart-type-buttons");
      const types = [
        { id: "histogram", label: "Histogram" },
        { id: "boxplot", label: "Box Plot" },
        { id: "sina", label: "Sina" },
        { id: "lettervalue", label: "Letter-Value" },
      ];
      container.innerHTML = types
        .map(
          (t) =>
            `<button class="chart-type-btn${t.id === chartType ? " active" : ""}" data-type="${t.id}">${t.label}</button>`,
        )
        .join("");
      container.addEventListener("click", (e) => {
        const btn = e.target.closest(".chart-type-btn");
        if (!btn) return;
        chartType = btn.dataset.type;
        container
          .querySelectorAll(".chart-type-btn")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.type === chartType),
          );
        renderCharts();
      });
    }
    
    function setupLogScaleButton() {
      const container = document.getElementById("log-scale-button");
      const btn = document.createElement("button");
      btn.className = "chart-type-btn" + (logScale ? " active" : "");
      btn.textContent = "Log";
      btn.addEventListener("click", () => {
        logScale = !logScale;
        btn.classList.toggle("active", logScale);
        renderCharts();
      });
      container.appendChild(btn);
    }
    
    function setupSortSelect() {
      const select = document.getElementById("sort-select");
      select.value = sortMode;
      select.addEventListener("change", () => {
        sortMode = select.value;
        renderCharts();
      });
    }
    
    function setupRefBoxplotToggle() {
      const cb = document.getElementById("show-ref-boxplot");
      if (!cb) return;
      cb.checked = showRefBoxplot;
      cb.addEventListener("change", () => {
        showRefBoxplot = cb.checked;
        renderCharts();
      });
    }
    
    function setupMinClusterSizeSlider() {
      const slider = document.getElementById("min-cluster-size");
      const label = document.getElementById("min-cluster-size-value");
      if (!slider || !clustering) return;
    
      const initial = clustering.getMinClusterSize();
      slider.value = initial;
      label.textContent = initial;
    
      slider.addEventListener("input", async () => {
        const n = parseInt(slider.value);
        label.textContent = n;
        await clustering.setMinClusterSize(n);
        updateClusterStats();
        selectedCluster = null;
        renderClusterChips();
        renderCharts();
        renderTables();
      });
    }
    
    function setupChartWidthSlider() {
      const slider = document.getElementById("chart-width-slider");
      const label = document.getElementById("chart-width-value");
      slider.addEventListener("input", () => {
        const val = slider.value;
        label.textContent = val + "px";
        document
          .querySelector(".charts-grid")
          .style.setProperty("--chart-min-width", val + "px");
        renderCharts();
      });
    }
    
    function setupColumnToggles() {
      const groups = Object.keys(METRIC_GROUPS);
      document.getElementById("column-toggles").innerHTML = groups
        .map(
          (g) =>
            `<label class="chip"><input type="checkbox" ${visibleGroups.has(g) ? "checked" : ""} onchange="toggleGroup('${g}')"> ${g}</label>`,
        )
        .join("");
    }
    
    function toggleGroup(group) {
      if (visibleGroups.has(group)) visibleGroups.delete(group);
      else visibleGroups.add(group);
      renderTables();
    }
    
    function toggleTableClusterFilter() {
      tableClusterFilter = document.getElementById("table-cluster-filter").checked;
      renderTables();
    }
    
    // === Cluster Chips ===
    
    function renderClusterChips() {
      const container = document.getElementById("cluster-chips");
      if (!clustering || !clustering._is_loaded || !clustering._meta) {
        container.innerHTML =
          '<span style="color:#999">Clustering data not available</span>';
        return;
      }
    
      // Get cluster sizes
      const sizes = {};
      for (const [headId, cid] of Object.entries(clustering._assignments)) {
        if (cid === -1) continue;
        sizes[cid] = (sizes[cid] || 0) + 1;
      }
    
      // Sort by size descending
      const sorted = Object.entries(sizes).sort((a, b) => b[1] - a[1]);
      const totalHeads = Object.values(sizes).reduce((a, b) => a + b, 0);
    
      // "Show All" chip + per-cluster chips
      const showAllChip = `<button class="cluster-chip${selectedCluster === null ? " selected" : ""}" data-cluster="all" title="Show all clusters">All <span class="chip-count">${totalHeads}</span></button>`;
    
      const clusterChips = sorted
        .map(([cid, size]) => {
          const id = parseInt(cid);
          const color = clustering.getClusterColor(id);
          const label = clustering.getClusterLabel(id);
          const name = label && label.name ? label.name : `${id}`;
          const isSelected = id === selectedCluster;
          return `<button class="cluster-chip${isSelected ? " selected" : ""}" data-cluster="${id}" style="--chip-color: ${color}" title="Cluster ${id}: ${size} heads">${name} <span class="chip-count">${size}</span></button>`;
        })
        .join("");
    
      container.innerHTML = showAllChip + clusterChips;
    }
    
    function setupClusterChipHandler() {
      const container = document.getElementById("cluster-chips");
      container.addEventListener("click", (e) => {
        const btn = e.target.closest(".cluster-chip");
        if (!btn) return;
        const val = btn.dataset.cluster;
        selectedCluster = val === "all" ? null : parseInt(val);
        renderClusterChips();
        renderCharts();
        renderTables();
      });
    
      // Middle-click: open clustering frontend with this cluster selected
      container.addEventListener("auxclick", (e) => {
        if (e.button !== 1) return;
        const btn = e.target.closest(".cluster-chip");
        if (!btn) return;
        const val = btn.dataset.cluster;
        if (val === "all") return;
        e.preventDefault();
        const id = parseInt(val);
        ClusteringConfig.setHighlightCluster(id);
        window.open(`../vis/clustering/index.html?highlight=${id}`, "_blank");
      });
    }
    
    // === Data helpers ===
    
    /**
     * Get all results as flat array of {head, model, ...metrics},
     * filtered by model family and method.
     */
    function getFilteredResults() {
      if (!allData) return [];
      const results = [];
      for (const [modelName, modelData] of Object.entries(allData.models)) {
        if (!matchesModelFilter(modelName)) continue;
        for (const r of modelData.results) {
          if (selectedMethod && r.ablation_method !== selectedMethod) continue;
          results.push({ ...r, model: modelName });
        }
      }
      return results;
    }
    
    /**
     * Split results into in-cluster and out-of-cluster arrays.
     */
    function splitByCluster(results) {
      if (selectedCluster === null || !clustering || !clustering._is_loaded) {
        return { inCluster: [], outCluster: results };
      }
      const inCluster = [];
      const outCluster = [];
      for (const r of results) {
        const cid = clustering._assignments[r.head];
        if (cid === selectedCluster) {
          inCluster.push(r);
        } else {
          outCluster.push(r);
        }
      }
      return { inCluster, outCluster };
    }
    
    /**
     * Extract numeric values for a metric from results, skipping null/undefined.
     */
    function extractValues(results, metric) {
      return results.map((r) => r[metric]).filter((v) => v != null && !isNaN(v));
    }
    
    /**
     * Group results by cluster ID. Returns array of { clusterId, color, label, results }.
     * Sorted by cluster size descending. Skips unclustered heads (cid === -1).
     */
    function groupByCluster(results) {
      if (!clustering || !clustering._is_loaded) return [];
      const groups = {};
      for (const r of results) {
        const cid = clustering._assignments[r.head];
        if (cid === undefined || cid === -1) continue;
        if (!groups[cid]) groups[cid] = [];
        groups[cid].push(r);
      }
      return Object.entries(groups)
        .sort((a, b) => b[1].length - a[1].length)
        .map(([cid, res]) => {
          const id = parseInt(cid);
          const clLabel = clustering.getClusterLabel(id);
          const name = clLabel && clLabel.name ? clLabel.name : `${id}`;
          return {
            clusterId: id,
            color: clustering.getClusterColor(id),
            label: name,
            results: res,
          };
        });
    }
    
    // === KS Test ===
    
    /**
     * Two-sample Kolmogorov-Smirnov test.
     * Returns { D, pValue } where D is the KS statistic and pValue is the
     * asymptotic approximation.
     */
    function ksTest(sample1, sample2) {
      const n1 = sample1.length;
      const n2 = sample2.length;
      if (n1 === 0 || n2 === 0) return { D: NaN, pValue: NaN };
    
      const s1 = [...sample1].sort((a, b) => a - b);
      const s2 = [...sample2].sort((a, b) => a - b);
    
      // Merge and walk both CDFs
      let i = 0,
        j = 0,
        maxD = 0;
      while (i < n1 || j < n2) {
        const v1 = i < n1 ? s1[i] : Infinity;
        const v2 = j < n2 ? s2[j] : Infinity;
        if (v1 <= v2) i++;
        if (v2 <= v1) j++;
        const d = Math.abs(i / n1 - j / n2);
        if (d > maxD) maxD = d;
      }
    
      // Asymptotic p-value: P ≈ 2 * exp(-2 * n_eff * D^2)
      const nEff = (n1 * n2) / (n1 + n2);
      const pValue = 2 * Math.exp(-2 * nEff * maxD * maxD);
    
      return { D: maxD, pValue: Math.min(pValue, 1) };
    }
    
    function formatKsStat(ks) {
      if (isNaN(ks.D)) return "";
      return `D = ${ks.D.toFixed(2)}`;
    }
    
    function isKsSignificant(ks) {
      return ks.D >= 0.25;
    }
    
    // === Charts (D3 SVG) ===
    
    function createChartContainers() {
      const grid = document.getElementById("charts-grid");
      grid.innerHTML = "";
      for (const metric of DISTRIBUTION_METRICS) {
        const div = document.createElement("div");
        div.className = "chart-cell";
        div.id = `chart-container-${metric}`;
        grid.appendChild(div);
      }
    }
    
    function renderCharts() {
      const results = getFilteredResults();
      // Deduplicate by head (one entry per head, using first matching method)
      const seenHeads = new Set();
      const uniqueResults = [];
      for (const r of results) {
        if (!seenHeads.has(r.head)) {
          seenHeads.add(r.head);
          uniqueResults.push(r);
        }
      }
    
      const showAll = selectedCluster === null && clusteringAvailable;
    
      if (showAll) {
        const clusterGroups = groupByCluster(uniqueResults);
        for (const metric of DISTRIBUTION_METRICS) {
          const groupData = clusterGroups
            .map((cg) => ({
              ...cg,
              values: extractValues(cg.results, metric),
            }))
            .filter((cg) => cg.values.length > 0);
    
          if (groupData.length === 0) {
            const container = document.getElementById(`chart-container-${metric}`);
            if (container) container.innerHTML = "";
            continue;
          }
    
          if (chartType === "histogram") {
            renderHistogramAll(metric, groupData);
          } else if (chartType === "sina") {
            renderSinaAll(metric, groupData);
          } else if (chartType === "lettervalue") {
            renderLetterValueAll(metric, groupData);
          } else {
            renderBoxPlotAll(metric, groupData);
          }
        }
      } else {
        const { inCluster, outCluster } = splitByCluster(uniqueResults);
        for (const metric of DISTRIBUTION_METRICS) {
          const inValues = extractValues(inCluster, metric);
          const outValues = extractValues(outCluster, metric);
    
          if (inValues.length === 0 && outValues.length === 0) {
            const container = document.getElementById(`chart-container-${metric}`);
            if (container) container.innerHTML = "";
            continue;
          }
    
          if (chartType === "histogram") {
            renderHistogram(metric, inValues, outValues);
          } else if (chartType === "sina") {
            renderSina(metric, inValues, outValues);
          } else if (chartType === "lettervalue") {
            renderLetterValue(metric, inValues, outValues);
          } else {
            renderBoxPlot(metric, inValues, outValues);
          }
        }
      }
    }
    
    function renderHistogram(metric, inValues, outValues) {
      const containerId = `chart-container-${metric}`;
      const margin = ABLATION_CHART_MARGIN;
      const { svg, g, innerWidth, innerHeight } = createChartSVG(
        containerId,
        margin,
      );
    
      const allValues = [...inValues, ...outValues];
      if (allValues.length === 0) return;
    
      const rawMin = Math.min(...allValues);
      const rawMax = Math.max(...allValues);
      const min = rawMin === rawMax ? rawMin - 0.5 : rawMin;
      const max = rawMin === rawMax ? rawMax + 0.5 : rawMax;
      const nBins = rawMin === rawMax ? 1 : 20;
      const binWidth = (max - min) / nBins;
    
      function histogram(values) {
        const counts = new Array(nBins).fill(0);
        for (const v of values) {
          let bin = Math.floor((v - min) / binWidth);
          if (bin >= nBins) bin = nBins - 1;
          if (bin < 0) bin = 0;
          counts[bin]++;
        }
        return counts;
      }
    
      const inCounts = histogram(inValues);
      const outCounts = histogram(outValues);
    
      // Normalize to frequency so different-sized groups are comparable
      const inTotal = inValues.length || 1;
      const outTotal = outValues.length || 1;
      const inFreqs = inCounts.map((c) => c / inTotal);
      const outFreqs = outCounts.map((c) => c / outTotal);
      const maxFreq = Math.max(...inFreqs, ...outFreqs, 0.01);
    
      const xScale = d3.scaleLinear().domain([min, max]).range([0, innerWidth]);
      const epsilon = maxFreq * 0.005 || 0.001;
      const yScale = logScale
        ? d3
            .scaleLog()
            .domain([epsilon, maxFreq * 1.1])
            .range([innerHeight, 0])
            .clamp(true)
        : d3
            .scaleLinear()
            .domain([0, maxFreq * 1.1])
            .range([innerHeight, 0]);
    
      // Clamp zero-frequency bins for log scale
      if (logScale) {
        for (let i = 0; i < inFreqs.length; i++)
          if (inFreqs[i] === 0) inFreqs[i] = epsilon;
        for (let i = 0; i < outFreqs.length; i++)
          if (outFreqs[i] === 0) outFreqs[i] = epsilon;
      }
    
      createXAxis(g, xScale, {
        height: innerHeight,
        label: metric,
        ticks: 6,
      });
      createYAxis(g, yScale, {
        label: logScale ? "Frequency (log)" : "Frequency",
        ticks: 5,
      });
    
      const clusterColorStr =
        selectedCluster !== null && clusteringAvailable
          ? clustering.getClusterColor(selectedCluster)
          : "hsl(210, 70%, 50%)";
      const clusterLabel = getClusterChipLabel();
    
      // Build line points at bin midpoints
      const binMidpoints = Array.from(
        { length: nBins },
        (_, i) => min + (i + 0.5) * binWidth,
      );
    
      function drawDistributionLine(freqs, strokeColor, fillColor) {
        const areaGen = d3
          .area()
          .x((_, i) => xScale(binMidpoints[i]))
          .y0(innerHeight)
          .y1((d) => yScale(d))
          .curve(d3.curveMonotoneX);
    
        g.append("path")
          .datum(freqs)
          .attr("d", areaGen)
          .attr("fill", fillColor)
          .attr("stroke", "none");
    
        const lineGen = d3
          .line()
          .x((_, i) => xScale(binMidpoints[i]))
          .y((d) => yScale(d))
          .curve(d3.curveMonotoneX);
    
        g.append("path")
          .datum(freqs)
          .attr("d", lineGen)
          .attr("fill", "none")
          .attr("stroke", strokeColor)
          .attr("stroke-width", 2);
      }
    
      // Draw out-cluster first (behind), then in-cluster on top
      drawDistributionLine(
        outFreqs,
        "rgba(150, 150, 150, 0.7)",
        "rgba(150, 150, 150, 0.15)",
      );
      drawDistributionLine(
        inFreqs,
        clusterColorToRGBA(clusterColorStr, 1),
        clusterColorToRGBA(clusterColorStr, 0.2),
      );
    
      // Title (excluded from SVG export)
      svg
        .append("text")
        .attr("class", "no-export")
        .attr("x", margin.left + innerWidth / 2)
        .attr("y", 16)
        .attr("text-anchor", "middle")
        .attr("font-size", CHART_STYLES.titleFontSize)
        .attr("font-weight", "bold")
        .attr("fill", "#333")
        .text(METRIC_DISPLAY_NAMES[metric] || metric);
    
      // KS D statistic
      const ks = ksTest(inValues, outValues);
      const ksText = formatKsStat(ks);
      if (ksText) {
        svg
          .append("text")
          .attr("x", margin.left + innerWidth - 4)
          .attr("y", margin.top + 14)
          .attr("text-anchor", "end")
          .attr("font-size", 11)
          .attr("fill", isKsSignificant(ks) ? "#c33" : "#888")
          .text(ksText);
      }
    
      // Legend (line swatches)
      const legendG = svg
        .append("g")
        .attr("transform", `translate(${margin.left + 8},${margin.top + 4})`);
    
      legendG
        .append("line")
        .attr("x1", 0)
        .attr("y1", 5)
        .attr("x2", 14)
        .attr("y2", 5)
        .attr("stroke", clusterColorToRGBA(clusterColorStr, 1))
        .attr("stroke-width", 2);
      legendG
        .append("text")
        .attr("x", 18)
        .attr("y", 9)
        .attr("font-size", CHART_STYLES.legendFontSize)
        .attr("fill", CHART_STYLES.labelColor)
        .text(`${clusterLabel} (${inValues.length})`);
    
      legendG
        .append("line")
        .attr("x1", 0)
        .attr("y1", 19)
        .attr("x2", 14)
        .attr("y2", 19)
        .attr("stroke", "rgba(150, 150, 150, 0.7)")

      legendG

        .attr("fill", CHART_STYLES.labelColor)
        .text(`Other (${outValues.length})`);
    
      addExportButton(containerId, `ablation-histogram-${metric}`);
    }
    
    function renderBoxPlot(metric, inValues, outValues) {

      svg

        .attr("y", 16)
        .attr("text-anchor", "middle")

        .attr("font-weight", "bold")
        .attr("fill", "#333")
        .text(METRIC_DISPLAY_NAMES[metric] || metric);
    
      // KS D statistic
      const ks = ksTest(inValues, outValues);

      if (ksText) {

      // Legend

      legendG

      legendG

    function renderHistogramAll(metric, groupData) {

      const max = rawMin === rawMax ? rawMax + 0.5 : rawMax;
      const nBins = rawMin === rawMax ? 1 : 20;

      const groupFreqs = groupData.map((cg) => {

            .scaleLinear()

      // Clamp zero-frequency bins for log scale

    function renderSina(metric, inValues, outValues) {

        margin,
