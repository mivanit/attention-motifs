<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ablation Results</title>
    <link rel="stylesheet" href="style.css" />
    <script src="../../libs/d3.min.js"></script>
    <script src="../../shared/d3_chart_utils.js"></script>
    <script src="../../shared/clustering_config.js"></script>
    <script src="../../shared/cluster_utils.js"></script>
    <script src="../../shared/cluster_engine.js"></script>
    <script src="../../attnpedia/src/clustering.js"></script>
    <script src="../../attnpedia/src/AttentionPedia.js"></script>
    <script src="../../libs/table.js"></script>
  </head>
  <body>
    <nav class="nav-bar">
      <div class="nav-bar-content">
        <a href="../index.html">Home</a>
        <a href="../vis/attnpedia/index.html">AttentionPedia</a>
        <a href="../vis/embeds/patterns/index.html">Pattern Embeddings</a>
        <a href="../vis/embeds/heads/index.html">Head Embeddings</a>
        <a href="../figures/head_embed_table.html">Head Embed Table</a>
        <a href="../figures/classifications.html">Classifications</a>
        <a href="../vis/clustering/index.html">Clustering</a>
        <a href="../vis/cluster_trends/index.html">Cluster Trends</a>
        <span class="nav-current">Ablation</span>
        <a href="correlations.html">Correlations</a>
      </div>
    </nav>

    <div class="container">
      <h1>Ablation Results</h1>

      <!-- Controls row -->
      <div class="controls-row">
        <div class="control-group" id="clustering-controls">
          <label>Clustering:</label>
          <select id="cluster-method-select"></select>
          <span id="cluster-hier-controls">
            <input
              type="range"
              id="cut-height-slider"
              min="0"
              max="100"
              step="0.01"
              value="5"
            />
            <span id="cut-height-value">5.00</span>
          </span>
          <span id="cluster-param-controls" style="display: none">
            <span id="cluster-param-label"></span>
            <select id="cluster-param-select"></select>
          </span>
          <span id="n-clusters-label">(-- clusters)</span>
          <span id="min-size-controls">
            <label>Min Size:</label>
            <input
              type="range"
              id="min-cluster-size"
              min="0"
              max="50"
              value="0"
            />
            <span id="min-cluster-size-value" class="slider-value">0</span>
          </span>
        </div>
        <div class="control-group">
          <label>Models:</label>
          <span id="model-family-buttons"></span>
        </div>
        <div class="control-group">
          <label>Ablation:</label>
          <select id="method-select"></select>
        </div>
        <div class="control-group">
          <label>Chart:</label>
          <span id="chart-type-buttons"></span>
          <span id="log-scale-button"></span>
          <select id="sort-select">
            <option value="none">No Sort</option>
            <option value="mean">Sort Mean</option>
            <option value="median">Sort Median</option>
            <option value="ks-d">Sort KS D</option>
          </select>
          <label class="toggle-label"
            ><input type="checkbox" id="show-ref-boxplot" /> Ref.</label
          >
        </div>
        <div class="control-group">
          <label>Width:</label>
          <input
            type="range"
            id="chart-width-slider"
            min="250"
            max="800"
            value="800"
          />
          <span id="chart-width-value" class="slider-value">800px</span>
        </div>
      </div>

      <!-- Cluster chips -->
      <div class="cluster-chips-container">
        <div class="cluster-chips" id="cluster-chips"></div>
      </div>

      <!-- Distribution charts -->
      <div class="charts-grid" id="charts-grid"></div>

      <!-- Config summary (collapsible) -->
      <details class="config-details">
        <summary>Experiment Config</summary>
        <div class="config-summary" id="config-summary"></div>
      </details>

      <!-- Cluster statistics summary -->
      <h2 class="section-heading">Cluster Statistics</h2>
      <div id="cluster-stats-container"></div>

      <!-- Head table -->
      <div class="table-controls-row">
        <div class="control-group">
          <label>Columns:</label>
          <span id="column-toggles"></span>
        </div>
        <div
          class="control-group"
          id="cluster-filter-toggle"
          style="display: none"
        >
          <label class="chip"
            ><input
              type="checkbox"
              id="table-cluster-filter"
              onchange="toggleTableClusterFilter()"
            />
            Selected cluster only</label
          >
        </div>
      </div>

      <div id="results-table-container"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
