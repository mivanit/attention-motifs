<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ablation Correlations</title>
    <link rel="stylesheet" href="style.css" />
    <script src="../../libs/d3.min.js"></script>
    <script src="../../shared/d3_chart_utils.js"></script>
    <script src="../../shared/clustering_config.js"></script>
    <script src="../../shared/cluster_utils.js"></script>
    <script src="../../shared/cluster_engine.js"></script>
    <script src="../../attnpedia/src/clustering.js"></script>
    <script src="../../attnpedia/src/AttentionPedia.js"></script>
    <script src="../../libs/array.js"></script>
    <script src="../../attnpedia/src/head_embeds.js"></script>
  </head>
  <body>
    <nav class="nav-bar">
      <div class="nav-bar-content">
        <a href="../index.html">Home</a>
        <a href="../vis/attnpedia/index.html">AttentionPedia</a>
        <a href="../vis/embeds/patterns/index.html">Pattern Embeddings</a>
        <a href="../vis/embeds/heads/index.html">Head Embeddings</a>
        <a href="../figures/head_embed_table.html">Head Embed Table</a>
        <a href="../figures/classifications.html">Classifications</a>
        <a href="../vis/clustering/index.html">Clustering</a>
        <a href="../vis/cluster_trends/index.html">Cluster Trends</a>
        <a href="index.html">Ablation</a>
        <span class="nav-current">Correlations</span>
      </div>
    </nav>

    <div class="container">
      <h1>Ablation Correlations</h1>

      <!-- Controls row -->
      <div class="controls-row">
        <div class="control-group" id="xaxis-mode-controls">
          <label>X-Axis:</label>
          <select id="xaxis-mode-select">
            <option value="head">Distance to Head</option>
            <option value="cluster">Distance to Cluster</option>
          </select>
          <span id="xaxis-head-controls">
            <input
              type="text"
              id="target-head-input"
              list="head-datalist"
              placeholder="e.g. gpt2-small:L5:H5"
            />
            <datalist id="head-datalist"></datalist>
          </span>
          <span id="xaxis-cluster-controls" style="display: none">
            <select id="target-cluster-select"></select>
            <select id="cluster-agg-select">
              <option value="mean">Mean</option>
              <option value="median">Median</option>
            </select>
          </span>
        </div>
        <div class="control-group" id="clustering-controls">
          <label>Clustering:</label>
          <select id="cluster-method-select"></select>
          <span id="cluster-hier-controls">
            <input
              type="range"
              id="cut-height-slider"
              min="0"
              max="100"
              step="0.01"
              value="5"
            />
            <span id="cut-height-value">5.00</span>
          </span>
          <span id="cluster-param-controls" style="display: none">
            <span id="cluster-param-label"></span>
            <select id="cluster-param-select"></select>
          </span>
          <span id="n-clusters-label">(-- clusters)</span>
          <span id="min-size-controls">
            <label>Min Size:</label>
            <input
              type="range"
              id="min-cluster-size"
              min="0"
              max="50"
              value="0"
            />
            <span id="min-cluster-size-value" class="slider-value">0</span>
          </span>
        </div>
        <div class="control-group">
          <label>Models:</label>
          <span id="model-family-buttons"></span>
        </div>
        <div class="control-group">
          <label>Ablation:</label>
          <select id="method-select"></select>
        </div>
        <div class="control-group">
          <label>Width:</label>
          <input
            type="range"
            id="chart-width-slider"
            min="250"
            max="800"
            value="400"
          />
          <span id="chart-width-value" class="slider-value">400px</span>
        </div>
        <div class="control-group">
          <label><input type="checkbox" id="log-x-toggle" /> Log X</label>
        </div>
      </div>

      <!-- Cluster chips -->
      <div class="cluster-chips-container">
        <div class="cluster-chips" id="cluster-chips"></div>
      </div>

      <!-- Loading indicator -->
      <div id="loading-indicator" style="display: none">
        <p style="text-align: center; color: #888; padding: 20px">
          Loading distances...
        </p>
      </div>

      <!-- Scatterplot charts -->
      <div class="charts-grid" id="charts-grid"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
