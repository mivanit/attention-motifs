<!doctype html>

    <title>Ablation Correlations</title>
        <!-- begin 'style.css' -->
    <style>

    <script src="../../libs/d3.min.js"></script>
        <!-- begin '../../shared/d3_chart_utils.js' -->
    <script>
    /**
     * Shared D3.js chart utilities.
     *
     * Provides reusable helpers for creating SVG charts with D3,
     * including axes, legends, tooltips, boxplots, and SVG export.
     *
     * Requires D3.js v7 to be loaded before this script.
     */
    
    // ── Style constants ─────────────────────────────────────────────
    
    const CHART_STYLES = {
      tickColor: "#888",
      labelColor: "#555",
      gridColor: "rgba(0,0,0,0.08)",
      labelFontSize: 11,
      titleFontSize: 13,
      legendFontSize: 11,
      tooltipBg: "rgba(0,0,0,0.82)",
      tooltipColor: "#fff",
      tooltipFontSize: "12px",
      tooltipPadding: "6px 10px",
      tooltipRadius: "4px",
    };
    
    // ── SVG container ───────────────────────────────────────────────
    
    /**
     * Create an SVG chart container inside a DOM element.
     * Clears any existing SVG in the container.
     *
     * @param {string} containerId - DOM element ID
     * @param {{top: number, right: number, bottom: number, left: number}} margin
     * @returns {{svg: d3.Selection, g: d3.Selection, width: number, height: number, innerWidth: number, innerHeight: number}}
     */
    function createChartSVG(containerId, margin) {
      const container = document.getElementById(containerId);
      // Remove existing SVG and export button
      const existing = container.querySelector("svg");
      if (existing) existing.remove();
      const existingBtn = container.querySelector(".export-svg-btn");
      if (existingBtn) existingBtn.remove();
    
      const rect = container.getBoundingClientRect();
      const cs = getComputedStyle(container);
      const width =
        rect.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const height =
        rect.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;
    
      const svg = d3
        .select(container)
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("xmlns", "http://www.w3.org/2000/svg")
        .style("font-family", "sans-serif");
    
      const g = svg
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);
    
      return { svg, g, width, height, innerWidth, innerHeight };
    }
    
    // ── Axes ────────────────────────────────────────────────────────
    
    /**
     * Render a bottom (X) axis with optional grid lines and label.
     *
     * @param {d3.Selection} g - Chart inner group
     * @param {d3.Scale} scale - D3 scale for the axis
     * @param {{height: number, label?: string, tickFormat?: Function, gridHeight?: number, ticks?: number}} opts
     */
    function createXAxis(g, scale, opts) {
      const axis = d3.axisBottom(scale);
      if (opts.tickFormat) axis.tickFormat(opts.tickFormat);
      if (opts.ticks) axis.ticks(opts.ticks);
    
      const axisG = g
        .append("g")
        .attr("class", "x-axis")
        .attr("transform", `translate(0,${opts.height})`)
        .call(axis);
    
      axisG.selectAll("text").attr("fill", CHART_STYLES.tickColor);
      axisG.selectAll("line").attr("stroke", CHART_STYLES.tickColor);
      axisG.select(".domain").attr("stroke", CHART_STYLES.tickColor);
    
      // Grid lines
      if (opts.gridHeight) {
        const gridAxis = d3
          .axisBottom(scale)
          .tickSize(-opts.gridHeight)
          .tickFormat("");
        if (opts.ticks) gridAxis.ticks(opts.ticks);
        g.append("g")
          .attr("class", "x-grid")
          .attr("transform", `translate(0,${opts.height})`)
          .call(gridAxis)
          .selectAll("line")
          .attr("stroke", CHART_STYLES.gridColor);
        g.select(".x-grid .domain").remove();
      }
    
      // Label
      if (opts.label) {
        g.append("text")
          .attr("class", "x-label")
          .attr("x", scale.range()[1] / 2 + (scale.range()[0] || 0) / 2)
          .attr("y", opts.height + 36)
          .attr("text-anchor", "middle")
          .attr("fill", CHART_STYLES.labelColor)
          .attr("font-size", CHART_STYLES.labelFontSize)
          .text(opts.label);
      }
    }
    
    /**
     * Render a left (Y) axis with optional grid lines and label.
     *
     * @param {d3.Selection} g - Chart inner group
     * @param {d3.Scale} scale - D3 scale for the axis
     * @param {{label?: string, gridWidth?: number, ticks?: number}} opts
     */
    function createYAxis(g, scale, opts) {
      const axis = d3.axisLeft(scale);
      if (opts.ticks) axis.ticks(opts.ticks);
    
      const axisG = g.append("g").attr("class", "y-axis").call(axis);
    
      axisG.selectAll("text").attr("fill", CHART_STYLES.tickColor);
      axisG.selectAll("line").attr("stroke", CHART_STYLES.tickColor);
      axisG.select(".domain").attr("stroke", CHART_STYLES.tickColor);
    
      // Grid lines
      if (opts.gridWidth) {
        const gridAxis = d3
          .axisLeft(scale)
          .tickSize(-opts.gridWidth)
          .tickFormat("");
        if (opts.ticks) gridAxis.ticks(opts.ticks);
        g.append("g")
          .attr("class", "y-grid")
          .call(gridAxis)
          .selectAll("line")
          .attr("stroke", CHART_STYLES.gridColor);
        g.select(".y-grid .domain").remove();
      }
    
      // Label
      if (opts.label) {
        g.append("text")
          .attr("class", "y-label")
          .attr("transform", "rotate(-90)")
          .attr("x", -(scale.range()[0] + scale.range()[1]) / 2)
          .attr("y", -40)
          .attr("text-anchor", "middle")
          .attr("fill", CHART_STYLES.labelColor)
          .attr("font-size", CHART_STYLES.labelFontSize)
          .text(opts.label);
      }
    }
    
    // ── Legend ───────────────────────────────────────────────────────
    
    /**
     * Render an interactive legend inside the SVG.
     *
     * @param {d3.Selection} svg - The root SVG selection
     * @param {{items: Array<{label: string, color: string, dashed?: boolean}>, x: number, y: number, onClick?: (label: string, index: number) => void}} opts
     */
    function createLegend(svg, opts) {
      const items = opts.items.filter((d) => d.label && d.label !== "");
      const legendG = svg
        .append("g")
        .attr("class", "chart-legend")
        .attr("transform", `translate(${opts.x},${opts.y})`);
    
      const itemGs = legendG
        .selectAll(".legend-item")
        .data(items)
        .enter()
        .append("g")
        .attr("class", "legend-item")
        .attr("transform", (_, i) => `translate(0,${i * 18})`)
        .style("cursor", opts.onClick ? "pointer" : "default");
    
      // Color swatch
      itemGs.each(function (d) {
        const el = d3.select(this);
        if (d.dashed) {
          el.append("line")
            .attr("x1", 0)
            .attr("y1", 5)
            .attr("x2", 14)
            .attr("y2", 5)
            .attr("stroke", d.color)
            .attr("stroke-width", 2)
            .attr("stroke-dasharray", "4,2");
        } else {
          el.append("rect")
            .attr("width", 12)
            .attr("height", 12)
            .attr("rx", 2)
            .attr("fill", d.color);
        }
      });
    
      // Label text
      itemGs
        .append("text")
        .attr("x", 18)
        .attr("y", 10)
        .attr("fill", CHART_STYLES.labelColor)
        .attr("font-size", CHART_STYLES.legendFontSize)
        .text((d) => d.label);
    
      // Click handler
      if (opts.onClick) {
        itemGs.on("click", (event, d) => {
          const idx = items.indexOf(d);
          opts.onClick(d.label, idx, d);
        });
      }
    
      return legendG;
    }
    
    // ── Tooltip ─────────────────────────────────────────────────────
    
    /**
     * Create a tooltip div attached to a container.
     * Returns show/hide functions.
     *
     * @param {string} containerId - DOM element ID
     * @returns {{show: (event: MouseEvent, html: string) => void, hide: () => void, el: HTMLElement}}
     */
    function createTooltip(containerId) {
      const container = document.getElementById(containerId);
    
      // Remove existing tooltip
      const existing = container.querySelector(".d3-tooltip");
      if (existing) existing.remove();
    
      const el = document.createElement("div");
      el.className = "d3-tooltip";
      el.style.cssText = `
        position: absolute;
        background: ${CHART_STYLES.tooltipBg};
        color: ${CHART_STYLES.tooltipColor};
        padding: ${CHART_STYLES.tooltipPadding};
        border-radius: ${CHART_STYLES.tooltipRadius};
        font-size: ${CHART_STYLES.tooltipFontSize};
        pointer-events: none;
        z-index: 100;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.15s;
      `;
      container.style.position = "relative";
      container.appendChild(el);
    
      function show(event, html) {
        el.innerHTML = html;
        el.style.opacity = "1";
        const containerRect = container.getBoundingClientRect();
        let left = event.clientX - containerRect.left + 12;
        let top = event.clientY - containerRect.top - 10;
        // Keep within bounds
        const elRect = el.getBoundingClientRect();
        if (left + elRect.width > containerRect.width) {
          left = event.clientX - containerRect.left - elRect.width - 12;
        }
        if (top < 0) top = 4;
        el.style.left = left + "px";
        el.style.top = top + "px";
      }
    
      function hide() {
        el.style.opacity = "0";
      }
    
      return { show, hide, el };
    }
    
    // ── SVG Export ───────────────────────────────────────────────────
    
    /**
     * Add an "Export SVG" button below a chart container.
     *
     * @param {string} containerId - DOM element ID containing the SVG
     * @param {string} filename - Download filename (without extension)
     */
    function addExportButton(containerId, filename) {
      const container = document.getElementById(containerId);
      // Remove existing button
      const existing = container.querySelector(".export-svg-btn");
      if (existing) existing.remove();
    
      const btn = document.createElement("button");
      btn.className = "export-svg-btn";
      btn.textContent = "Export SVG";
      btn.style.cssText = `
        position: absolute;
        top: 4px;
        right: 4px;
        padding: 3px 8px;
        font-size: 11px;
        border: 1px solid #ccc;
        border-radius: 3px;
        background: #f8f9fa;
        color: #555;
        cursor: pointer;
        z-index: 10;
        opacity: 0.6;
        transition: opacity 0.15s;
      `;
      btn.addEventListener("mouseenter", () => (btn.style.opacity = "1"));
      btn.addEventListener("mouseleave", () => (btn.style.opacity = "0.6"));
      btn.addEventListener("click", () => {
        const svgEl = container.querySelector("svg");
        if (!svgEl) return;
        const clone = svgEl.cloneNode(true);
        clone.querySelectorAll(".no-export").forEach((el) => el.remove());
        const serializer = new XMLSerializer();
        const svgStr = serializer.serializeToString(clone);
        const blob = new Blob([svgStr], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${filename}.svg`;
        a.click();
        URL.revokeObjectURL(url);
      });
      container.appendChild(btn);
    
      // Remove existing PNG button
      const existingPng = container.querySelector(".export-png-btn");
      if (existingPng) existingPng.remove();
    
      const pngBtn = document.createElement("button");
      pngBtn.className = "export-png-btn";
      pngBtn.textContent = "Export PNG";
      pngBtn.style.cssText = `
        position: absolute;
        top: 4px;
        right: 80px;
        padding: 3px 8px;
        font-size: 11px;
        border: 1px solid #ccc;
        border-radius: 3px;
        background: #f8f9fa;
        color: #555;
        cursor: pointer;
        z-index: 10;
        opacity: 0.6;
        transition: opacity 0.15s;
      `;
      pngBtn.addEventListener("mouseenter", () => (pngBtn.style.opacity = "1"));
      pngBtn.addEventListener("mouseleave", () => (pngBtn.style.opacity = "0.6"));
      pngBtn.addEventListener("click", () => {
        const svgEl = container.querySelector("svg");
        if (!svgEl) return;
        const clone = svgEl.cloneNode(true);
        clone.querySelectorAll(".no-export").forEach((el) => el.remove());
        const w = parseFloat(svgEl.getAttribute("width"));
        const h = parseFloat(svgEl.getAttribute("height"));
        const scale = 8;
        const canvas = document.createElement("canvas");
        canvas.width = w * scale;
        canvas.height = h * scale;
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        const svgStr = new XMLSerializer().serializeToString(clone);
        const blob = new Blob([svgStr], {
          type: "image/svg+xml;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          canvas.toBlob((pngBlob) => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(pngBlob);
            a.download = `${filename}.png`;
            a.click();
            URL.revokeObjectURL(a.href);
          });
        };
        img.src = url;
      });
      container.appendChild(pngBtn);
    }
    
    // ── KDE ─────────────────────────────────────────────────────────
    
    /**
     * Gaussian kernel density estimator.
     * Returns a function that evaluates density at any point x.
     *
     * @param {number[]} values - Sample data
     * @param {number} [bandwidth] - Bandwidth (uses Silverman's rule if omitted)
     * @returns {(x: number) => number} Density function
     */
    function createKDE(values, bandwidth) {
      const n = values.length;
      if (n === 0) return () => 0;
      const sorted = [...values].sort((a, b) => a - b);
      if (!bandwidth || bandwidth <= 0) {
        const mean = d3.mean(sorted);
        const std = Math.sqrt(d3.mean(sorted.map((v) => (v - mean) ** 2)));
        const q1 = d3.quantile(sorted, 0.25);
        const q3 = d3.quantile(sorted, 0.75);
        const iqr = q3 - q1;
        bandwidth = 0.9 * Math.min(std, iqr / 1.34) * n ** -0.2;
        if (bandwidth <= 0) bandwidth = std * 0.5 || 1;
      }
      const factor = 1 / (n * bandwidth * Math.sqrt(2 * Math.PI));
      return function (x) {
        let sum = 0;
        for (let i = 0; i < n; i++) {
          const u = (x - sorted[i]) / bandwidth;
          sum += Math.exp(-0.5 * u * u);
        }
        return sum * factor;
      };
    }
    
    // ── Letter-Value Plot ───────────────────────────────────────────
    
    /**
     * Compute letter-value levels from sorted values.
     * Returns array of {lower, upper, depth} from outermost to innermost.
     *
     * @param {number[]} sorted - Pre-sorted values
     * @returns {Array<{lower: number, upper: number, depth: number}>}
     */
    function computeLetterValues(sorted) {
      const n = sorted.length;
      if (n === 0) return [];
    
      function quantile(arr, q) {
        const pos = (arr.length - 1) * q;
        const base = Math.floor(pos);
        const rest = pos - base;
        if (base + 1 < arr.length)
          return arr[base] + rest * (arr[base + 1] - arr[base]);
        return arr[base];
      }
    
      const levels = [];
      const maxDepth = Math.max(1, Math.floor(Math.log2(n)) - 1);
    
      for (let k = 1; k <= maxDepth; k++) {
        const p = 0.5 ** k;
        const lower = quantile(sorted, p);
        const upper = quantile(sorted, 1 - p);
        levels.push({ lower, upper, depth: k });
        // Stop if the level covers fewer than ~4 data points on each tail
        if (n * p < 4) break;
      }
      return levels;
    }
    
    /**
     * Draw a letter-value (boxen) plot as SVG elements.
     *
     * @param {d3.Selection} g - Parent group
     * @param {{values: number[], x: number, width: number, yScale: d3.Scale, fillColor: string, strokeColor: string}} opts
     */
    function drawLetterValuePlot(g, opts) {
      const { values, x, width, yScale, fillColor, strokeColor } = opts;
      if (values.length === 0) return;
      const sorted = [...values].sort((a, b) => a - b);
      const levels = computeLetterValues(sorted);
      const nLevels = levels.length;
      const lvG = g.append("g").attr("class", "lettervalue");
    
      // Parse base color for alpha blending
      const baseColor = fillColor;
    
      // Draw levels from outermost (narrowest box) to innermost (widest box)
      for (let i = 0; i < nLevels; i++) {
        const lv = levels[i];
        const boxW = width * ((i + 1) / nLevels);
        const xOff = x + (width - boxW) / 2;
        const alpha = 0.2 + 0.6 * ((i + 1) / nLevels);
    
        lvG
          .append("rect")
          .attr("x", xOff)
          .attr("y", yScale(lv.upper))
          .attr("width", boxW)
          .attr("height", Math.max(0, yScale(lv.lower) - yScale(lv.upper)))
          .attr("fill", fillColor)
          .attr("fill-opacity", alpha)
          .attr("stroke", strokeColor)
          .attr("stroke-opacity", 0.4)
          .attr("stroke-width", 0.5);
      }
    
      // Median line
      const median = d3.quantile(sorted, 0.5);
      lvG
        .append("line")
        .attr("x1", x)
        .attr("y1", yScale(median))
        .attr("x2", x + width)
        .attr("y2", yScale(median))
        .attr("stroke", strokeColor)
        .attr("stroke-width", 2);
    
      // Whisker line spanning full data range
      lvG
        .append("line")
        .attr("x1", x + width / 2)
        .attr("y1", yScale(sorted[0]))
        .attr("x2", x + width / 2)
        .attr("y2", yScale(sorted[sorted.length - 1]))
        .attr("stroke", strokeColor)
        .attr("stroke-width", 0.5);
    
      return lvG;
    }
    
    // ── Boxplot ─────────────────────────────────────────────────────
    
    /**
     * Compute box plot statistics from an array of values.
     *
     * @param {number[]} values
     * @returns {{min: number, q1: number, median: number, q3: number, max: number, whiskerLow: number, whiskerHigh: number, outliers: number[]}}
     */
    function computeBoxplotStats(values) {
      if (values.length === 0) {
        return {
          min: 0,
          q1: 0,
          median: 0,
          q3: 0,
          max: 0,
          whiskerLow: 0,
          whiskerHigh: 0,
          outliers: [],
        };
      }
      const sorted = [...values].sort((a, b) => a - b);
      const n = sorted.length;
    
      function quantile(arr, q) {
        const pos = (arr.length - 1) * q;
        const base = Math.floor(pos);
        const rest = pos - base;
        if (base + 1 < arr.length) {
          return arr[base] + rest * (arr[base + 1] - arr[base]);
        }
        return arr[base];
      }
    
      const q1 = quantile(sorted, 0.25);
      const median = quantile(sorted, 0.5);
      const q3 = quantile(sorted, 0.75);
      const iqr = q3 - q1;
      const whiskerLow = Math.max(sorted[0], q1 - 1.5 * iqr);
      const whiskerHigh = Math.min(sorted[n - 1], q3 + 1.5 * iqr);
      const outliers = sorted.filter((v) => v < whiskerLow || v > whiskerHigh);
    
      return {
        min: sorted[0],
        q1,
        median,
        q3,
        max: sorted[n - 1],
        whiskerLow,
        whiskerHigh,
        outliers,
      };
    }
    
    /**
     * Draw a single box-and-whisker plot as SVG elements.
     *
     * @param {d3.Selection} g - Parent group
     * @param {{stats: Object, x: number, width: number, yScale: d3.Scale, fillColor: string, strokeColor: string}} opts
     */
    function drawBoxplot(g, opts) {
      const { stats, x, width, yScale, fillColor, strokeColor } = opts;
      const boxG = g.append("g").attr("class", "boxplot");
    
      // Whisker line (vertical)
      boxG
        .append("line")
        .attr("x1", x + width / 2)
        .attr("y1", yScale(stats.whiskerHigh))
        .attr("x2", x + width / 2)
        .attr("y2", yScale(stats.whiskerLow))
        .attr("stroke", strokeColor)
        .attr("stroke-width", 1);
    
      // Whisker caps
      const capW = width * 0.5;
      for (const val of [stats.whiskerLow, stats.whiskerHigh]) {
        boxG
          .append("line")
          .attr("x1", x + width / 2 - capW / 2)
          .attr("y1", yScale(val))
          .attr("x2", x + width / 2 + capW / 2)
          .attr("y2", yScale(val))
          .attr("stroke", strokeColor)
          .attr("stroke-width", 1);
      }
    
      // Box (Q1 to Q3)
      boxG
        .append("rect")
        .attr("x", x)
        .attr("y", yScale(stats.q3))
        .attr("width", width)
        .attr("height", Math.max(0, yScale(stats.q1) - yScale(stats.q3)))
        .attr("fill", fillColor)
        .attr("stroke", strokeColor)
        .attr("stroke-width", 1);
    
      // Median line
      boxG
        .append("line")
        .attr("x1", x)
        .attr("y1", yScale(stats.median))
        .attr("x2", x + width)
        .attr("y2", yScale(stats.median))
        .attr("stroke", strokeColor)
        .attr("stroke-width", 2);
    
      // Outliers
      for (const val of stats.outliers) {
        boxG
          .append("circle")
          .attr("cx", x + width / 2)
          .attr("cy", yScale(val))
          .attr("r", 2)
          .attr("fill", strokeColor)
          .attr("opacity", 0.6);
      }
    
      return boxG;
    }
    
    </script>

    <script>
    /**
     * Shared clustering configuration state.
     *
     * Persists clustering UI state (cut height, highlighted cluster, etc.)
     * to localStorage so it can be shared across cluster_trends and clustering
     * pages without URL parameters.
     */
    
    const CLUSTERING_CONFIG_KEY = "clustering_config";
    
    const ClusteringConfig = {
      /**
       * Load full state from localStorage.
       * @returns {Object} parsed state (empty object if nothing stored)
       */
      load() {
        try {
          return JSON.parse(localStorage.getItem(CLUSTERING_CONFIG_KEY)) || {};
        } catch {
          return {};
        }
      },
    
      /**
       * Merge partial state into localStorage.
       * @param {Object} partial - key/value pairs to merge
       */
      save(partial) {
        const current = this.load();
        localStorage.setItem(
          CLUSTERING_CONFIG_KEY,
          JSON.stringify({ ...current, ...partial }),
        );
      },
    
      /** @returns {number|null} */
      getCutHeight() {
        return this.load().cutHeight ?? null;
      },
    
      /** @param {number} h */
      setCutHeight(h) {
        this.save({ cutHeight: h });
      },
    
      /** @returns {number|null} */
      getHighlightCluster() {
        return this.load().highlightCluster ?? null;
      },
    
      /** @param {number} id */
      setHighlightCluster(id) {
        this.save({ highlightCluster: id });
      },
    
      clearHighlightCluster() {
        const s = this.load();
        delete s.highlightCluster;
        localStorage.setItem(CLUSTERING_CONFIG_KEY, JSON.stringify(s));
      },
    
      /** @returns {string|null} clustering method name ("hierarchical", "hdbscan", "leiden") */
      getMethod() {
        return this.load().method ?? null;
      },
    
      /** @param {string} method */
      setMethod(method) {
        this.save({ method });
      },
    
      /** @returns {string|null} current parameter key for flat methods */
      getParamKey() {
        return this.load().paramKey ?? null;

      /** @param {string} key */

        this.save({ paramKey: key });

    <script>
    /**
     * Shared clustering visualization utilities.
     *
     * Used by cluster_trends and potentially other frontends that need
     * cluster coloring and toggle buttons.
     */
    
    // ── Cluster colors (golden angle) ──────────────────────────────
    
    const GOLDEN_ANGLE = 137.508;
    
    /**
     * Generate a distinct opaque color for a cluster index.
     * @param {number} idx
     * @returns {string} CSS hsl color
     */
    function clusterColor(idx) {
      const hue = (idx * GOLDEN_ANGLE) % 360;
      const sat = 65 + (idx % 3) * 10;
      const lit = 45 + (idx % 2) * 10;
      return `hsl(${hue}, ${sat}%, ${lit}%)`;
    }
    
    /**
     * Generate a distinct color with alpha for a cluster index.
     * @param {number} idx
     * @param {number} alpha - opacity 0..1
     * @returns {string} CSS hsla color
     */
    function clusterColorAlpha(idx, alpha) {
      const hue = (idx * GOLDEN_ANGLE) % 360;
      const sat = 65 + (idx % 3) * 10;
      const lit = 45 + (idx % 2) * 10;
      return `hsla(${hue}, ${sat}%, ${lit}%, ${alpha})`;
    }
    
    // ── Toggle buttons ─────────────────────────────────────────────
    
    /**
     * Build toggle buttons inside a container element.
     * Each button toggles a boolean in the shared enabledState object.
     *
     * @param {string} containerId - DOM element ID for the container
     * @param {string[]} items - sorted list of item labels
     * @param {Object<string, boolean>} enabledState - shared state (mutated in place)
     * @param {string} cssClass - CSS class for each button (e.g. "family-toggle")
     * @param {() => void} onChange - callback when any toggle changes
     */
    function buildToggleButtons(
      containerId,
      items,
      enabledState,
      cssClass,
      onChange,
    ) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      for (const item of items) {
        const btn = document.createElement("span");
        btn.className = cssClass;
        btn.textContent = item;
        if (!enabledState[item]) btn.classList.add("disabled");
        btn.addEventListener("click", () => {
          enabledState[item] = !enabledState[item];
          btn.classList.toggle("disabled", !enabledState[item]);
          onChange();
        });
        container.appendChild(btn);
      }
    }
    
    // ── Cluster labels ──────────────────────────────────────────────
    
    const CLUSTER_LABELS_STORAGE_KEY = "clustering_labels";
    
    /**
     * Load cluster labels from localStorage and optionally from a server URL.
     * localStorage labels override server labels on merge.
     *
     * @param {string|null} [serverUrl] - URL to fetch server-side labels JSON
     * @returns {Promise<Object>} Merged labels: { cutHeightKey: { clusterIdx: { name, desc, heads } } }
     */
    async function loadClusterLabels(serverUrl) {
      // Load from localStorage
      let localLabels = {};
      try {
        const raw = localStorage.getItem(CLUSTER_LABELS_STORAGE_KEY);
        if (raw) localLabels = JSON.parse(raw);
      } catch (e) {
        console.warn("Failed to load cluster labels from localStorage:", e);
      }
    
      // Load from server (optional)
      let serverLabels = {};
      if (serverUrl) {
        try {
          const resp = await fetch(serverUrl);
          if (resp.ok) {
            serverLabels = await resp.json();
          } else {
            console.warn(
              `Cluster labels not found at ${serverUrl} (${resp.status})`,
            );
          }
        } catch (e) {
          console.warn("Failed to fetch cluster labels:", e);
        }
      }
    
      // Merge: server as base, localStorage overrides
      const merged = {};
      const allKeys = new Set([
        ...Object.keys(serverLabels),
        ...Object.keys(localLabels),
      ]);
      for (const heightKey of allKeys) {
        merged[heightKey] = {
          ...(serverLabels[heightKey] || {}),
          ...(localLabels[heightKey] || {}),
        };
      }
      return merged;
    }
    
    /**
     * Resolve stored labels against current cluster assignments.
     * Matches each label's heads list to the current cluster with the
     * highest overlap, returning a map of clusterId -> {name, desc}.
     *
     * @param {Object} allLabels - Full labels object keyed by cut height
     * @param {number} cutHeight - Current cut height
     * @param {Object<string, number>} assignments - headId -> clusterId
     * @returns {Object<number, {name: string, desc: string|null}>} clusterId -> label info
     */
    function resolveClusterLabels(allLabels, cutHeight, assignments) {
      const heightKey = cutHeight.toFixed(3);
      return resolveClusterLabelsByKey(allLabels, heightKey, assignments);
    }
    
    /**
     * Resolve stored labels for a flat clustering method.
     * Label key format: "{method}:{param_name}={value}"
     *
     * @param {Object} allLabels - Full labels object keyed by label key
     * @param {string} method - Clustering method name (e.g. "hdbscan", "leiden")
     * @param {string} paramName - Parameter name (e.g. "min_cluster_size", "resolution")
     * @param {string} paramKey - Parameter value as string
     * @param {Object<string, number>} assignments - headId -> clusterId
     * @returns {Object<number, {name: string, desc: string|null}>} clusterId -> label info
     */
    function resolveClusterLabelsFlat(
      allLabels,
      method,
      paramName,
      paramKey,
      assignments,
    ) {
      const labelKey = `${method}:${paramName}=${paramKey}`;
      return resolveClusterLabelsByKey(allLabels, labelKey, assignments);
    }
    
    /**
     * Resolve stored labels against current cluster assignments using a specific key.
     * Shared implementation for both hierarchical and flat methods.
     *
     * @param {Object} allLabels - Full labels object keyed by label key
     * @param {string} key - The label key to look up
     * @param {Object<string, number>} assignments - headId -> clusterId
     * @returns {Object<number, {name: string, desc: string|null}>} clusterId -> label info
     */
    function resolveClusterLabelsByKey(allLabels, key, assignments) {
      const labelsForKey = allLabels[key];
      if (!labelsForKey) return {};
    
      const resolvedCounts = {};
      const resolved = {};
    
      for (const [_origIdx, entry] of Object.entries(labelsForKey)) {
        if (!entry || !entry.name) continue;
        const heads = entry.heads || [];
    
        // Count overlap with each current cluster
        const clusterOverlap = {};
        for (const headId of heads) {
          const cid = assignments[headId];
          if (cid !== undefined) {
            clusterOverlap[cid] = (clusterOverlap[cid] || 0) + 1;
          }
        }
    
        // Find cluster with most overlap
        let bestCluster = null;
        let bestCount = 0;
        for (const [cid, count] of Object.entries(clusterOverlap)) {
          if (count > bestCount) {
            bestCount = count;
            bestCluster = parseInt(cid);
          }
        }
    
        if (bestCluster !== null && bestCount > 0) {
          if (!resolved[bestCluster] || bestCount > resolvedCounts[bestCluster]) {
            resolved[bestCluster] = { name: entry.name, desc: entry.desc || null };
            resolvedCounts[bestCluster] = bestCount;
          }
        }
      }
    
      return resolved;
    }
    
    /**
     * Get a short display name for a cluster, using name if available.
     *
     * @param {number} clusterId
     * @param {Object<number, {name: string, desc: string|null}>} resolvedLabels
     * @returns {string} e.g. "Cluster 3: Induction" or "Cluster 3"
     */
    function clusterDisplayName(clusterId, resolvedLabels) {
      if (clusterId === -1) return "misc";
      const label = resolvedLabels[clusterId];
      if (label && label.name) return `Cluster ${clusterId}: ${label.name}`;
      return `Cluster ${clusterId}`;
    }

    <script>
    /**
     * Shared clustering computation engine.
     *
     * Pure functions for computing cluster assignments from a scipy-format
     * linkage matrix. Used by clustering, cluster_trends, and attnpedia views.
     */
    
    /**
     * Compute cluster assignments by cutting the dendrogram at a given height.
     * Uses union-find with path compression.
     *
     * @param {number[][]} linkage - Scipy-format linkage matrix [[idx1, idx2, distance, count], ...]
     * @param {string[]} clsValues - Head IDs in clustering order
     * @param {number} cutHeight - Height at which to cut the dendrogram
     * @returns {Object<string, number>} headId -> clusterId (0-indexed)
     */
    function computeClustersByHeight(linkage, clsValues, cutHeight) {
      if (!linkage || !clsValues) return {};
    
      const n = clsValues.length;
      const parent = Array.from({ length: 2 * n - 1 }, (_, i) => i);
    
      function find(x) {
        if (parent[x] !== x) parent[x] = find(parent[x]);
        return parent[x];
      }
    
      function union(x, y, newParent) {
        parent[find(x)] = newParent;
        parent[find(y)] = newParent;
      }
    
      for (let i = 0; i < linkage.length; i++) {
        const [idx1, idx2, distance] = linkage[i];
        if (distance <= cutHeight) {
          union(Math.floor(idx1), Math.floor(idx2), n + i);
        }
      }
    
      const rootToCluster = {};
      let nextCluster = 0;
      const assignments = {};
    
      for (let i = 0; i < n; i++) {
        const root = find(i);
        if (!(root in rootToCluster)) {
          rootToCluster[root] = nextCluster++;
        }
        assignments[clsValues[i]] = rootToCluster[root];
      }
    
      return assignments;
    }
    
    /**
     * Apply minimum-size filtering to cluster assignments.
     * Clusters smaller than minSize are reassigned to -1 (misc).
     *
     * @param {Object<string, number>} assignments - Raw headId -> clusterId
     * @param {number} minSize - Minimum cluster size (0 = no filtering)
     * @returns {{ assignments: Object<string, number>, smallClusters: Set<number>, nClusters: number }}
     */
    function applyMinSizeFilter(assignments, minSize) {
      if (minSize <= 0) {
        return {
          assignments: assignments,
          smallClusters: new Set(),
          nClusters: new Set(Object.values(assignments)).size,
        };
      }
    
      // Count cluster sizes
      const clusterCounts = {};
      for (const cid of Object.values(assignments)) {
        clusterCounts[cid] = (clusterCounts[cid] || 0) + 1;
      }
    
      // Find small clusters
      const smallClusters = new Set();
      for (const [cid, count] of Object.entries(clusterCounts)) {
        if (count < minSize) {
          smallClusters.add(parseInt(cid));
        }
      }
    
      // Reassign small cluster heads to misc (-1)
      if (smallClusters.size > 0) {
        const merged = {};
        for (const [headId, cid] of Object.entries(assignments)) {
          merged[headId] = smallClusters.has(cid) ? -1 : cid;
        }
        return {
          assignments: merged,
          smallClusters: smallClusters,
          nClusters: new Set(Object.values(merged)).size,
        };
      }
    
      return {
        assignments: assignments,
        smallClusters: smallClusters,
        nClusters: new Set(Object.values(assignments)).size,
      };
    }
    
    /**
     * Find the cut height that produces a target number of clusters.
     *
     * @param {number[][]} linkage - Scipy-format linkage matrix
     * @param {number} nHeads - Number of leaf nodes (heads)
     * @param {number} nClusters - Desired number of clusters
     * @returns {number} Cut height
     */
    function cutHeightForNClusters(linkage, nHeads, nClusters) {
      if (nClusters >= nHeads) {
        return Math.max(...linkage.map((row) => row[2]));
      }
      const heights = linkage.map((row) => row[2]).sort((a, b) => b - a);
      return heights[nHeads - nClusters - 1] + 1e-10;
    }
    
    /**
     * Compute cluster assignments for a target number of clusters.
     *
     * @param {number[][]} linkage - Scipy-format linkage matrix
     * @param {string[]} clsValues - Head IDs in clustering order
     * @param {number} nClusters - Desired number of clusters
     * @returns {{ assignments: Object<string, number>, cutHeight: number }}
     */
    function computeClustersByNClusters(linkage, clsValues, nClusters) {
      const n = clsValues.length;
    
      if (nClusters >= n) {
        const assignments = {};
        clsValues.forEach((cls, i) => {
          assignments[cls] = i;
        });
        return {
          assignments,
          cutHeight: Math.max(...linkage.map((row) => row[2])),
        };
      }
    
      const cutHeight = cutHeightForNClusters(linkage, n, nClusters);
      return {
        assignments: computeClustersByHeight(linkage, clsValues, cutHeight),
        cutHeight,
      };
    }
    
    /**
     * Look up precomputed flat partition assignments by parameter key.
     * Used for HDBSCAN and Leiden methods where assignments are precomputed
     * at discrete parameter values (not computed client-side like hierarchical).
     *
     * @param {Object<string, Object<string, number>>} partitions - paramKey -> { headId: clusterId }
     * @param {string} paramKey - The parameter key to look up
     * @returns {Object<string, number>} headId -> clusterId (empty object if key not found)
     */
    function getFlatPartitionAssignments(partitions, paramKey) {
      return partitions[paramKey] || {};
    }

    <script>
    /**
     * ClusteringLoader - Loads clustering data for AttentionPedia
     *
     * Supports hierarchical (client-side cut-height), HDBSCAN, and Leiden
     * (precomputed flat partitions at discrete parameter values).
     */
    class ClusteringLoader {
      constructor() {
        this._is_loaded = false;
        this._load_promise = null;
        this._assignments = {};
        this._rawAssignments = {}; // before min-size filtering
        this._nClusters = 10;
        this._cutHeight = null;
        this._minClusterSize = 0;
    
        // Cluster labels (loaded from localStorage + server)
        this._labels = {};
        this._resolvedLabels = {};
    
        // Current method: "hierarchical" | "hdbscan" | "leiden"
        this._method = "hierarchical";
        this._availableMethods = [];
    
        // Hierarchical-specific
        this._meta = null;
        this._linkage = null;
        this._maxCutHeight = null;
    
        // Flat method data: { method: { meta, partitions, labels } }
        this._flatData = {};
        this._currentParamKey = null;
      }
    
      /**
       * Ensure clustering data is loaded
       */
      async _ensureLoaded() {
        if (this._is_loaded) return;
        if (this._load_promise) {
          await this._load_promise;
          return;
        }
    
        this._load_promise = this._load();
        await this._load_promise;
      }
    
      async _load() {
        try {
          // Detect available methods from manifest
          const methodsUrl =
            CONFIG.clustering_methods_url ||
            "../../features/clustering_methods.json";
          let methods = ["hierarchical"];
          try {
            const mResp = await fetch(methodsUrl);
            if (mResp.ok) {
              const manifest = await mResp.json();
              methods = manifest.methods || ["hierarchical"];
            }
          } catch (e) {
            // Fall back to hierarchical only
          }
          this._availableMethods = methods;
    
          // --- Load hierarchical ---
          if (methods.includes("hierarchical")) {
            const metaUrl =
              CONFIG.clustering_meta_url ||
              "../../features/clustering/clustering_meta.json";
            const linkageUrl =
              CONFIG.clustering_linkage_url ||
              "../../features/clustering/linkage.json";
    
            const [metaResp, linkageResp] = await Promise.all([
              fetch(metaUrl),
              fetch(linkageUrl),
            ]);
    
            if (metaResp.ok && linkageResp.ok) {
              this._meta = await metaResp.json();
              this._linkage = await linkageResp.json();
    
              if (this._linkage && this._linkage.length > 0) {
                this._maxCutHeight = Math.max(
                  ...this._linkage.map((row) => row[2]),
                );
              }
    
              // Load hierarchical labels
              const labelsUrl =
                CONFIG.cluster_labels_url ||
                "../../features/clustering/cluster_labels.json";
              this._labels = await loadClusterLabels(labelsUrl);
            }
          }
    
          // --- Load flat methods (HDBSCAN, Leiden) ---
          for (const method of ["hdbscan", "leiden"]) {
            if (!methods.includes(method)) continue;
            try {
              const flatMetaUrl =
                CONFIG[`clustering_${method}_meta_url`] ||
                `../../features/clustering_${method}/clustering_meta.json`;
              const flatPartitionsUrl =
                CONFIG[`clustering_${method}_partitions_url`] ||
                `../../features/clustering_${method}/partitions.json`;
              const flatLabelsUrl =
                CONFIG[`clustering_${method}_labels_url`] ||
                `../../features/clustering_${method}/cluster_labels.json`;
    
              const [fMetaResp, fPartResp] = await Promise.all([
                fetch(flatMetaUrl),
                fetch(flatPartitionsUrl),
              ]);
    
              if (fMetaResp.ok && fPartResp.ok) {
                const fMeta = await fMetaResp.json();
                const fPartitions = await fPartResp.json();
                const fLabels = await loadClusterLabels(flatLabelsUrl);
                this._flatData[method] = {
                  meta: fMeta,
                  partitions: fPartitions,
                  labels: fLabels,
                };
              }
            } catch (e) {
              console.warn(`Failed to load ${method} clustering data:`, e);
            }
          }
    
          this._is_loaded = true;
    
          // Compute initial assignments: prefer saved method, then leiden, then hierarchical
          const savedMethod = ClusteringConfig.getMethod();
          if (
            savedMethod &&
            this._availableMethods.includes(savedMethod) &&
            (savedMethod === "hierarchical" ||
              this._flatData[savedMethod] !== undefined)
          ) {
            this._setMethodInternal(savedMethod);
          } else if (this._flatData["leiden"]) {
            this._setMethodInternal("leiden");
          } else if (this._linkage && this._meta) {
            this._method = "hierarchical";
            this._computeAssignmentsByNClusters(this._nClusters);
          } else if (Object.keys(this._flatData).length > 0) {
            const firstFlat = Object.keys(this._flatData)[0];
            this._setMethodInternal(firstFlat);
          }
        } catch (e) {
          console.warn("Failed to load clustering data:", e);
          this._is_loaded = true;
        }
      }
    
      /**
       * Check if clustering data is available
       */
      async isAvailable() {
        await this._ensureLoaded();
        return (
          (this._meta !== null && this._linkage !== null) ||
          Object.keys(this._flatData).length > 0
        );
      }
    
      /**
       * Get list of available clustering methods.
       * @returns {string[]}
       */
      getAvailableMethods() {
        return this._availableMethods.filter(
          (m) =>
            (m === "hierarchical" && this._linkage !== null) ||
            this._flatData[m] !== undefined,
        );
      }
    
      /**
       * Get current clustering method.
       * @returns {string}
       */

       * @param {number} clusterId

      async getTopClusters(n) {

          }))

        await this._ensureLoaded();
        return this._data?.head_to_types?.[head_id] || [];

      async get_type_heads(type) {
        await this._ensureLoaded();
        return this._data?.type_to_heads?.[type] || [];
      }
    
      async get_type_meta(type) {
        await this._ensureLoaded();
        return this._data?.type_metadata?.[type] || {};

    			resultData[i] = this.data[flatIndices[i]];
    		}
    
    		return new this.constructor(resultData, resultShape, this.dtype);
    	}
    
    	/**
    	 * Sets values at specified indices
    	 *
    	 * @param {...*} args - Indices followed by value to set
    	 */
    	set(...args) {
    		// Handle case where args is array
    		let indices, value;
    		if (args.length === 2 && Array.isArray(args[0])) {
    			indices = args[0];
    			value = args[1];
    		} else {
    			value = args[args.length - 1];
    			indices = args.slice(0, args.length - 1);
    		}
    
    		const flatIndices = this._getIndices(indices);
    
    		// If we got a single index, set the single value
    		if (typeof flatIndices === "number") {
    			this.data[flatIndices] = value;
    			return;
    		}
    
    		// Otherwise, set all indices to the value
    		// If value is an array, distribute its values
    		if (
    			Array.isArray(value) ||
    			ArrayBuffer.isView(value) ||
    			value instanceof NDArray
    		) {
    			const valueArray = value instanceof NDArray ? value.data : value;
    			if (valueArray.length !== flatIndices.length) {
    				throw new Error(
    					`Cannot broadcast ${valueArray.length} values to ${flatIndices.length} indices`,
    				);
    			}
    
    			for (let i = 0; i < flatIndices.length; i++) {
    				this.data[flatIndices[i]] = valueArray[i];
    			}
    		} else {
    			// Set all indices to the same value
    			for (const idx of flatIndices) {
    				this.data[idx] = value;
    			}
    		}
    	}
    
    	/**
    	 * Slice along an arbitrary dimension: extract [start, end) along the given axis.
    	 * Returns a new contiguous NDArray.
    	 *
    	 * @param {number} dim - Axis to slice along (supports negative indexing)
    	 * @param {number} start - Start index (inclusive)
    	 * @param {number} end - End index (exclusive)
    	 * @returns {NDArray} Sliced array
    	 *
    	 * @example
    	 * const arr = new NDArray(data, [2, 3, 4], 'float32');
    	 * const sliced = arr.sliceDim(1, 0, 2); // shape: [2, 2, 4]
    	 */
    	sliceDim(dim, start, end) {
    		const shape = this.shape;
    		const rank = shape.length;
    
    		// Handle negative dim
    		if (dim < 0) dim = rank + dim;
    
    		if (dim < 0 || dim >= rank) {
    			throw new Error(
    				`dim ${dim} is out of bounds for array with ${rank} dimensions`,
    			);
    		}
    		// Handle negative start/end
    		if (start < 0) start = shape[dim] + start;
    		if (end < 0) end = shape[dim] + end;
    
    		if (start < 0 || end > shape[dim] || start > end) {
    			throw new Error(
    				`Invalid slice [${start}, ${end}) for axis ${dim} with size ${shape[dim]}`,
    			);
    		}
    
    		const newShape = [...shape];
    		newShape[dim] = end - start;
    
    		const outerSize = shape.slice(0, dim).reduce((a, b) => a * b, 1);
    		const innerSize = shape.slice(dim + 1).reduce((a, b) => a * b, 1);
    		const dimSize = shape[dim];
    		const sliceSize = (end - start) * innerSize;
    
    		const out = new this.data.constructor(
    			newShape.reduce((a, b) => a * b, 1),
    		);
    
    		for (let outer = 0; outer < outerSize; outer++) {
    			for (let d = start; d < end; d++) {
    				const srcOff = (outer * dimSize + d) * innerSize;
    				const dstOff = outer * sliceSize + (d - start) * innerSize;
    				for (let inner = 0; inner < innerSize; inner++) {
    					out[dstOff + inner] = this.data[srcOff + inner];
    				}
    			}
    		}
    
    		return new this.constructor(out, newShape, this.dtype);
    	}
    
    	/**
    	 * Convert to a Tensor instance (requires tensor.js to be loaded).
    	 * If dtype is already float32, shares the underlying data buffer.
    	 *
    	 * @param {string} [dtype='float32'] - Target dtype for the Tensor
    	 * @returns {Tensor} Tensor instance
    	 * @throws {ReferenceError} If tensor.js is not loaded
    	 */
    	toTensor(dtype = "float32") {
    		if (typeof Tensor === "undefined") {
    			throw new ReferenceError(
    				"Tensor class not found — load tensor.js after array.js",
    			);
    		}
    		if (!_DTYPE_BY_NAME[dtype]) {
    			throw new Error(`Unsupported dtype: ${dtype}`);
    		}
    		let data;
    		if (this.dtype === dtype) {
    			data = this.data;
    		} else {
    			// If source has a converter (e.g. float16 → Uint16Array), decode first
    			const srcInfo = _DTYPE_BY_NAME[this.dtype];
    			const rawData =
    				srcInfo && srcInfo.converter
    					? srcInfo.converter(this.data)
    					: this.data;
    			data = new _DTYPE_BY_NAME[dtype].arrayConstructor(rawData);
    		}
    		return new Tensor(data, [...this.shape], dtype);
    	}
    
    	/**
    	 * Create an NDArray from a Tensor or plain tensor object {data, shape}.
    	 *
    	 * @param {Object} t - Tensor instance or plain object with data and shape properties
    	 * @param {string} [dtype] - Override dtype (auto-detected from data if omitted)
    	 * @returns {NDArray} NDArray instance
    	 */
    	static fromTensor(t, dtype) {
    		if (!t || !t.data || !t.shape) {
    			throw new Error("Expected object with data and shape properties");
    		}
    		const inferredDtype =
    			dtype ||
    			(t instanceof NDArray
    				? t.dtype
    				: _CONSTRUCTOR_TO_DTYPE.get(t.data.constructor) || "float32");
    		return new NDArray(t.data, [...t.shape], inferredDtype);
    	}
    
    	/**
    	 * Returns a string representation of the array
    	 *
    	 * @returns {string} String representation of the array
    	 */
    	toString() {
    		// Simple representation for 1D arrays
    		if (this.shape.length === 1) {
    			return `[${Array.from(this.data).join(", ")}]`;
    		}
    
    		// For higher dimensions, we'll just show shape and type
    		return `NDArray(${this.shape.join("X")}, ${this.dtype})`;
    	}
    
    	static parse(arrayBufferContents) {
    		const npy = new npyjs();
    		const npyData = npy.parse(arrayBufferContents);
    		if (!npyData) {
    			throw new Error("Failed to parse NPY data");
    		}
    		// Convert data to NDArray
    		return new NDArray(npyData.data, npyData.shape, npyData.dtype);
    	}
    
    	static async load(filename, callback, fetchArgs) {
    		if (filename.endsWith(".npz")) {
    			throw new Error(
    				"NDArray.load() does not support .npz files. Use NDArray.loadNPZ() instead.",
    			);
    		}
    		const npy = new npyjs({ convertFloat16: true });
    		const npyData = await npy.load(filename, null, fetchArgs);
    		if (!npyData) {
    			throw new Error("Failed to load NPY data");
    		}
    		return new NDArray(npyData.data, npyData.shape, npyData.dtype);
    	}
    
    	/**
    	 * Load an NPZ file and return a dict of NDArrays keyed by array name.
    	 * Requires JSZip to be loaded globally.
    	 *
    	 * @param {string} filename - URL or path to the NPZ file
    	 * @param {Object} [fetchArgs] - Additional fetch arguments
    	 * @returns {Promise<Object<string, NDArray>>} - Dict of NDArrays
    	 */
    	static async loadNPZ(filename, fetchArgs) {
    		const npy = new npyjs({ convertFloat16: true });
    		const arrays = await npy.loadNPZ(filename, fetchArgs);
    		const result = {};
    		for (const [name, npyData] of Object.entries(arrays)) {
    			result[name] = new NDArray(
    				npyData.data,
    				npyData.shape,
    				npyData.dtype,
    			);
    		}
    		return result;
    	}
    
    	/**
    	 * Load a slice of an NPY array using HTTP range requests.
    	 * Only first-axis slicing is supported (contiguous bytes).
    	 *
    	 * @param {string} url - URL to the NPY file
    	 * @param {Array<number>|number} slice - [start, end) range or single index for first axis
    	 * @param {Object} [fetchArgs] - Additional fetch arguments
    	 * @returns {Promise<NDArray>} - Sliced array
    	 *
    	 * @example
    	 * // Load rows 100-199 of a 2D array
    	 * const slice = await NDArray.loadSlice(url, [100, 200]);
    	 * // Load single row
    	 * const row = await NDArray.loadSlice(url, 50);
    	 */
    	static async loadSlice(url, slice, fetchArgs = {}) {
    		// NPZ files are compressed archives - can't use range requests
    		if (url.endsWith(".npz")) {
    			throw new Error(
    				"loadSlice does not support NPZ files (compressed archives)",
    			);
    		}
    
    		// Allow single int to get one row
    		const [start, end] =
    			typeof slice === "number" ? [slice, slice + 1] : slice;
    
    		// Fetch header to get array metadata
    		const headerResult = await fetchNPYHeader(url, fetchArgs);
    
    		if (!headerResult.rangeSupported) {
    			// Fall back to full download
    			const fullBuffer = await headerResult.fullResponse.arrayBuffer();
    			const fullArray = NDArray.parse(fullBuffer);
    			return fullArray.slice(slice);
    		}
    
    		const { info } = headerResult;
    
    		// Validate slice bounds
    		if (start < 0 || end > info.shape[0] || start > end) {
    			throw new Error(
    				`Invalid slice [${start}, ${end}) for array with shape ${info.shape}`,
    			);
    		}
    
    		// Empty slice — return immediately without HTTP fetch
    		if (start === end) {
    			const slicedShape = [0, ...info.shape.slice(1)];
    			const dtypeInfo = _DTYPE_BY_DESCRIPTOR[info.dtype];
    			return new NDArray(
    				new dtypeInfo.arrayConstructor(0),
    				slicedShape,
    				dtypeInfo.name,
    			);
    		}
    
    		// Calculate byte range for the slice
    		const byteStart = info.dataOffset + start * info.firstAxisStride;
    		const byteEnd = info.dataOffset + end * info.firstAxisStride - 1;
    
    		// Fetch the slice data
    		const dataResponse = await fetch(url, {
    			...fetchArgs,
    			headers: {
    				...fetchArgs.headers,
    				Range: `bytes=${byteStart}-${byteEnd}`,
    			},
    		});
    
    		if (dataResponse.status !== 206) {
    			// Range request failed, fall back to full download
    			console.warn(
    				"Range request for data failed, downloading full file",
    			);
    			const fullArray = await NDArray.load(url, null, fetchArgs);
    			return fullArray.slice(slice);
    		}
    
    		const dataBuffer = await dataResponse.arrayBuffer();
    
    		// Create typed array from the data
    		const dtypeInfo = _DTYPE_BY_DESCRIPTOR[info.dtype];
    		if (!dtypeInfo) {
    			throw new Error(`Unsupported dtype: ${info.dtype}`);
    		}
    
    		const nums = new dtypeInfo.arrayConstructor(dataBuffer);
    		const data = dtypeInfo.converter ? dtypeInfo.converter(nums) : nums;
    
    		// Construct sliced shape
    		const slicedShape = [end - start, ...info.shape.slice(1)];
    
    		return new NDArray(
    			data,
    			slicedShape,
    			dtypeInfo.converter ? "float32" : dtypeInfo.name,
    		);
    	}
    
    	/**
    	 * Infer the array format from a JSON object
    	 * @param {Object} obj - JSON object potentially containing array data
    	 * @returns {string|null} - Format name or null if not an array format
    	 */
    	static inferFormat(obj) {
    		if (!obj || typeof obj !== "object" || Array.isArray(obj)) {
    			if (Array.isArray(obj)) return "list";
    			return null;
    		}
    
    		const fmt = obj[_FORMAT_KEY];
    		if (!fmt || typeof fmt !== "string") return null;
    
    		// Format is like "numpy.ndarray:array_b64_meta" or "torch.Tensor:array_list_meta"
    		if (fmt.includes(":")) {
    			const suffix = fmt.split(":")[1];
    			if (
    				[
    					"array_list_meta",
    					"array_hex_meta",
    					"array_b64_meta",
    					"zero_dim",
    				].includes(suffix)
    			) {
    				return suffix;
    			}
    		}
    
    		return null;
    	}
    
    	/**
    	 * Deserialize an NDArray from JSON in various formats
    	 * @param {Object} obj - JSON object containing array data
    	 * @param {string} [format] - Optional format override (auto-detected if not provided)
    	 * @returns {NDArray} - Deserialized NDArray
    	 */
    	static fromJSON(obj, format = null) {
    		// Auto-detect format if not provided
    		if (!format) {
    			format = NDArray.inferFormat(obj);
    			if (!format) {
    				throw new Error("Cannot infer array format from object");
    			}
    		}
    
    		// Handle plain list
    		if (format === "list") {
    			if (!Array.isArray(obj)) {
    				throw new Error("Expected array for list format");
    			}
    			// Convert nested list to flat TypedArray
    			const flatList = obj.flat(Infinity);
    			const data = new Float64Array(flatList);
    			// Infer shape by walking first elements at each nesting level
    			const shape = [];
    			let current = obj;
    			while (Array.isArray(current)) {
    				shape.push(current.length);
    				current = current[0];
    			}
    			// Validate shape matches flat data (catches jagged arrays)
    			const expectedSize = shape.reduce((a, b) => a * b, 1);
    			if (flatList.length !== expectedSize) {
    				throw new Error(
    					`Jagged array: flat length ${flatList.length} does not match shape [${shape}] (expected ${expectedSize})`,
    				);
    			}
    			return new NDArray(data, shape, "float64");
    		}
    
    		// All other formats have metadata
    		if (!obj.shape || !obj.dtype) {
    			throw new Error(`Missing shape or dtype for format ${format}`);
    		}
    
    		const shape = obj.shape;
    		const dtypeName = obj.dtype;
    		const dtypeInfo = _DTYPE_BY_NAME[dtypeName];
    
    		if (!dtypeInfo) {
    			throw new Error(`Unsupported dtype: ${dtypeName}`);
    		}
    
    		// Handle zero-dimensional arrays
    		if (format === "zero_dim") {
    			let dataValue = obj.data;
    			// Convert to BigInt for 64-bit integer types
    			if (dtypeName === "int64" || dtypeName === "uint64") {
    				dataValue = BigInt(dataValue);
    			}
    			const data = new dtypeInfo.arrayConstructor([dataValue]);
    			if (dtypeInfo.converter) {
    				const converted = dtypeInfo.converter(data);
    				return new NDArray(converted, shape, "float32");
    			}
    			return new NDArray(data, shape, dtypeName);
    		}
    
    		// Handle array_list_meta
    		if (format === "array_list_meta") {
    			const flatList = obj.data.flat(Infinity);
    			const expectedSize = shape.reduce((a, b) => a * b, 1);
    			if (flatList.length !== expectedSize) {
    				throw new Error(
    					`Jagged array in ${format}: flat length ${flatList.length} does not match shape [${shape}] (expected ${expectedSize})`,
    				);
    			}
    			// Convert to BigInt for 64-bit integer types
    			const processedList =
    				dtypeName === "int64" || dtypeName === "uint64"
    					? flatList.map((v) => BigInt(v))
    					: flatList;
    			const data = new dtypeInfo.arrayConstructor(processedList);
    			if (dtypeInfo.converter) {
    				const converted = dtypeInfo.converter(data);
    				return new NDArray(converted, shape, "float32");
    			}
    			return new NDArray(data, shape, dtypeName);
    		}
    
    		// Handle array_hex_meta
    		if (format === "array_hex_meta") {
    			const hexString = obj.data;
    			if (
    				!hexString ||
    				typeof hexString !== "string" ||
    				hexString.length % 2 !== 0
    			) {
    				throw new Error(
    					`Invalid hex string: must be non-empty with even length`,
    				);
    			}
    			const bytes = new Uint8Array(
    				hexString.match(/.{1,2}/g).map((byte) => parseInt(byte, 16)),
    			);
    			const expectedBytes =
    				shape.reduce((a, b) => a * b, 1) * (dtypeInfo.size / 8);
    			if (bytes.length !== expectedBytes) {
    				throw new Error(
    					`Hex data size ${bytes.length} does not match shape [${shape}] with dtype ${dtypeName} (expected ${expectedBytes} bytes)`,
    				);
    			}
    			const data = new dtypeInfo.arrayConstructor(bytes.buffer);
    			if (dtypeInfo.converter) {
    				const converted = dtypeInfo.converter(data);
    				return new NDArray(converted, shape, "float32");
    			}
    			return new NDArray(data, shape, dtypeName);
    		}
    
    		// Handle array_b64_meta
    		if (format === "array_b64_meta") {
    			const b64String = obj.data;
    			const binaryString = atob(b64String);
    			const expectedBytes =
    				shape.reduce((a, b) => a * b, 1) * (dtypeInfo.size / 8);
    			if (binaryString.length !== expectedBytes) {
    				throw new Error(
    					`Base64 decoded to ${binaryString.length} bytes but shape [${shape}] with dtype ${dtypeName} expects ${expectedBytes} bytes`,
    				);
    			}
    			const bytes = new Uint8Array(binaryString.length);
    			for (let i = 0; i < binaryString.length; i++) {
    				bytes[i] = binaryString.charCodeAt(i);
    			}
    			const data = new dtypeInfo.arrayConstructor(bytes.buffer);
    			if (dtypeInfo.converter) {
    				const converted = dtypeInfo.converter(data);
    				return new NDArray(converted, shape, "float32");
    			}
    			return new NDArray(data, shape, dtypeName);
    		}
    
    		throw new Error(`Unsupported array format: ${format}`);
    	}
    }

    <script>
    // TODO: fallback to getting from github?
    // || "https://raw.githubusercontent.com/<TODO>";
    
    async function _load_dists_meta() {
      const r = await fetch(CONFIG.headDistsmeta_url);
      if (r.ok) {
        const loaded = await r.json();
        return loaded;
      } else {
        throw new Error(
          `Failed to load head embeddings data from ${CONFIG.headDistsmeta_url}`,
        );
      }
    }
    
    class HeadDistances {
      constructor() {
        this._meta_loaded = false;
        this._meta_promise = null;
        this.head_dists_meta = null;
        this._rowCache = new Map();
      }
    
      async _ensureMetaLoaded() {
        if (this._meta_loaded) {
          return;
        }
    
        if (this._meta_promise) {
          return this._meta_promise;
        }
    
        this._meta_promise = (async () => {
          try {
            this.head_dists_meta = await _load_dists_meta();
            this._meta_loaded = true;
          } catch (error) {
            NOTIF.error("Failed to load head distances metadata", error);
            throw error;
          }
        })();
    
        return this._meta_promise;
      }
    
      /** Fetch a single row from the distances matrix via HTTP range request */
      async _loadRow(head_idx) {
        if (this._rowCache.has(head_idx)) {
          return this._rowCache.get(head_idx);
        }
        const promise = NDArray.loadSlice(CONFIG.headDistsnpy_url, head_idx);
        this._rowCache.set(head_idx, promise);
        return promise;
      }
    
      isMetadataLoaded() {
        return this.head_dists_meta !== null;
      }
    
      get_head_idx(head_name) {
        const idx = this.head_dists_meta.cls_values.indexOf(head_name);
        if (idx === -1) {
          throw new Error(`Head not found: ${head_name}`);
        }
        return idx;
      }
    
      get_head_name(head_idx) {
        if (head_idx < 0 || head_idx >= this.head_dists_meta.cls_values.length) {
          throw new Error(`Invalid head index: ${head_idx}`);
        }
        return this.head_dists_meta.cls_values[head_idx];
      }
    
      async getNearestHeads(head_name, n = 5) {
        await this._ensureMetaLoaded();
    
        const head_idx = this.get_head_idx(head_name);
        const distanceRow = await this._loadRow(head_idx);
        const distanceArray = Array.from(distanceRow.data);
    
        // Sort distances and get indices of n nearest (excluding self)
        const indexed_dists = Array.from(distanceArray, (dist, idx) => ({
          dist,
          idx,
        }));
        indexed_dists.sort((a, b) => a.dist - b.dist);
        const best_n_items = indexed_dists.slice(1, n + 1);
    
        return {
          head_names: best_n_items.map((item) => this.get_head_name(item.idx)),
          distances: best_n_items.map((item) => item.dist),
        };
      }
    
      async getHeadDistance(head_name1, head_name2) {
        await this._ensureMetaLoaded();
        const head_idx1 = this.get_head_idx(head_name1);
        const head_idx2 = this.get_head_idx(head_name2);
    
        const distanceRow = await this._loadRow(head_idx1);
        return distanceRow.data[head_idx2];
      }
    
      async getHeadDistances(head_name, head_names_list) {
        await this._ensureMetaLoaded();
        const head_idx = this.get_head_idx(head_name);
        const distanceRow = await this._loadRow(head_idx);
        const distanceArray = Array.from(distanceRow.data);
    
        return head_names_list.map((target_head) => {
          const target_idx = this.get_head_idx(target_head);
          const distance = distanceArray[target_idx];
          return {
            head_name: target_head,
            distance: distance,
          };
        });
      }
    }
    
    </script>
