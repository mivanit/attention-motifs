<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Head Analysis</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="AttentionPedia.js"></script>
    <script src="headInfo.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</head>

<body>
    <div class="container" x-data="attentionApp" x-init="await init()">
        <div class="section">
            <table class="pattern-table">
                <thead>
                    <tr>
                        <th>Head</th>
                        <template x-for="prompt in prompts" :key="prompt">
                            <th x-text="prompt"></th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="headId in heads_display" :key="headId">
                        <tr>
                            <td class="head-info" x-text="headId"></td>
                            <template x-for="prompt in prompts" :key="prompt">
                                <td>
                                    <div x-data="patternComponent(headId, prompt)">
                                        <img x-show="imageUrl" :src="imageUrl" class="pattern-image" :alt="`Pattern for ${headId} on ${prompt}`">
                                    </div>
                                </td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
