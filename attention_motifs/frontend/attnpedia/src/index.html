<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Head Analysis</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="headInfo.js"></script>
    <script src="AttentionPedia.js"></script>
    <script src="app.js"></script>
</head>

<body>
    <div class="container" x-data="attentionHeadApp" x-init="await initialize()">
        <!-- Header -->
        <div class="section header">
            <template x-if="!loading && currentHead">
                <div>
                    <h1 x-text="currentHead.id"></h1>
                    <div class="head-subtitle" x-text="`Layer ${currentHead.layer}, Head ${currentHead.head} • ${currentHead.model} (${currentHead.paramCount}M parameters)`">
                    </div>
                </div>
            </template>
            <template x-if="loading">
                <div class="loading">Loading attention head data...</div>
            </template>
            <template x-if="error">
                <div class="error" x-text="error"></div>
            </template>
        </div>
        <template x-if="!loading && !error && currentHead">
            <div>
                <!-- Main Grid: Model Position + Tool Links -->
                <div class="main-grid">
                    <div class="section">
                        <h3>Position in Model</h3>
                        <div style="margin-bottom: 10px; font-size: 0.9em; color: #7f8c8d;">
                            <span x-text="`Layer ${currentHead.layer}, Head ${currentHead.head} of ${modelInfo.layers}×${modelInfo.headsPerLayer} grid:`"></span>
                        </div>
                        <div class="model-grid">
                            <template x-for="(head, idx) in allModelHeads" :key="idx">
                                <div class="model-head" :class="{
                                         'current': head.isCurrent,
                                         'same-class': head.isSameClass,
                                         'neighbor': head.isNeighbor
                                     }" :title="`L${head.layer}:H${head.head} ${head.classification || ''}`" @click="navigateToHead(head.id)">
                                </div>
                            </template>
                        </div>
                        <div style="margin-top: 10px; font-size: 0.8em; color: #7f8c8d;">
                            <div>🔴 Current head</div>
                            <div>🟠 Same classification</div>
                            <div>🔵 Nearest neighbors</div>
                        </div>
                    </div>
                    <div class="section">
                        <h3>Analysis Tools</h3>
                        <button class="link-button" @click="openPatternLens('single')"> View in Pattern Lens </button>
                        <button class="link-button" @click="openEmbeddingSpace()"> View in Embedding Space </button>
                        <button class="link-button secondary" @click="downloadPatterns()"> Download Raw Patterns </button>
                        <button class="link-button secondary" @click="exportAnalysis()"> Export Analysis </button>
                    </div>
                </div>
                <!-- AttentionPedia Information -->
                <div class="section">
                    <h2>AttentionPedia Classifications</h2>
                    <div style="margin-bottom: 15px;">
                        <template x-for="classification in currentHead.classifications" :key="classification.name">
                            <span class="tag" :class="classification.type" x-text="`${classification.source}: ${classification.name}`">
                            </span>
                        </template>
                    </div>
                    <template x-for="citation in currentHead.citations" :key="citation.title">
                        <div class="citation">
                            <strong x-text="citation.title"></strong><br>
                            <span x-text="citation.authors"></span> - <a :href="citation.url" x-text="citation.url" target="_blank"></a><br>
                            <em x-text="citation.description"></em>
                        </div>
                    </template>
                </div>
                <!-- Attention Patterns -->
                <div class="section">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h2>Attention Patterns</h2>
                        <div class="controls">
                            <button class="button secondary" @click="randomizePrompts()"> Randomize Prompts </button>
                            <button class="button" @click="configurePrompts()"> Configure Prompts </button>
                        </div>
                    </div>
                    <table class="pattern-table">
                        <!-- Header row with prompts -->
                        <thead>
                            <tr>
                                <th style="width: 200px;">Head</th>
                                <template x-for="(prompt, idx) in currentPrompts" :key="idx">
                                    <th style="font-size: 0.9em;" x-text="`Prompt ${idx + 1}: \" ${prompt.text.substring(0, 30)}...\"`"></th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Current head section -->
                            <tr>
                                <td colspan="5" class="section-header current-head-header"> Current Head (<span x-text="currentHead.id"></span>) </td>
                            </tr>
                            <tr>
                                <td style="vertical-align: top;">
                                    <div class="neighbor-info">
                                        <div class="neighbor-name" x-text="currentHead.id"></div>
                                        <div class="neighbor-distance" x-text="currentHead.classifications[0]?.name || 'Unclassified'"></div>
                                        <a href="#" class="neighbor-link">View Details →</a>
                                    </div>
                                </td>
                                <template x-for="(prompt, idx) in currentPrompts" :key="idx">
                                    <td>
                                        <div class="mini-pattern" @click="viewPattern(currentHead.id, prompt.hash)" x-text="`${prompt.patternSize}×${prompt.patternSize}`">
                                        </div>
                                    </td>
                                </template>
                            </tr>
                            <!-- Nearest neighbors section -->
                            <tr>
                                <td colspan="5" class="section-header"> Nearest Neighbors in Embedding Space <a href="#" style="color: #ecf0f1; text-decoration: none; float: right;" @click="openEmbeddingSpace()"> View Embedding Space → </a>
                                </td>
                            </tr>
                            <template x-for="neighbor in nearestNeighbors" :key="neighbor.id">
                                <tr>
                                    <td style="vertical-align: top;">
                                        <div class="neighbor-info">
                                            <div class="neighbor-name" x-text="neighbor.id"></div>
                                            <div class="neighbor-distance" x-text="`Distance: ${neighbor.distance.toFixed(2)}`"></div>
                                            <a href="#" class="neighbor-link" @click="navigateToHead(neighbor.id)">View →</a>
                                        </div>
                                    </td>
                                    <template x-for="(prompt, idx) in currentPrompts" :key="idx">
                                        <td>
                                            <div class="mini-pattern" @click="viewPattern(neighbor.id, prompt.hash)" x-text="`${prompt.patternSize}×${prompt.patternSize}`">
                                            </div>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                            <!-- Same classification section -->
                            <template x-if="sameClassHeads.length > 0">
                                <template>
                                    <tr>
                                        <td colspan="5" class="section-header">
                                            <span x-text="`Other ${currentHead.classifications[0]?.name || 'Similar'} Heads`"></span>
                                            <a href="#" style="color: #ecf0f1; text-decoration: none; float: right;" @click="openPatternLens('classification')">
                                                <span x-text="`View All ${currentHead.classifications[0]?.name || 'Similar'} Heads →`"></span>
                                            </a>
                                        </td>
                                    </tr>
                                    <template x-for="head in sameClassHeads" :key="head.id">
                                        <tr>
                                            <td style="vertical-align: top;">
                                                <div class="neighbor-info">
                                                    <div class="neighbor-name" x-text="head.id"></div>
                                                    <div class="neighbor-distance" x-text="head.classifications[0]?.name || 'Unclassified'"></div>
                                                    <a href="#" class="neighbor-link" @click="navigateToHead(head.id)">View →</a>
                                                </div>
                                            </td>
                                            <template x-for="(prompt, idx) in currentPrompts" :key="idx">
                                                <td>
                                                    <div class="mini-pattern" @click="viewPattern(head.id, prompt.hash)" x-text="`${prompt.patternSize}×${prompt.patternSize}`">
                                                    </div>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                    <tr>
                                        <td style="vertical-align: top;">
                                            <div class="neighbor-info">
                                                <div class="neighbor-name">Average</div>
                                                <div class="neighbor-distance" x-text="`All ${currentHead.classifications[0]?.name || 'similar'} heads`"></div>
                                                <a href="#" class="neighbor-link" @click="compareClassification()">Compare →</a>
                                            </div>
                                        </td>
                                        <template x-for="(prompt, idx) in currentPrompts" :key="idx">
                                            <td>
                                                <div class="mini-pattern" @click="viewAveragePattern(currentHead.classifications[0]?.name, prompt.hash)" x-text="`${prompt.patternSize}×${prompt.patternSize} Avg`">
                                                </div>
                                            </td>
                                        </template>
                                    </tr>
                                </template>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </template>
    </div>
</body>

</html>
