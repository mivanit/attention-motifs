    	font-weight: 500;
    }
    
    .pattern-placeholder {
    	width: 60px;
    	height: 60px;
    	background: #ecf0f1;
    	border: 1px solid #ddd;
    	border-radius: 4px;
    	display: flex;
    	align-items: center;
    	justify-content: center;
    	font-size: 0.8em;
    	color: #7f8c8d;
    	cursor: pointer;
    	transition: all 0.2s;
    	margin: 0 auto;
    }
    
    .pattern-placeholder:hover {
    	background: #d5dbdb;
    	transform: scale(1.05);
    }

        <!-- begin 'AttentionPedia.js' -->
    <script>
    class AttentionPedia {
    	constructor() {
    		this.heads = new Map();
    		this.classifications = new Map();
    		this._initializeMockData();
    	}
    
    	_initializeMockData() {
    		const models = ['gpt2-small', 'gpt2-medium', 'gpt2-large'];
    		const classificationTypes = ['induction', 'duplicate', 'previous', 'name-mover', 'subject', 'copy'];
    		const layers = 12;
    		const headsPerLayer = 12;
    
    		// Generate mock heads
    		models.forEach(model => {
    			const paramCount = model === 'gpt2-small' ? 124 : model === 'gpt2-medium' ? 355 : 774;
    
    			for (let layer = 0; layer < layers; layer++) {
    				for (let head = 0; head < headsPerLayer; head++) {
    					const id = `${model}:L${layer}:H${head}`;
    					const headInfo = new HeadInfo(id, model, layer, head, paramCount);
    
    					// Add random classifications
    					if (Math.random() > 0.3) {
    						const classType = classificationTypes[Math.floor(Math.random() * classificationTypes.length)];
    						headInfo.classifications.push({
    							name: classType,
    							type: classType,
    							source: Math.random() > 0.5 ? 'IOI' : 'SAE-survey'
    						});
    
    						// Add to classification map
    						if (!this.classifications.has(classType)) {
    							this.classifications.set(classType, []);
    						}
    						this.classifications.get(classType).push(headInfo);
    					}
    
    					// Add mock citations
    					if (Math.random() > 0.7) {
    						headInfo.citations.push({
    							title: 'IOI: indirect object identification',
    							authors: 'Wang et al. 2022',
    							url: 'https://arxiv.org/pdf/2211.00593',
    							description: `Model: ${model}`
    						});
    					}
    
    					this.heads.set(id, headInfo);
    				}
    			}
    		});
    	}
    
    	getHead(id) {
    		return this.heads.get(id);
    	}
    
    	getHeadsByClassification(classification) {
    		return this.classifications.get(classification) || [];
    	}
    
    	getNearestHeads(headId, n = 5) {
    		const targetHead = this.heads.get(headId);
    		if (!targetHead) return [];
    
    		const distances = [];
    		this.heads.forEach((head, id) => {
    			if (id !== headId && head.model === targetHead.model) {
    				distances.push({
    					head: head,
    					distance: targetHead.distanceTo(head)
    				});
    			}
    		});
    
    		return distances
    			.sort((a, b) => a.distance - b.distance)
    			.slice(0, n)
    			.map(item => ({ ...item.head, distance: item.distance }));
    	}
    }
    </script>
    <!-- end 'AttentionPedia.js' --> -->

        <!-- begin 'app.js' -->
    <script>
    document.addEventListener('alpine:init', () => {
    	Alpine.data('attentionApp', () => ({
    		loading: true,
    		error: null,
    		prompts: [],
    		heads: [],
    
    		async init() {
    			try {
    				// Simulate loading delay
    				await new Promise(resolve => setTimeout(resolve, 500));
    
    				// In a real app, you'd do: const config = await this.loadJson('config.json');
    				const config = mockConfig;
    
    				this.prompts = config.prompts;
    				this.heads = config.heads;
    			} catch (err) {
    				this.error = `Failed to load config: ${err.message}`;
    			} finally {
    				this.loading = false;
    			}
    		},
    
    		async loadJson(filename) {
    			const response = await fetch(filename);
    			if (!response.ok) {
    				throw new Error(`Failed to fetch ${filename}: ${response.status}`);
    			}
    			return await response.json();
    		},
    
    		getPatternSize() {
    			return Math.floor(Math.random() * 8) + 8;
    		},
    
    		viewPattern(headId, promptHash) {
    			alert(`Viewing pattern for ${headId} on prompt ${promptHash}`);
    		}
    	}));
    });
    </script>
    <!-- end 'app.js' -->
</head>

<body>
    <div class="container" x-data="attentionApp" x-init="await init()">
        <template x-if="loading">
            <div class="loading">Loading...</div>
        </template>
        
        <template x-if="error">
            <div class="error" x-text="error"></div>
        </template>

        <template x-if="!loading && !error">
            <div class="section">
                <table class="pattern-table">
                    <thead>
                        <tr>
                            <th>Head</th>
                            <template x-for="prompt in prompts" :key="prompt.hash">
                                <th x-text="prompt.text"></th>
                            </template>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="headId in heads" :key="headId">
                            <tr>
                                <td class="head-info" x-text="headId"></td>
                                <template x-for="prompt in prompts" :key="prompt.hash">
                                    <td>
                                        <div class="pattern-placeholder" 
                                             @click="viewPattern(headId, prompt.hash)">
                                        </div>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
    </div>
</body>
