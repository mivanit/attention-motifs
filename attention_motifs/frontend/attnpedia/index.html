<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Head Analysis</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <!-- begin 'style.css' -->
    <style>
    body {
    	font-family: -apple-system, sans-serif;
    	margin: 20px;
    	background: #f8f9fa;
    }
    
    .container {
    	max-width: 1200px;
    	margin: 0 auto;
    }
    
    .section {
    	background: white;
    	padding: 20px;
    }
    
    .pattern-table {
    	width: 100%;
    	border-collapse: collapse;
    }
    
    .pattern-table th,
    .pattern-table td {
    	padding: 12px;
    	border: 1px solid #ddd;
    }
    
    .pattern-table th {
    	background: #f8f9fa;
    	text-align: left;
    }
    
    .head-info {
    	font-family: monospace;
    }
    
    .pattern-placeholder {
    	width: 60px;
    	height: 60px;
    	background: #ecf0f1;
    	border: 1px solid #ddd;
    	margin: 0 auto;
    }
    </style>
    <!-- end 'style.css' -->
        <!-- begin 'headInfo.js' -->
    <script>
    const BASE_PATH = "../../../../docs/demo"
    
    class HeadInfo {
        constructor(id, model, layer, head) {
            this.id = id;
            this.model = model;
            this.layer = layer;
            this.head = head;
            this.classifications = [];
        }
        static from_id(id) {
            // split by ":", should have 3 components
            // `{model}:L{layer}:H{head}`
            const parts = id.split(':');
            if (parts.length !== 3) {
                throw new Error(`Invalid id format: ${id}. Expected format: {model}:L{layer}:H{head}`);
            }
            const [model, layerPart, headPart] = parts;
            if (!layerPart.startsWith('L')) {
                throw new Error(`Invalid layer format: ${layerPart}. Expected format: L{number}`);
            }
            if (!headPart.startsWith('H')) {
                throw new Error(`Invalid head format: ${headPart}. Expected format: H{number}`);
            }
            const layer = parseInt(layerPart.slice(1), 10);
            const head = parseInt(headPart.slice(1), 10);
            if (isNaN(layer) || isNaN(head)) {
                throw new Error(`Invalid numeric values in id: ${id}`);
            }
            return new HeadInfo(id, model, layer, head);
        }
        async get_pattern_url(promptHash) {
            return `${BASE_PATH}/${this.model}/prompts/${promptHash}/L${this.layer}/H${this.head}/raw.png`;
        }
    }
    </script>
    <!-- end 'headInfo.js' -->
        <!-- begin 'config.js' -->
    <script>
    // Mock config data (in a real app, this would be loaded from config.json)
    const mockConfig = {
    	"prompts": [
    		{
    			"hash": "prompt_001",
    			"text": "The cat sat on the mat"
    		},
    		{
    			"hash": "prompt_002",
    			"text": "When John and Mary went to the store"
    		},
    		{
    			"hash": "prompt_003",
    			"text": "The quick brown fox jumps over"
    		},
    		{
    			"hash": "prompt_004",
    			"text": "In the beginning was the word"
    		}
    	],
    	"heads_display": [
    		"gpt2-small:L5:H5",
    		"gpt2-small:L3:H8",
    		"gpt2-small:L7:H2",
    		"gpt2-medium:L4:H6",
    		"gpt2-medium:L8:H1"
    	]
    };
    </script>
    <!-- end 'config.js' -->
        <!-- begin 'app.js' -->
    <script>
    document.addEventListener('alpine:init', () => {
    	Alpine.data('attentionApp', () => ({
    		loading: true,
    		error: null,
    		prompts: [],
    		heads_display: [],
    
    		async init() {
    			const config = mockConfig;
    			this.prompts = config.prompts;
    			this.heads_display = config.heads_display;
    		},
    	}));
    });
    </script>
    <!-- end 'app.js' -->
</head>

<body>
    <div class="container" x-data="attentionApp" x-init="await init()">
        <div class="section">
            <table class="pattern-table">
                <thead>
                    <tr>
                        <th>Head</th>
                        <template x-for="prompt in prompts" :key="prompt.hash">
                            <th x-text="prompt.text"></th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="headId in heads_display" :key="headId">
                        <tr>
                            <td class="head-info" x-text="headId"></td>
                            <template x-for="prompt in prompts" :key="prompt.hash">
                                <td>
                                    <div x-data="patternComponent(headId, prompt.hash)" x-init="await init()">
                                        <div x-show="loading" class="pattern-loading">...</div>
                                        <img x-show="!loading && imageUrl" 
                                             :src="imageUrl" 
                                             class="pattern-image" 
                                             :alt="`Pattern for ${headId} on ${prompt.text}`">
                                        <div x-show="!loading && error" 
                                             class="pattern-error" 
                                             :title="error">
                                            Error
                                        </div>
                                    </div>
                                </td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
