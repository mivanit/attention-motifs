<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Head Analysis</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <!-- begin 'style.css' -->
    <style>
    body {
    	font-family: -apple-system, sans-serif;
    	margin: 20px;
    	background: #f8f9fa;
    }
    
    .container {
    	max-width: 1200px;
    	margin: 0 auto;
    }
    
    .section {
    	background: white;
    	padding: 20px;
    }
    
    .pattern-table {
    	width: 100%;
    	border-collapse: collapse;
    }
    
    .pattern-table th,
    .pattern-table td {
    	padding: 12px;
    	border: 1px solid #ddd;
    }
    
    .pattern-table th {
    	background: #f8f9fa;
    	text-align: left;
    }
    
    .head-info {
    	font-family: monospace;
    }
    
    .pattern-image {
    	width: 60px;
    	height: 60px;
    	object-fit: cover;
    	border: 1px solid #ddd;
    }
    
    .pattern-error {
    	width: 60px;
    	height: 60px;
    	background: #ffebee;
    	border: 1px solid #f44336;
    	display: flex;
    	align-items: center;
    	justify-content: center;
    	font-size: 12px;
    	color: #c62828;
    	text-align: center;
    }
    
    .pattern-loading {
    	width: 60px;
    	height: 60px;
    	background: #f0f0f0;
    	border: 1px solid #ddd;
    	display: flex;
    	align-items: center;
    	justify-content: center;
    	font-size: 12px;
    	color: #666;
    }
    </style>
    <!-- end 'style.css' -->
        <!-- begin 'headInfo.js' -->
    <script>
    const BASE_PATH = "../../../../docs/demo";
    
    class HeadInfo {
        constructor(id, model, layer, head) {
            this.id = id;
            this.model = model;
            this.layer = layer;
            this.head = head;
            this.classifications = [];
        }
    
        static from_id(id) {
            // split by ":", should have 3 components
            // `{model}:L{layer}:H{head}`
            const parts = id.split(':');
            if (parts.length !== 3) {
                throw new Error(`Invalid id format: ${id}. Expected format: {model}:L{layer}:H{head}`);
            }
            const [model, layerPart, headPart] = parts;
            if (!layerPart.startsWith('L')) {
                throw new Error(`Invalid layer format: ${layerPart}. Expected format: L{number}`);
            }
            if (!headPart.startsWith('H')) {
                throw new Error(`Invalid head format: ${headPart}. Expected format: H{number}`);
            }
            const layer = parseInt(layerPart.slice(1), 10);
            const head = parseInt(headPart.slice(1), 10);
            if (isNaN(layer) || isNaN(head)) {
                throw new Error(`Invalid numeric values in id: ${id}`);
            }
            return new HeadInfo(id, model, layer, head);
        }
    
        async get_pattern_url(promptHash) {
            return `${BASE_PATH}/${this.model}/prompts/${promptHash}/L${this.layer}/H${this.head}/raw.png`;
        }
    }
    </script>
    <!-- end 'headInfo.js' -->
        <!-- begin 'config.js' -->
    <script>
    // Mock config data (in a real app, this would be loaded from config.json)
    const mockConfig = {
    	"prompts": [
    		"4cI1GEw6ALlDIgyrDHqSNw",
    		"7ACbiDg7tQ7q3vA1mz2I_g",
    		"9Hg1qyV1vUCZPQxUjnXqvQ",
    		"154QVY-xqZlyiFm1FvmMhg",
    	],
    	"heads_display": [
    		"gpt2-small:L5:H5",
    		"gpt2-small:L3:H8",
    		"gpt2-small:L7:H2",
    		"pythia-14m:L0:H3",
    		"pythia-14m:L2:H1"
    	]
    };
    </script>
    <!-- end 'config.js' -->
        <!-- begin 'app.js' -->
    <script>
    document.addEventListener('alpine:init', () => {
    	Alpine.data('attentionApp', () => ({
    		loading: true,
    		error: null,
    		prompts: [],
    		heads_display: [],
    
    		async init() {
    			const config = mockConfig;
    			this.prompts = config.prompts;
    			this.heads_display = config.heads_display;
    			this.loading = false;
    		},
    
    		patternComponent(headId, promptHash) {
    			return {
    				loading: true,
    				imageUrl: null,
    				error: null,
    
    				async init() {
    					try {
    						const headInfo = HeadInfo.from_id(headId);
    						this.imageUrl = await headInfo.get_pattern_url(promptHash);
    						this.loading = false;
    					} catch (error) {
    						console.error(`Failed to get pattern URL for ${headId}:${promptHash}:`, error);
    						this.error = error.message;
    						this.loading = false;
    					}
    				}
    			};
    		}
    	}));
    });
    </script>
    <!-- end 'app.js' -->
</head>

<body>
    <div class="container" x-data="attentionApp" x-init="await init()">
        <div class="section">
            <table class="pattern-table">
                <thead>
                    <tr>
                        <th>Head</th>
                        <template x-for="prompt in prompts" :key="prompt">
                            <th x-text="prompt"></th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="headId in heads_display" :key="headId">
                        <tr>
                            <td class="head-info" x-text="headId"></td>
                            <template x-for="prompt in prompts" :key="prompt">
                                <td>
                                    <div x-data="patternComponent(headId, prompt)">
                                        <img x-show="imageUrl" :src="imageUrl" class="pattern-image" :alt="`Pattern for ${headId} on ${prompt}`">
                                    </div>
                                </td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
