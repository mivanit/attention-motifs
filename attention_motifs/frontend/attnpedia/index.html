<!DOCTYPE html>
<html lang="en">

<head>

    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <!-- begin 'style.css' -->
    <style>
    body {

    .model-head.neighbor {

    .link-button {

    	width: 100%;

    	margin-bottom: 8px;

    .tag {

    }
    
    .tag.induction {
    	background: #377EB8;
    	color: white;
    }
    
    .tag.duplicate {
    	background: #4DAF4A;
    	color: white;
    }
    
    .tag.previous {
    	background: #984EA3;
    	color: white;
    }
    
    .tag.name-mover {
    	background: #FF7F00;
    	color: white;
    }
    
    .tag.subject {
    	background: #FFFF33;
    	color: black;
    }
    
    .tag.copy {
    	background: #A65628;
    	color: white;
    }
    
    .citation {
    	background: #f8f9fa;
    	padding: 10px;
    	border-left: 4px solid #3498db;
    	margin: 10px 0;
    	font-size: 0.9em;
    }
    
    .pattern-table {
    	width: 100%;
    	border-collapse: collapse;
    	margin-top: 15px;
    }
    
    .pattern-table th,
    .pattern-table td {
    	padding: 10px;
    	border: 1px solid #ddd;
    	text-align: left;
    }
    
    .pattern-table th {
    	background: #f8f9fa;
    	font-weight: 500;
    }
    
    .pattern-table tbody tr:nth-child(odd) {
    	background: #f9f9f9;
    }
    
    .section-header {
    	padding: 12px;
    	background: #34495e;
    	color: white;
    	font-weight: bold;
    	margin: 0;
    }
    
    .current-head-header {
    	background: #2c3e50;
    }
    
    .mini-pattern {
    	width: 60px;
    	height: 60px;
    	background: #ecf0f1;
    	border: 1px solid #ddd;
    	border-radius: 4px;
    	display: flex;
    	align-items: center;
    	justify-content: center;
    	font-size: 0.8em;
    	color: #7f8c8d;
    	cursor: pointer;
    	transition: all 0.2s;
    }
    
    .mini-pattern:hover {
    	background: #d5dbdb;

    .neighbor-info {
    	display: flex;
    	flex-direction: column;
    	gap: 4px;
    }
    
    .neighbor-name {
    	font-weight: 500;
    }
    
    .neighbor-distance {
    	font-size: 0.8em;
    	color: #7f8c8d;
    }
    
    .neighbor-link {
    	color: #3498db;
    	text-decoration: none;
    	font-size: 0.9em;
    }
    
    .neighbor-link:hover {
    	text-decoration: underline;
    }
    
    .loading {
    	display: flex;
    	align-items: center;
    	justify-content: center;
    	padding: 40px;
    	color: #7f8c8d;
    }
    
    .error {
    	color: #e74c3c;
    	padding: 20px;
    	background: #fdf2f2;
    	border-radius: 4px;
    	border: 1px solid #f5c6cb;
    }
    
    .controls {
    	display: flex;
    	gap: 10px;
    	margin-bottom: 15px;
    }
    
    .button {
    	padding: 8px 16px;
    	background: #3498db;
    	color: white;
    	border: none;
    	border-radius: 4px;
    	cursor: pointer;
    	font-size: 0.9em;
    }
    
    .button.secondary {
    	background: #95a5a6;
    }
    
    .button:hover {
    	opacity: 0.9;
    }
    
    .button:disabled {
    	background: #bdc3c7;
    	cursor: not-allowed;
    }
    </style>
    <!-- end 'style.css' -->
        <!-- begin 'headInfo.js' -->
    <script>
    class HeadInfo {
        constructor(id, model, layer, head) {
            this.id = id;
            this.model = model;
            this.layer = layer;
            this.head = head;
            this.classifications = [];
        }
        static from_id(id) {
            // split by ":", should have 3 components
            // `{model}:L{layer}:H{head}`
            const parts = id.split(':');
            if (parts.length !== 3) {
                throw new Error(`Invalid id format: ${id}. Expected format: {model}:L{layer}:H{head}`);
            }
            const [model, layerPart, headPart] = parts;
            if (!layerPart.startsWith('L')) {
                throw new Error(`Invalid layer format: ${layerPart}. Expected format: L{number}`);
            }
            if (!headPart.startsWith('H')) {
                throw new Error(`Invalid head format: ${headPart}. Expected format: H{number}`);
            }
            const layer = parseInt(layerPart.slice(1), 10);
            const head = parseInt(headPart.slice(1), 10);
            if (isNaN(layer) || isNaN(head)) {
                throw new Error(`Invalid numeric values in id: ${id}`);
            }
            return new HeadInfo(id, model, layer, head);
        }
        async getPatterns(promptHash) {
            // Mock pattern data
            await new Promise(resolve => setTimeout(resolve, 100));
            const size = Math.floor(Math.random() * 8) + 8;
            return {
                size: size,
                data: Array(size * size).fill(0).map(() => Math.random())
            };
        }
        distanceTo(otherHead, metric = 'L2') {
            // Mock distance calculation
            const hash1 = this.id.split('').reduce((a, b) => a + b.charCodeAt(0), 0);
            const hash2 = otherHead.id.split('').reduce((a, b) => a + b.charCodeAt(0), 0);
            return Math.abs(hash1 - hash2) / 10000;
        }
    }
    </script>
    <!-- end 'headInfo.js' -->
        <!-- begin 'AttentionPedia.js' -->
    <script>
    class AttentionPedia {
    	constructor() {
    		this.heads = new Map();
    		this.classifications = new Map();
    		this._initializeMockData();
    	}
    
    	_initializeMockData() {
    		const models = ['gpt2-small', 'gpt2-medium', 'gpt2-large'];
    		const classificationTypes = ['induction', 'duplicate', 'previous', 'name-mover', 'subject', 'copy'];
    		const layers = 12;
    		const headsPerLayer = 12;
    
    		// Generate mock heads
    		models.forEach(model => {
    			const paramCount = model === 'gpt2-small' ? 124 : model === 'gpt2-medium' ? 355 : 774;
    
    			for (let layer = 0; layer < layers; layer++) {
    				for (let head = 0; head < headsPerLayer; head++) {
    					const id = `${model}:L${layer}:H${head}`;
    					const headInfo = new HeadInfo(id, model, layer, head, paramCount);
    
    					// Add random classifications
    					if (Math.random() > 0.3) {
    						const classType = classificationTypes[Math.floor(Math.random() * classificationTypes.length)];
    						headInfo.classifications.push({
    							name: classType,
    							type: classType,
    							source: Math.random() > 0.5 ? 'IOI' : 'SAE-survey'
    						});
    
    						// Add to classification map
    						if (!this.classifications.has(classType)) {
    							this.classifications.set(classType, []);
    						}
    						this.classifications.get(classType).push(headInfo);
    					}
    
    					// Add mock citations
    					if (Math.random() > 0.7) {
    						headInfo.citations.push({
    							title: 'IOI: indirect object identification',
    							authors: 'Wang et al. 2022',
    							url: 'https://arxiv.org/pdf/2211.00593',
    							description: `Model: ${model}`
    						});
    					}
    
    					this.heads.set(id, headInfo);
    				}
    			}
    		});
    	}
    
    	getHead(id) {
    		return this.heads.get(id);
    	}
    
    	getHeadsByClassification(classification) {
    		return this.classifications.get(classification) || [];
    	}
    
    	getNearestHeads(headId, n = 5) {
    		const targetHead = this.heads.get(headId);
    		if (!targetHead) return [];
    
    		const distances = [];
    		this.heads.forEach((head, id) => {
    			if (id !== headId && head.model === targetHead.model) {
    				distances.push({
    					head: head,
    					distance: targetHead.distanceTo(head)
    				});
    			}
    		});
    
    		return distances
    			.sort((a, b) => a.distance - b.distance)
    			.slice(0, n)
    			.map(item => ({ ...item.head, distance: item.distance }));
    	}
    }
    </script>
    <!-- end 'AttentionPedia.js' -->
</head>

<body>
    <div class="container" x-data="attentionHeadApp" x-init="await initialize()">
        <!-- Header -->
        <div class="section header">
            <template x-if="!loading && currentHead">
                <div>
                    <h1 x-text="currentHead.id"></h1>
                    <div class="head-subtitle" x-text="`Layer ${currentHead.layer}, Head ${currentHead.head} • ${currentHead.model} (${currentHead.paramCount}M parameters)`">
                    </div>
                </div>
            </template>
            <template x-if="loading">
                <div class="loading">Loading attention head data...</div>
            </template>
            <template x-if="error">
                <div class="error" x-text="error"></div>
            </template>
        </div>
        <template x-if="!loading && !error && currentHead">
            <div>
                <!-- Main Grid: Model Position + Tool Links -->
                <div class="main-grid">
                    <div class="section">
                        <h3>Position in Model</h3>
                        <div style="margin-bottom: 10px; font-size: 0.9em; color: #7f8c8d;">
                            <span x-text="`Layer ${currentHead.layer}, Head ${currentHead.head} of ${modelInfo.layers}×${modelInfo.headsPerLayer} grid:`"></span>
                        </div>
                        <div class="model-grid">
                            <template x-for="(head, idx) in allModelHeads" :key="idx">
                                <div class="model-head" :class="{
                                         'current': head.isCurrent,
                                         'same-class': head.isSameClass,
                                         'neighbor': head.isNeighbor
                                     }" :title="`L${head.layer}:H${head.head} ${head.classification || ''}`" @click="navigateToHead(head.id)">
                                </div>
                            </template>
                        </div>
                        <div style="margin-top: 10px; font-size: 0.8em; color: #7f8c8d;">
                            <div>🔴 Current head</div>
                            <div>🟠 Same classification</div>
                            <div>🔵 Nearest neighbors</div>
                        </div>
                    </div>
                    <div class="section">
                        <h3>Analysis Tools</h3>
                        <button class="link-button" @click="openPatternLens('single')"> View in Pattern Lens </button>
                        <button class="link-button" @click="openEmbeddingSpace()"> View in Embedding Space </button>
                        <button class="link-button secondary" @click="downloadPatterns()"> Download Raw Patterns </button>
                        <button class="link-button secondary" @click="exportAnalysis()"> Export Analysis </button>
                    </div>
                </div>
                <!-- AttentionPedia Information -->
                <div class="section">
                    <h2>AttentionPedia Classifications</h2>
                    <div style="margin-bottom: 15px;">
                        <template x-for="classification in currentHead.classifications" :key="classification.name">
                            <span class="tag" :class="classification.type" x-text="`${classification.source}: ${classification.name}`">
                            </span>
                        </template>
                    </div>
                    <template x-for="citation in currentHead.citations" :key="citation.title">
                        <div class="citation">
                            <strong x-text="citation.title"></strong><br>
                            <span x-text="citation.authors"></span> - <a :href="citation.url" x-text="citation.url" target="_blank"></a><br>
                            <em x-text="citation.description"></em>
                        </div>
                    </template>
                </div>
                <!-- Attention Patterns -->
                <div class="section">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h2>Attention Patterns</h2>
                        <div class="controls">
                            <button class="button secondary" @click="randomizePrompts()"> Randomize Prompts </button>
                            <button class="button" @click="configurePrompts()"> Configure Prompts </button>
                        </div>
                    </div>
                    <table class="pattern-table">
                        <!-- Header row with prompts -->
                        <thead>
                            <tr>
                                <th style="width: 200px;">Head</th>
                                <template x-for="(prompt, idx) in currentPrompts" :key="idx">
                                    <th style="font-size: 0.9em;" x-text="`Prompt ${idx + 1}: \" ${prompt.text.substring(0, 30)}...\"`"></th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Current head section -->
                            <tr>
                                <td colspan="5" class="section-header current-head-header"> Current Head (<span x-text="currentHead.id"></span>) </td>
                            </tr>
                            <tr>
                                <td style="vertical-align: top;">
                                    <div class="neighbor-info">
                                        <div class="neighbor-name" x-text="currentHead.id"></div>
                                        <div class="neighbor-distance" x-text="currentHead.classifications[0]?.name || 'Unclassified'"></div>
                                        <a href="#" class="neighbor-link">View Details →</a>
                                    </div>
                                </td>
                                <template x-for="(prompt, idx) in currentPrompts" :key="idx">
                                    <td>
                                        <div class="mini-pattern" @click="viewPattern(currentHead.id, prompt.hash)" x-text="`${prompt.patternSize}×${prompt.patternSize}`">
                                        </div>
                                    </td>
                                </template>
                            </tr>
                            <!-- Nearest neighbors section -->
                            <tr>
                                <td colspan="5" class="section-header"> Nearest Neighbors in Embedding Space <a href="#" style="color: #ecf0f1; text-decoration: none; float: right;" @click="openEmbeddingSpace()"> View Embedding Space → </a>
                                </td>
                            </tr>
                            <template x-for="neighbor in nearestNeighbors" :key="neighbor.id">
                                <tr>
                                    <td style="vertical-align: top;">
                                        <div class="neighbor-info">
                                            <div class="neighbor-name" x-text="neighbor.id"></div>
                                            <div class="neighbor-distance" x-text="`Distance: ${neighbor.distance.toFixed(2)}`"></div>
                                            <a href="#" class="neighbor-link" @click="navigateToHead(neighbor.id)">View →</a>
                                        </div>
                                    </td>
                                    <template x-for="(prompt, idx) in currentPrompts" :key="idx">
                                        <td>
                                            <div class="mini-pattern" @click="viewPattern(neighbor.id, prompt.hash)" x-text="`${prompt.patternSize}×${prompt.patternSize}`">
                                            </div>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                            <!-- Same classification section -->
                            <template x-if="sameClassHeads.length > 0">
                                <template>
                                    <tr>
                                        <td colspan="5" class="section-header">
                                            <span x-text="`Other ${currentHead.classifications[0]?.name || 'Similar'} Heads`"></span>
                                            <a href="#" style="color: #ecf0f1; text-decoration: none; float: right;" @click="openPatternLens('classification')">
                                                <span x-text="`View All ${currentHead.classifications[0]?.name || 'Similar'} Heads →`"></span>
                                            </a>
                                        </td>
                                    </tr>
                                    <template x-for="head in sameClassHeads" :key="head.id">
                                        <tr>
                                            <td style="vertical-align: top;">
                                                <div class="neighbor-info">
                                                    <div class="neighbor-name" x-text="head.id"></div>
                                                    <div class="neighbor-distance" x-text="head.classifications[0]?.name || 'Unclassified'"></div>
                                                    <a href="#" class="neighbor-link" @click="navigateToHead(head.id)">View →</a>
                                                </div>
                                            </td>
                                            <template x-for="(prompt, idx) in currentPrompts" :key="idx">
                                                <td>
                                                    <div class="mini-pattern" @click="viewPattern(head.id, prompt.hash)" x-text="`${prompt.patternSize}×${prompt.patternSize}`">
                                                    </div>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                    <tr>
                                        <td style="vertical-align: top;">
                                            <div class="neighbor-info">
                                                <div class="neighbor-name">Average</div>
                                                <div class="neighbor-distance" x-text="`All ${currentHead.classifications[0]?.name || 'similar'} heads`"></div>
                                                <a href="#" class="neighbor-link" @click="compareClassification()">Compare →</a>
                                            </div>
                                        </td>
                                        <template x-for="(prompt, idx) in currentPrompts" :key="idx">
                                            <td>
                                                <div class="mini-pattern" @click="viewAveragePattern(currentHead.classifications[0]?.name, prompt.hash)" x-text="`${prompt.patternSize}×${prompt.patternSize} Avg`">
                                                </div>
                                            </td>
                                        </template>
                                    </tr>
                                </template>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </template>
    </div>
    <script>
        // Alpine.js component registration
        document.addEventListener('alpine:init', () => {
            Alpine.data('attentionHeadApp', () => ({
                // State
                loading: true,
                error: null,
                currentHead: null,
                nearestNeighbors: [],
                sameClassHeads: [],
                allModelHeads: [],
                modelInfo: { layers: 12, headsPerLayer: 12 },
                currentPrompts: [],

                // Data instances
                attentionPedia: new AttentionPedia(),

                // Initialization
                async initialize() {
                    try {
                        await this.loadFromURL();
                        this.generatePrompts();
                    } catch (err) {
                        this.error = err.message;
                    } finally {
                        this.loading = false;
                    }
                },

                async loadFromURL() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const headId = urlParams.get('head') || 'gpt2-small:L5:H5';

                    if (!this.validateHeadId(headId)) {
                        throw new Error(`Invalid head ID format: ${headId}`);
                    }

                    this.currentHead = this.attentionPedia.getHead(headId);
                    if (!this.currentHead) {
                        throw new Error(`Head not found: ${headId}`);
                    }

                    // Load related data
                    this.nearestNeighbors = this.attentionPedia.getNearestHeads(headId, 3);

                    if (this.currentHead.classifications.length > 0) {
                        const classification = this.currentHead.classifications[0].name;
                        this.sameClassHeads = this.attentionPedia.getHeadsByClassification(classification)
                            .filter(head => head.id !== headId)
                            .slice(0, 3);
                    }

                    this.generateModelGrid();
                },

                validateHeadId(id) {
                    return /^[^:]+:L\d+:H\d+$/.test(id);
                },

                generateModelGrid() {
                    this.allModelHeads = [];
                    const currentClassification = this.currentHead.classifications[0]?.name;
                    const neighborIds = new Set(this.nearestNeighbors.map(n => n.id));

                    for (let layer = 0; layer < this.modelInfo.layers; layer++) {
                        for (let head = 0; head < this.modelInfo.headsPerLayer; head++) {
                            const id = `${this.currentHead.model}:L${layer}:H${head}`;
                            const headInfo = this.attentionPedia.getHead(id);

                            this.allModelHeads.push({
                                id,
                                layer,
                                head,
                                isCurrent: id === this.currentHead.id,
                                isSameClass: headInfo?.classifications.some(c => c.name === currentClassification) || false,
                                isNeighbor: neighborIds.has(id),
                                classification: headInfo?.classifications[0]?.name
                            });
                        }
                    }
                },

                generatePrompts() {
                    const prompts = [
                        "The cat sat on the mat",
                        "When John and Mary went to the store",
                        "The quick brown fox jumps over",
                        "In the beginning was the word"
                    ];

                    this.currentPrompts = prompts.map((text, idx) => ({
                        text,
                        hash: `prompt_${idx}_${Date.now()}`,
                        patternSize: Math.floor(Math.random() * 8) + 8
                    }));
                },

                // Navigation
                async navigateToHead(headId) {
                    const url = new URL(window.location);
                    url.searchParams.set('head', headId);
                    window.history.pushState({}, '', url);

                    this.loading = true;
                    this.error = null;

                    try {
                        await this.loadFromURL();
                    } catch (err) {
                        this.error = err.message;
                    } finally {
                        this.loading = false;
                    }
                },

                // Actions
                openPatternLens(mode) {
                    let headIds = [this.currentHead.id];

                    if (mode === 'neighbors') {
                        headIds = headIds.concat(this.nearestNeighbors.map(n => n.id));
                    } else if (mode === 'classification') {
                        headIds = headIds.concat(this.sameClassHeads.map(h => h.id));
                    }

                    const url = `/pattern-lens?heads=${headIds.join(',')}`;
                    window.open(url, '_blank');
                },

                openEmbeddingSpace() {
                    const url = `/embedding-space?highlight=${this.currentHead.id}`;
                    window.open(url, '_blank');
                },

                async viewPattern(headId, promptHash) {
                    const head = this.attentionPedia.getHead(headId);
                    if (head) {
                        const pattern = await head.getPatterns(promptHash);
                        alert(`Viewing ${pattern.size}×${pattern.size} pattern for ${headId}`);
                    }
                },

                viewAveragePattern(classification, promptHash) {
                    alert(`Viewing average pattern for ${classification} heads`);
                },

                randomizePrompts() {
                    const newPrompts = [
                        "The weather today is quite",
                        "Alice and Bob decided to",
                        "Machine learning models can",
                        "Once upon a time there"
                    ];

                    this.currentPrompts = newPrompts.map((text, idx) => ({
                        text,
                        hash: `prompt_${idx}_${Date.now()}`,
                        patternSize: Math.floor(Math.random() * 8) + 8
                    }));
                },

                configurePrompts() {
                    alert('Prompt configuration dialog would open here');
                },

                downloadPatterns() {
                    alert('Downloading patterns for ' + this.currentHead.id);
                },

                exportAnalysis() {
                    const analysis = {
                        head: this.currentHead,
                        neighbors: this.nearestNeighbors,
                        sameClass: this.sameClassHeads,
                        timestamp: new Date().toISOString()
                    };

                    const blob = new Blob([JSON.stringify(analysis, null, 2)],
                        { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${this.currentHead.id}_analysis.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                },

                compareClassification() {
                    const classification = this.currentHead.classifications[0]?.name;
                    alert(`Comparing all ${classification} heads`);
                }
            }));
        });
    </script>
</body>

</html>
