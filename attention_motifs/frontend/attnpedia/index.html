<!DOCTYPE html>
<html lang="en">
<!-- note to AI assistants: if you are asked to modify this, give modifications for the scripts, css, html header, and html body all separately. the joined file you see is bundled from those multiple source files -->
<!-- header -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Head Analysis</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <!-- begin 'style.css' -->
    <style>
    body {
    	font-family: -apple-system, sans-serif;
    	margin: 20px;
    	background: #f8f9fa;
    }
    
    .container {
    	max-width: 1400px;
    	margin: 0 auto;
    }
    
    .section {
    	background: white;
    	padding: 20px;
    }
    
    .pattern-table {
    	width: 100%;
    	border-collapse: collapse;
    }
    
    .pattern-table th,
    .pattern-table td {
    	padding: 12px;
    	border: 1px solid #ddd;
    	vertical-align: top;
    }
    
    .pattern-table th {
    	background: #f8f9fa;
    	text-align: left;
    }
    
    .head-info {
    	font-family: monospace;
    }
    
    .pattern-image {
    	width: 60px;
    	height: 60px;
    	object-fit: cover;
    	border: 1px solid #ddd;
    }
    
    .pattern-error {
    	width: 60px;
    	height: 60px;
    	background: #ffebee;
    	border: 1px solid #f44336;
    	display: flex;
    	align-items: center;
    	justify-content: center;
    	font-size: 12px;
    	color: #c62828;
    	text-align: center;
    }
    
    .pattern-loading {
    	width: 60px;
    	height: 60px;
    	background: #f0f0f0;
    	border: 1px solid #ddd;
    	display: flex;
    	align-items: center;
    	justify-content: center;
    	font-size: 12px;
    	color: #666;
    }
    
    .classifications-cell {
    	min-width: 150px;
    	font-size: 12px;
    	line-height: 1.6;
    }
    
    .classification-tag {
    	display: inline-block;
    	background: #e3f2fd;
    	color: #1565c0;
    	padding: 3px 8px;
    	margin: 2px;
    	border-radius: 4px;
    	font-size: 11px;
    	cursor: help;
    	border: 1px solid #bbdefb;
    	position: relative;
    }
    
    .classification-tag:hover {
    	background: #bbdefb;
    }
    
    .classifications-container {
    	display: flex;
    	flex-direction: column;
    	gap: 4px;
    }
    
    .classification-line {
    	display: block;
    	margin-bottom: 2px;
    }
    
    .classifications-loading {
    	color: #666;
    	font-style: italic;
    	font-size: 11px;
    }
    
    .classifications-error {
    	color: #c62828;
    	font-size: 11px;
    }
    
    .tooltip {
    	position: absolute;
    	background: #333;
    	color: white;
    	padding: 8px 12px;
    	border-radius: 4px;
    	font-size: 12px;
    	max-width: 300px;
    	z-index: 1000;
    	pointer-events: none;
    	opacity: 0;
    	transition: opacity 0.2s;
    	line-height: 1.4;
    	white-space: nowrap;
    }
    
    .tooltip.show {
    	opacity: 1;
    }
    
    .tooltip::after {
    	content: '';
    	position: absolute;
    	top: 100%;
    	left: 50%;
    	margin-left: -5px;
    	border-width: 5px;
    	border-style: solid;
    	border-color: #333 transparent transparent transparent;
    }
    </style>
    <!-- end 'style.css' -->
        <!-- begin 'AttentionPedia.js' -->
    <script>
    const ATTNPEDIA_URL = "ap.json";
    
    async function load_attnpedia(path = ATTNPEDIA_URL) {
    	const r = await fetch(path);
    	if (r.ok) {
    		const loaded = await r.json();
    		return loaded;
    	} else {
    		throw new Error(`Failed to load AttentionPedia data from ${path}`);
    	}
    }
    
    class AttentionPedia {
    	constructor() {
    		this._data = null;
    		this._loaded = false;
    	}
    
    	async _ensureLoaded() {
    		if (!this._loaded) {
    			this._data = await load_attnpedia();
    			this._loaded = true;
    		}
    	}
    
    	async get_head_types(head_id) {
    		await this._ensureLoaded();
    		if (this._data && head_id in this._data.head_to_types) {
    			return this._data.head_to_types[head_id];
    		}
    		else {
    			return [];
    		}
    	}
    
    	async get_type_heads(type) {
    		await this._ensureLoaded();
    		if (this._data && type in this._data.type_to_heads) {
    			return this._data.type_to_heads[type];
    		}
    		else {
    			return [];
    		}
    	}
    
    	async get_type_meta(type) {
    		await this._ensureLoaded();
    		if (this._data && type in this._data.type_metadata) {
    			return this._data.type_metadata[type];
    		}
    		else {
    			return {};
    		}
    	}
    
    	async getNearestHeads(headId, n = 5) {
    		await this._ensureLoaded();
    		const targetHead = this.heads.get(headId);
    		if (!targetHead) return [];
    
    		const distances = [];
    		this.heads.forEach((head, id) => {
    			if (id !== headId && head.model === targetHead.model) {
    				distances.push({
    					head: head,
    					distance: targetHead.distanceTo(head)
    				});
    			}
    		});
    
    		return distances
    			.sort((a, b) => a.distance - b.distance)
    			.slice(0, n)
    			.map(item => ({ ...item.head, distance: item.distance }));
    	}
    }
    
    let ATTENTION_PEDIA = new AttentionPedia();
    </script>
    <!-- end 'AttentionPedia.js' -->
        <!-- begin 'headInfo.js' -->
    <script>
    const BASE_PATH = "../../../../docs/demo";
    
    class HeadInfo {
        constructor(id, model, layer, head) {
            this.id = id;
            this.model = model;
            this.layer = layer;
            this.head = head;
            this.classifications = [];
        }
    
        static from_id(id) {
            // split by ":", should have 3 components
            // `{model}:L{layer}:H{head}`
            const parts = id.split(':');
            if (parts.length !== 3) {
                throw new Error(`Invalid id format: ${id}. Expected format: {model}:L{layer}:H{head}`);
            }
            const [model, layerPart, headPart] = parts;
            if (!layerPart.startsWith('L')) {
                throw new Error(`Invalid layer format: ${layerPart}. Expected format: L{number}`);
            }
            if (!headPart.startsWith('H')) {
                throw new Error(`Invalid head format: ${headPart}. Expected format: H{number}`);
            }
            const layer = parseInt(layerPart.slice(1), 10);
            const head = parseInt(headPart.slice(1), 10);
            if (isNaN(layer) || isNaN(head)) {
                throw new Error(`Invalid numeric values in id: ${id}`);
            }
            return new HeadInfo(id, model, layer, head);
        }
    
        async get_pattern_url(promptHash) {
            return `${BASE_PATH}/${this.model}/prompts/${promptHash}/L${this.layer}/H${this.head}/raw.png`;
        }
    }
    </script>
    <!-- end 'headInfo.js' -->
        <!-- begin 'config.js' -->
    <script>
    // Mock config data (in a real app, this would be loaded from config.json)
    const mockConfig = {
    	"prompts": [
    		"4cI1GEw6ALlDIgyrDHqSNw",
    		"7ACbiDg7tQ7q3vA1mz2I_g",
    		"9Hg1qyV1vUCZPQxUjnXqvQ",
    		"154QVY-xqZlyiFm1FvmMhg",
    	],
    	"heads_display": [
    		"gpt2-small:L5:H5",
    		"gpt2-small:L3:H8",
    		"gpt2-small:L7:H2",
    		"pythia-14m:L0:H3",
    		"pythia-14m:L2:H1"
    	]
    };
    </script>
    <!-- end 'config.js' -->
        <!-- begin 'app.js' -->
    <script>
    document.addEventListener('alpine:init', () => {
    	Alpine.data('attentionApp', () => ({
    		loading: true,
    		error: null,
    		prompts: [],
    		heads_display: [],
    
    		async init() {
    			const config = mockConfig;
    			this.prompts = config.prompts;
    			this.heads_display = config.heads_display;
    			this.loading = false;
    		},
    
    		patternComponent(headId, promptHash) {
    			return {
    				loading: true,
    				imageUrl: null,
    				error: null,
    
    				async init() {
    					try {
    						const headInfo = HeadInfo.from_id(headId);
    						this.imageUrl = await headInfo.get_pattern_url(promptHash);
    						this.loading = false;
    					} catch (error) {
    						console.error(`Failed to get pattern URL for ${headId}:${promptHash}:`, error);
    						this.error = error.message;
    						this.loading = false;
    					}
    				}
    			};
    		},
    
    		classificationComponent(headId) {
    			return {
    				loading: true,
    				classifications: [],
    				typesMetadata: {},
    				error: null,
    
    				async init() {
    					try {
    						const types = await ATTENTION_PEDIA.get_head_types(headId);
    						this.classifications = types;
    
    						// Load metadata for each type
    						for (const type of types) {
    							this.typesMetadata[type] = await ATTENTION_PEDIA.get_type_meta(type);
    						}
    
    						this.loading = false;
    					} catch (error) {
    						console.error(`Failed to get classifications for ${headId}:`, error);
    						this.error = error.message;
    						this.loading = false;
    					}
    				},
    
    				showTooltip(event, type) {
    					const meta = this.typesMetadata[type];
    					if (!meta || Object.keys(meta).length === 0) {
    						return;
    					}
    
    					let content = type;
    					if (meta.description) {
    						content += ` - ${meta.description}`;
    					}
    					if (meta.frequency) {
    						content += ` (freq: ${meta.frequency})`;
    					}
    
    					// Create or update tooltip
    					let tooltip = document.getElementById('tooltip');
    					if (!tooltip) {
    						tooltip = document.createElement('div');
    						tooltip.id = 'tooltip';
    						tooltip.className = 'tooltip';
    						document.body.appendChild(tooltip);
    					}
    
    					tooltip.textContent = content;
    
    					// Position tooltip
    					const rect = event.target.getBoundingClientRect();
    					tooltip.style.left = (rect.left + window.scrollX) + 'px';
    					tooltip.style.top = (rect.bottom + window.scrollY + 5) + 'px';
    					tooltip.classList.add('show');
    				},
    
    				hideTooltip() {
    					const tooltip = document.getElementById('tooltip');
    					if (tooltip) {
    						tooltip.classList.remove('show');
    					}
    				}
    			};
    		}
    	}));
    });
    </script>
    <!-- end 'app.js' -->
</head>
<!-- body -->

<body>
    <div class="container" x-data="attentionApp" x-init="await init()">
        <div class="section">
            <table class="pattern-table">
                <thead>
                    <tr>
                        <th>Head</th>
                        <th>Classifications</th>
                        <template x-for="prompt in prompts" :key="prompt">
                            <th x-text="prompt"></th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="headId in heads_display" :key="headId">
                        <tr>
                            <td class="head-info" x-text="headId"></td>
                            <td class="classifications-cell">
                                <div x-data="classificationComponent(headId)" x-init="await init()">
                                    <div x-show="loading" class="classifications-loading">Loading...</div>
                                    <div x-show="error" class="classifications-error" x-text="error"></div>
                                    <div x-show="!loading && !error" class="classifications-container">
                                        <template x-for="classification in classifications" :key="classification">
                                            <div class="classification-line">
                                                <span class="classification-tag" @mouseenter="showTooltip($event, classification)" @mouseleave="hideTooltip()" x-text="classification">
                                                </span>
                                            </div>
                                        </template>
                                        <div x-show="classifications.length === 0" class="classifications-loading"> No classifications </div>
                                    </div>
                                </div>
                            </td>
                            <template x-for="prompt in prompts" :key="prompt">
                                <td>
                                    <div x-data="patternComponent(headId, prompt)" x-init="await init()">
                                        <img x-show="imageUrl" :src="imageUrl" class="pattern-image" :alt="`Pattern for ${headId} on ${prompt}`">
                                    </div>
                                </td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
