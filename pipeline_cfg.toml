# input paths
# ============================================================
# prompts file -- should be newline-delimited jsonl with each row having keys "text" and "meta"
# example:
# {"text": "Inorganic phosphate uptake in intact vacuoles isolated from suspension-cultured cells", "meta": {"pile_set_name": "PubMed Abstracts"}}
prompts_file = "data/text/pile_10k.jsonl"
# where to save patters -- both npz files of activations, and in step 1b png files of activation patterns
# structure is:
# `{patterns_dir}/{model_name}/prompts/{prompt_hash}/activations.npz`
# `{patterns_dir}/{model_name}/prompts/{prompt_hash}/L{layer_idx}/H{head_idx}/attn.png`
patterns_dir = "data/patterns"

# prompts processing
# ============================================================
# how many total prompts to use
prompts_n_samples = 1024
# minimum chars per prompt
prompts_min_chars = 64
# maximum chars per prompt
