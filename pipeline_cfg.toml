# number of components for PCA decomposition of activation features
pca_n_components = 6

# head embedding configuration
# ============================================================
# methods to use for head embeddings (uncomment to override defaults)
# embedding_methods = ["isomap", "umap", "tsne", "pca"]
# dimensions to generate for each embedding method (uncomment to override defaults)
# embedding_n_components_list = [2, 3]
# neighbor counts for manifold methods like isomap, umap (uncomment to override defaults)
# embedding_n_neighbors_list = [2, 4, 8, 16, 32, 64]

# computing
# ============================================================
# numbper of cpus to use for CPU tasks
n_proc = 64
# whether to force an overwrite of existing attention patterns
force_overwrite = false
# device to use for torch tensors -- generally "cpu", "cuda", or "mps"
# can be set thru cli with `--device`
device = "cuda:0"

# multi-model parallelism for s1 (run models concurrently based on VRAM)
# enable with --parallel-models on the CLI, or set to true here
parallel_models = true
devices = ["cuda:0"]
# multiplied with n_params to estimate VRAM in bytes.  must account for dtype
# size (e.g. 4 for fp32), activation caches, and allocator overhead.
# batch-size memory is not modelled — increase this if you hit OOM.
vram_safety_factor = 10.0
# number of prompts per forward pass during activation gathering
batch_size = 32

# output paths
# ============================================================
# where to put the data of features extracted from the patterns
# see `DATA_FNAMES` for paths of data files relative to this directory
features_dir = "data/features"
vis_dir = "data/vis"
# locations of data files relative to `features_dir`, probably don't modify this
# data_fnames = {} 

# plotting/logging
# ============================================================
# directory to save figures in
figures_dir = "data/figures"
# locations of figures relative to `figures_dir`, probably don't modify this
# figure_fnames {}

# verbosity level for logging
verbose = 99

# extra kwargs to pass to plotting functions. kind of messy
[plot_kwargs]
pca_all_dpi = 150

[vis_configs.embed_pattern.cfg]
dataFile = "../../../features/pca.csv"

