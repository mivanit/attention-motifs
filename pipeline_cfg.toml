# input paths
# ============================================================
# prompts file -- should be newline-delimited jsonl with each row having keys "text" and "meta"
# example:
# {"text": "Inorganic phosphate uptake in intact vacuoles isolated from suspension-cultured cells", "meta": {"pile_set_name": "PubMed Abstracts"}}
prompts_file = "data/text/pile_10k.jsonl"
# where to save patters -- both npz files of activations, and in step 1b png files of activation patterns
# structure is:
# `{patterns_dir}/{model_name}/prompts/{prompt_hash}/activations.npz`
# `{patterns_dir}/{model_name}/prompts/{prompt_hash}/L{layer_idx}/H{head_idx}/attn.png`
patterns_dir = "data/patterns"

# prompts processing
# ============================================================
# how many total prompts to use
prompts_n_samples = 1024
# minimum chars per prompt
prompts_min_chars = 64
# maximum chars per prompt
prompts_max_chars = 512

# data processing
# ============================================================
# which models to use (transformerlens names)
models = [
	# gpt2
	"gpt2-small",
	"gpt2-medium",
	"gpt2-large",
	"gpt2-xl",
	"distillgpt2",
	
	# pythia
	"pythia-14m",
	"pythia-31m",
	"pythia-70m",
	"pythia-160m",

	# "pythia-160m-deduped",
	# "pythia-160m-v0",
	# "pythia-160m-deduped-v0",
	"pythia-160m-seed1",
	"pythia-160m-seed2",
	"pythia-160m-seed3",
	
	"pythia-410m",
	"pythia-1b",
	"pythia-1.4b",
	
	# too big for 24GB vram
	# "pythia-2.8b",
	# "pythia-6.9b",
	# "pythia-12b",
	
	# tinystories
	# "tiny-stories-1M",
	# "tiny-stories-3M",
	# "tiny-stories-8M",
	# "tiny-stories-28M",
	# "tiny-stories-33M",
	# gemma
	# "gemma-2b",
	# "gemma-2-2b",
	## gemma3
	# "gemma-3-270m",
	# "gemma-3-1b-pt",
	#"gemma-3-4b-pt",
	# llama
	# "meta-llama/Llama-3.2-1B",
	#"meta-llama/Llama-3.2-3B",
	# qwen doesnt work, TL bug?
]
# number of components for PCA decomposition of activation features
pca_n_components = 6
# max prompts in web CSV (pca_web.csv). same prompt subset for all models.
# PCA is computed on ALL data; this only limits the web visualization file.
# comment out = use all prompts
web_pca_n_prompts = 128

# head embedding configuration
# ============================================================
# methods to use for head embeddings (uncomment to override defaults)
# embedding_methods = ["isomap", "umap", "tsne", "pca"]
# dimensions to generate for each embedding method (uncomment to override defaults)
# embedding_n_components_list = [2, 3]
# neighbor counts for manifold methods like isomap, umap (uncomment to override defaults)
# embedding_n_neighbors_list = [2, 4, 8, 16, 32, 64]

# computing
# ============================================================

# skip previously completed steps (tracks state in data/pipeline_state.json)
# invalidates automatically when config changes
smart_mode = true
# number of cpus to use for CPU tasks
n_proc = 69
# chunksize for multiprocessing pool.imap in s2 feature computation
s2_chunksize = 1
# whether to force an overwrite of existing attention patterns
force_overwrite = false
# device to use for torch tensors -- generally "cpu", "cuda", or "mps"
# can be set thru cli with `--device`
device = "cuda:0"

# multi-model parallelism for s1 (run models concurrently based on VRAM)
# enable with --parallel-models on the CLI, or set to true here
parallel_models = true
devices = ["cuda:0"]
# multiplied with n_params to estimate VRAM in bytes.  must account for dtype
# size (e.g. 4 for fp32), activation caches, and allocator overhead.
# batch-size memory is not modelled — increase this if you hit OOM.
vram_safety_factor = 10.0
# number of prompts per forward pass during activation gathering
# batch_size = 32
batch_size = 8 # gpt2-xl and pythia-2.8b need this to avoid OOM on 24GB vram, but smaller models can use larger batch sizes for speed. so, run the pipeline with larger batch size first, let the models fail, then run again with this smaller batch size to finish the failed models
# compression level for activation .npz files: 0=none (fastest), 1=fast, 6=default
# level 1 is ~5x faster than 6 with ~2x compression ratio
compress_level = 0

# s1b: render patterns to PNG
# ============================================================
# set to false to skip PNG rendering entirely
render_patterns_enabled = true
# how many prompts to render PNGs for (comment out = all prompts_n_samples)
# if less than prompts_n_samples, a deterministic random subset is selected
# the same subset is used for ALL models
render_n_samples = 64
# seed for deterministic random prompt selection
render_seed = 42

# output paths
# ============================================================
# where to put the data of features extracted from the patterns
# see `DATA_FNAMES` for paths of data files relative to this directory
features_dir = "data/features"
vis_dir = "data/vis"
# locations of data files relative to `features_dir`, probably don't modify this
# data_fnames = {} 

# plotting/logging
# ============================================================
# directory to save figures in
figures_dir = "data/figures"
# locations of figures relative to `figures_dir`, probably don't modify this
# figure_fnames {}

# verbosity level for logging
verbose = 99

# extra kwargs to pass to plotting functions. kind of messy
[plot_kwargs]
pca_all_dpi = 150

[vis_configs.embed_pattern.cfg]
dataFile = "../../../features/pca_web.csv"

