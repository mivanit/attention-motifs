# models -- which models to use
models = [
	"tiny-stories-1M",
	"pythia-14m",
	# "meta-llama/Llama-3.2-1B",
]

# paths -- where to find stuff and where to save it
prompts_file = "data/text/pile_demo.jsonl"
patterns_dir = "tests/.temp/patterns"
features_dir = "tests/.temp/features"
vis_dir = "tests/.temp/vis"

# prompts -- how many, how to slice them
prompts_n_samples = 2
prompts_min_chars = 10
prompts_max_chars = 100

# computing -- no effect on the results
n_proc = 12
device = "cuda:0"

verbose = 99
figures_dir = "tests/.temp/figures"


embedding_n_neighbors_list = [2, 4]

[vis_configs.attentionpedia.cfg]
head_viewing = "tiny-stories-1M:L0:H0"
prompts_url = "../../patterns/tiny-stories-1M/prompts.jsonl"