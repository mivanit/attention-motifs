[project]
name = "attention-motifs"
version = "0.0.4"
description = "template for python projects/packages"
authors = [
	{ name = "Michael Ivanitskiy", email = "mivanits@umich.edu" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
	# standard
    "numpy>=1.26.1,<2.0.0",
    "torch>=2.5.1",
    "jaxtyping>=0.2.33",
	"einops>=0.8.0",
    "tqdm>=4.66.5",
    "pandas>=2.2.2",
    "scipy>=1.14.1",
    # "scikit-learn>=1.3",
	"plotly",
    "matplotlib>=3.8.0",
    "pillow>=11.0.0",
	"dash>=3.0.1",
    # jupyter
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
	"nbformat>=4.2.0",
    # typing
    "beartype>=0.14.1",
	# symbolic regression
	"pysr>=1.3.1",
    # custom utils
    "muutils>=0.8.7",
	"zanj>=0.3.1",
	"trnbl[tensorboard]>=0.1.1",
    # TL
    "transformer-lens>=2.10.0",
    # this TL dep not listed? is this in an extra?
    "typeguard>=4.4.1",
	# see https://github.com/pydantic/pydantic/issues/11348
	"typing_extensions==4.12.2",
	"pydantic==2.10.4",
	# pattern-lens
	"pattern-lens>=0.4.0",
	# pattern-lens from git
	# "pattern-lens @ git+https://github.com/mivanit/pattern-lens",
]


[dependency-groups]
	dev = [	
		# lmcat
		"lmcat>=0.2.0",
		# test
		"pytest>=8.2.2",
		# coverage
		"pytest-cov>=4.1.0",
		"coverage-badge>=1.1.0",
		# type checking
		"mypy>=1.0.1",
		# docs	
		'pdoc>=14.6.0',
		# tomli since no tomlib in python < 3.1		
		"tomli>=2.1.0; python_version < '3.11'",
	]
	lint = [
		# lint
		"pycln>=2.1.3",
		"ruff>=0.4.8",
	]

[tool.uv]
	default-groups = ["dev", "lint"]

[project.urls]
	Homepage = "https://miv.name/attention-motifs"
	Documentation = "https://miv.name/attention-motifs"
	Repository = "https://github.com/mivanit/attention-motifs"
	Issues = "https://github.com/mivanit/attention-motifs/issues"

[build-system]
	requires = ["hatchling"]
	build-backend = "hatchling.build"

# ruff config
[tool.ruff]
exclude = ["__pycache__"]

	[tool.ruff.lint]
		ignore = ["F722", "F841"]

	[tool.ruff.format]
		indent-style = "tab"
		skip-magic-trailing-comma = false

[tool.hatch.metadata]
	allow-direct-references = true

[tool.pytest.ini_options]
	addopts = "--jaxtyping-packages=pattern_lens,beartype.beartype"
	filterwarnings = [
		"ignore: PEP 484 type hint*:beartype.roar._roarwarn.BeartypeDecorHintPep585DeprecationWarning",
	]

# `make lmcat` depends on the lmcat and can be configured here
[tool.lmcat]
	output = "docs/other/lmcat.txt" # changing this might mean it wont be accessible from the docs
	ignore_patterns = [
		".git/**",
		".meta/**",
		".mypy_cache/**",
		".pytest_cache/**",
		".ruff_cache/**",
		".venv/**",
		"docs/**",
		"data/pile_100.jsonl",
		"data/pile_50.jsonl",
		"data/pile_5_val.jsonl",
		"data/pile_5.jsonl",
		"data/pile_1k.jsonl",
		"uv.lock",
		"LICENSE",
		"*.png",
	]
	[tool.lmcat.glob_process]
		"[mM]akefile" = "makefile_recipes"
		"*.ipynb" = "ipynb_to_md"


# for configuring this tool (makefile, make_docs.py)
# ============================================================
[tool.makefile]

# documentation configuration, for `make docs` and `make docs-clean`
[tool.makefile.docs]
    output_dir = "docs"
    no_clean = [
        ".nojekyll",  # For GitHub Pages
		"demo/",
        # "resources/", # Templates, CSS, etc. this, or whatever is specified as DOCS_RESOURCES_DIR in makefile will always be preserved
    ]

    # optional generation of notebooks as html pages
    [tool.makefile.docs.notebooks]
        enabled = true
        source_path = "notebooks"
        output_path_relative = "notebooks"
        
        #[tool.makefile.docs.notebooks.descriptions]
            # "example" = "Example notebook showing basic usage"
        

[tool.makefile.uv-exports]
	args = [
		"--no-hashes"
	]
	exports = [
		# no groups, no extras, just the base dependencies
		{ name = "base", groups = false, extras = false },
		# all groups
		{ name = "groups", groups = true, extras = false },
		# only the lint group -- custom options for this
		{ name = "lint", options = ["--only-group", "lint"] },
		# # all groups and extras
		{ name = "all", filename="requirements.txt", groups = true, extras=true },
		# # all groups and extras, a different way
		{ name = "all", groups = true, options = ["--all-extras"] },
	]

[tool.makefile.inline-todo]
	search_dir = "."
	out_file = "docs/other/todo-inline.md"
	context_lines = 2
	extensions = ["py", "md"]
	tags = ["CRIT", "TODO", "FIXME", "HACK", "BUG", "DOC"]
	exclude = [
		"docs/**",
		".venv/**",
		"scripts/get_todos.py",
	]
	branch = "main"
    [tool.makefile.inline-todo.tag_label_map]
        "BUG" = "bug"
        "TODO" = "enhancement"
		"DOC" = "documentation"

# ============================================================
