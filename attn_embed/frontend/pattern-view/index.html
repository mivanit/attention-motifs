<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Pattern Viewer</title>
        <!-- begin 'style.css' -->
    <style>
    body {
    	font-family: Arial, sans-serif;
    	margin: 20px;
    }
    
    #controls {
    	margin-bottom: 20px;
    }
    
    #info {
    	font-family: monospace;
    	font-size: 14px;
    }
    
    .heatmap-container {
    	display: grid;
    	grid-template-areas: 
    		"y-labels canvas"
    		"empty x-labels";
    	margin: 20px;
    	gap: 0;
    }
    
    canvas {
        grid-area: canvas;
        border: 1px solid #000;
        cursor: crosshair;
        position: relative;
    
        /* make scaling nearest‑neighbor on every browser */
        image-rendering: pixelated;        /* spec / Chromium */
        image-rendering: -moz-crisp-edges; /* Firefox */
        image-rendering: crisp-edges;      /* Safari */
    }
    
    .x-labels {
    	grid-area: x-labels;
    	display: flex;
    	align-items: flex-start;
    }
    
    .y-labels {
    	grid-area: y-labels;
    	display: flex;
    	flex-direction: column;
    	align-items: flex-end;
    	justify-content: flex-start;
    }
    
    .label {
    	font-family: monospace;
    	font-size: 10px;
    	text-align: left;
    	overflow: hidden;
    	transition: background-color 0.1s;
    }
    
    .label.highlight {
    	background-color: #ffcccc;
    }
    
    .x-label {
    	writing-mode: vertical-rl;
    	width: 20px;
    	height: 50px;
    }
    
    .y-label {
    	width: 60px;
    	height: 20px;
    	line-height: 20px;
    }
    
    .tooltip {
    	display: none !important; /* Hide tooltip since we use static cell info */
    }
    
    .cell-info {
    	margin: 20px;
    	padding: 10px;
    	border: 1px solid #ccc;
    	background: #f9f9f9;
    	font-family: monospace;
    	font-size: 14px;
    	min-height: 60px;
    }
    
    .cell-info-row {
    	display: flex;
    	gap: 20px;
    	margin: 5px 0;
    }
    
    .cell-info-row span:first-child {
    	font-weight: bold;
    	min-width: 60px;
    }
    </style>
    <!-- end 'style.css' -->
</head>

<body>
    <div id="controls">
        <div id="info"></div>
        <div class="tokens-display" id="tokensDisplay"></div>
    </div>
    <div class="heatmap-container" id="heatmapContainer">
        <canvas id="heatmapCanvas"></canvas>
        <div class="x-labels" id="xLabels"></div>
        <div class="y-labels" id="yLabels"></div>
        <div class="tooltip" id="tooltip"></div>
    </div>
    <div class="cell-info" id="cellInfo"></div>
        <!-- begin 'dataLoader.js' -->
    <script>
    /**
     * Data Loader Module
     * Handles fetching attention patterns and prompt metadata
     */
    
    const DATA_BASE_PATH = '../../../../../data/patterns/';
    
    class AttentionDataLoader {
        constructor(basePath = DATA_BASE_PATH) {
            this.basePath = basePath;
        }
    
        async loadAttentionPattern(model, promptHash, layerIdx, headIdx) {
            const pngPath = `${this.basePath}${model}/prompts/${promptHash}/L${layerIdx}/H${headIdx}/attn.png`;
            return await loadPNGAsMatrix(pngPath);
        }
    
        async loadPromptMetadata(model, promptHash) {
            const jsonPath = `${this.basePath}${model}/prompts/${promptHash}/prompt.json`;
            const response = await fetch(jsonPath);
            if (!response.ok) {
                throw new Error(`Failed to load prompt metadata: ${response.statusText}`);
            }
            return await response.json();
        }
    }
    </script>
    <!-- end 'dataLoader.js' -->
        <!-- begin 'viewer.js' -->
    <script>
    /**
     * Attention Pattern Viewer Module - Simplified version
     * Displays PNG directly with overlay for highlights
     */
    
    // Global constants for consistent layout
    const LABEL_CONSTANTS = {
        Y_LABEL_WIDTH: 80,
        X_LABEL_HEIGHT: 60,
        CANVAS_SIZE: 500
    };
    
    class AttentionPatternViewer {
        constructor(containerId) {
            // Constants
            this.SIZE = LABEL_CONSTANTS.CANVAS_SIZE;
            this.HM_highlight_strokeStyle = '#ff0000';
            this.HM_highlight_lineWidth = 1;
            this.HM_grid_strokeStyle = '#ddd';
            this.HM_grid_lineWidth = 0.2;
            this.THROTTLE_DELAY = 16; // ~60fps
    
            // State
            this.n = 0;
            this.tokens = [];
            this.pixelSize = 0;
            this.cellBoundaries = [];
            this.lastMouseTime = 0;
            this.animationFrame = null;
            this.labelElements = { x: [], y: [] };
            this.pngImage = null;
            this.selectedCell = null; // { x, y } or null
            this.keyboardMode = false;
    
            // DOM elements
            this.container = document.getElementById(containerId);
            
            // Set up grid layout with constants
            this.container.style.gridTemplateColumns = `${LABEL_CONSTANTS.Y_LABEL_WIDTH}px ${LABEL_CONSTANTS.CANVAS_SIZE}px`;
            this.container.style.gridTemplateRows = `${LABEL_CONSTANTS.CANVAS_SIZE}px ${LABEL_CONSTANTS.X_LABEL_HEIGHT}px`;
    
            // Create main canvas for PNG display
            this.canvas = document.getElementById('heatmapCanvas');
            this.ctx = this.canvas.getContext('2d');
    
            // no image smoothing for pixelated
            this.ctx.imageSmoothingEnabled = false;
            this.ctx.webkitImageSmoothingEnabled = false; // Safari
            this.ctx.mozImageSmoothingEnabled  = false;   // Firefox
            this.ctx.msImageSmoothingEnabled   = false;   // old Edge/IE
    
            // Create overlay canvas for highlights
            this.overlayCanvas = document.createElement('canvas');
            this.overlayCanvas.style.position = 'absolute';
            this.overlayCanvas.style.left = '0';
            this.overlayCanvas.style.top = '0';
            this.overlayCanvas.style.pointerEvents = 'none';
            this.overlayCtx = this.overlayCanvas.getContext('2d');
    
            // Add overlay to container
            this.canvas.parentElement.style.position = 'relative';
            this.canvas.parentElement.appendChild(this.overlayCanvas);
    
            this.tooltip = document.getElementById('tooltip');
            this.cellInfo = document.getElementById('cellInfo');
            this.xLabelsContainer = document.getElementById('xLabels');
            this.yLabelsContainer = document.getElementById('yLabels');
    
            // Set up event listeners
            this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
            this.canvas.addEventListener('mouseleave', () => this.handleMouseLeave());
            this.canvas.addEventListener('click', (e) => this.handleClick(e));
            document.addEventListener('keydown', (e) => this.handleKeyDown(e));
        }
    
        precalculateBoundaries() {
            this.cellBoundaries = [];
            for (let i = 0; i <= this.n; i++) {
                this.cellBoundaries.push(i * this.pixelSize);
            }
        }
    
    
        renderHighlights(hoverX, hoverY) {
            // Clear overlay
            this.overlayCtx.clearRect(0, 0, this.SIZE, this.SIZE);
    
            // Draw grid lines
            this.overlayCtx.strokeStyle = this.HM_grid_strokeStyle;
            this.overlayCtx.lineWidth = this.HM_grid_lineWidth;
            this.overlayCtx.beginPath();
    
            for (let i = 0; i <= this.n; i++) {
                const pos = this.cellBoundaries[i];
                // Horizontal line
                this.overlayCtx.moveTo(0, pos);
                this.overlayCtx.lineTo(this.SIZE, pos);
                // Vertical line
                this.overlayCtx.moveTo(pos, 0);
                this.overlayCtx.lineTo(pos, this.SIZE);
            }
    
            this.overlayCtx.stroke();
    
            // Draw highlights if hovering
            if (hoverX >= 0 && hoverY >= 0 && hoverX < this.n && hoverY < this.n) {
                this.overlayCtx.strokeStyle = this.HM_highlight_strokeStyle;
                this.overlayCtx.lineWidth = this.HM_highlight_lineWidth;
    
                const x1 = this.cellBoundaries[hoverX];
                const y1 = this.cellBoundaries[hoverY];
    
                // Highlight the cell's own borders
                this.overlayCtx.strokeRect(x1, y1, this.pixelSize, this.pixelSize);
    
                this.overlayCtx.beginPath();
    
                // Highlight row (only to the left of hovered cell)
                if (hoverX > 0) {
                    this.overlayCtx.moveTo(0, y1);
                    this.overlayCtx.lineTo(x1, y1);
                    this.overlayCtx.moveTo(0, y1 + this.pixelSize);
                    this.overlayCtx.lineTo(x1, y1 + this.pixelSize);
                }
    
                // Highlight column (only below hovered cell)
                if (hoverY < this.n - 1) {
                    this.overlayCtx.moveTo(x1, y1 + this.pixelSize);
                    this.overlayCtx.lineTo(x1, this.SIZE);
                    this.overlayCtx.moveTo(x1 + this.pixelSize, y1 + this.pixelSize);
                    this.overlayCtx.lineTo(x1 + this.pixelSize, this.SIZE);
                }
    
                this.overlayCtx.stroke();
            }
        }
    
        createAxisLabels() {
            // Clear existing labels
            this.xLabelsContainer.innerHTML = '';
            this.yLabelsContainer.innerHTML = '';
            this.labelElements.x = [];
            this.labelElements.y = [];
    
            this.tokens.forEach((token) => {
                const xLabel = document.createElement('div');
                xLabel.className = 'label x-label';
                xLabel.textContent = token;
                xLabel.style.width = this.pixelSize + 'px';
                xLabel.style.height = LABEL_CONSTANTS.X_LABEL_HEIGHT + 'px';
                this.xLabelsContainer.appendChild(xLabel);
                this.labelElements.x.push(xLabel);
    
                const yLabel = document.createElement('div');
                yLabel.className = 'label y-label';
                yLabel.textContent = token;
                yLabel.style.width = LABEL_CONSTANTS.Y_LABEL_WIDTH + 'px';
                yLabel.style.height = this.pixelSize + 'px';
                yLabel.style.lineHeight = this.pixelSize + 'px';
                this.yLabelsContainer.appendChild(yLabel);
                this.labelElements.y.push(yLabel);
            });
        }
    
        updateHighlights(x, y) {
            // Update label highlights
            this.labelElements.x.forEach(label => label.classList.remove('highlight'));
            this.labelElements.y.forEach(label => label.classList.remove('highlight'));
    
            if (x >= 0 && x < this.n && y >= 0 && y < this.n) {
                this.labelElements.x[x].classList.add('highlight');
                this.labelElements.y[y].classList.add('highlight');
            }
    
            // Render highlights
            this.renderHighlights(x, y);
        }
    
        getPixelValue(x, y) {
            // Get pixel value from the displayed PNG
            const imageData = this.ctx.getImageData(
                x * this.pixelSize + this.pixelSize / 2,
                y * this.pixelSize + this.pixelSize / 2,
                1, 1
            );
            // Convert from 0-255 to 0-1
            return imageData.data[0] / 255.0;
        }
    
        handleMouseMove(e) {
            // In keyboard mode, ignore mouse movement
            if (this.keyboardMode) {
                return;
            }
    
            const now = Date.now();
            if (now - this.lastMouseTime < this.THROTTLE_DELAY) {
                return;
            }
            this.lastMouseTime = now;
    
            const rect = this.canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / rect.width * this.n);
            const y = Math.floor((e.clientY - rect.top) / rect.height * this.n);
    
            if (x >= 0 && x < this.n && y >= 0 && y < this.n) {
                // Cancel any pending animation frame
                if (this.animationFrame) {
                    cancelAnimationFrame(this.animationFrame);
                }
    
                // Schedule highlight update
                this.animationFrame = requestAnimationFrame(() => {
                    this.updateHighlights(x, y);
                    this.animationFrame = null;
                });
            } else {
                this.handleMouseLeave();
            }
        }
    
        handleMouseLeave() {
            // In keyboard mode, don't clear highlights
            if (this.keyboardMode) {
                return;
            }
    
            // Cancel any pending animation frame
            if (this.animationFrame) {
                cancelAnimationFrame(this.animationFrame);
                this.animationFrame = null;
            }
    
            // Remove highlights
            this.labelElements.x.forEach(label => label.classList.remove('highlight'));
            this.labelElements.y.forEach(label => label.classList.remove('highlight'));
    
            // Render without highlights
            this.renderHighlights(-1, -1);
        }
    
        handleClick(e) {
            const rect = this.canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / rect.width * this.n);
            const y = Math.floor((e.clientY - rect.top) / rect.height * this.n);
    
            if (x >= 0 && x < this.n && y >= 0 && y < this.n) {
                if (this.keyboardMode) {
                    // Exit keyboard mode on second click
                    this.keyboardMode = false;
                    this.selectedCell = null;
                    this.cellInfo.innerHTML = '';
                    // Let mouse position take over
                    this.handleMouseMove(e);
                } else {
                    // Enter keyboard mode and select cell
                    this.keyboardMode = true;
                    this.selectedCell = { x, y };
                    this.updateHighlights(x, y);
                    this.updateCellInfo(x, y);
                    
                    // Hide tooltip since we're using static info now
                    this.tooltip.style.display = 'none';
                }
            }
        }
    
        handleKeyDown(e) {
            // Only handle in keyboard mode
            if (!this.keyboardMode || !this.selectedCell) {
                return;
            }
    
            let newX = this.selectedCell.x;
            let newY = this.selectedCell.y;
    
            switch (e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    newY = Math.max(0, newY - 1);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    newY = Math.min(this.n - 1, newY + 1);
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    newX = Math.max(0, newX - 1);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    newX = Math.min(this.n - 1, newX + 1);
                    break;
                case 'Escape':
                    // Exit keyboard mode
                    this.keyboardMode = false;
                    this.selectedCell = null;
                    this.updateHighlights(-1, -1);
                    this.cellInfo.innerHTML = '';
                    return;
                default:
                    return;
            }
    
            // Update selection
            this.selectedCell = { x: newX, y: newY };
            this.updateHighlights(newX, newY);
            this.updateCellInfo(newX, newY);
        }
    
        updateCellInfo(x, y) {
            if (x >= 0 && x < this.n && y >= 0 && y < this.n) {
                const xToken = this.tokens[x];
                const yToken = this.tokens[y];
                const value = this.getPixelValue(x, y).toFixed(3);
    
                this.cellInfo.innerHTML = `
                    <div class="cell-info-row">
                        <span>X:</span><span>${xToken} (position ${x})</span>
                    </div>
                    <div class="cell-info-row">
                        <span>Y:</span><span>${yToken} (position ${y})</span>
                    </div>
                    <div class="cell-info-row">
                        <span>Value:</span><span>${value}</span>
                    </div>
                    <div class="cell-info-row">
                        <span>Mode:</span><span>Keyboard navigation (Arrow keys to move, Escape to exit)</span>
                    </div>
                `;
            }
        }
    
        async displayPattern(dataLoader, model, promptHash, layerIdx, headIdx) {
            // Load prompt metadata
            const metadata = await dataLoader.loadPromptMetadata(model, promptHash);
            this.tokens = metadata.tokens;
            this.n = this.tokens.length;
            this.pixelSize = this.SIZE / this.n;
    
            // Load PNG directly
            const pngPath = `${dataLoader.basePath}${model}/prompts/${promptHash}/L${layerIdx}/H${headIdx}/attn.png`;
    
            return new Promise((resolve, reject) => {
                this.pngImage = new Image();
                this.pngImage.crossOrigin = 'anonymous';
    
                this.pngImage.onload = () => {
                    // Precalculate boundaries
                    this.precalculateBoundaries();
    
                    // Set canvas dimensions to fixed size
                    this.canvas.width = this.SIZE;
                    this.canvas.height = this.SIZE;
                    this.overlayCanvas.width = this.SIZE;
                    this.overlayCanvas.height = this.SIZE;
    
                    // every canvas reside restores defaults, so we remove the smoothing again
                    this.ctx.imageSmoothingEnabled = false;
                    this.ctx.webkitImageSmoothingEnabled = false; // Safari
                    this.ctx.mozImageSmoothingEnabled = false; // Firefox
                    this.ctx.msImageSmoothingEnabled = false; // old Edge/IE
    
                    // Calculate pixel size based on fixed canvas size
                    this.pixelSize = this.SIZE / this.n;
    
                    // Render PNG scaled to canvas size
                    this.ctx.drawImage(this.pngImage, 0, 0, this.SIZE, this.SIZE);
    
                    // Initial render of grid
                    this.renderHighlights(-1, -1);
    
                    // Create labels
                    this.createAxisLabels();
    
                    // Update page title
                    document.title = `${model} L${layerIdx}H${headIdx} - ${promptHash.substring(0, 8)}`;
    
                    resolve();
                };
    
                this.pngImage.onerror = () => {
                    reject(new Error(`Failed to load image: ${pngPath}`));
                };
    
                this.pngImage.src = pngPath;
            });
        }
    }
    </script>
    <!-- end 'viewer.js' -->
    <script>
        // Parse URL parameters with defaults for debugging
        const urlParams = new URLSearchParams(window.location.search);
        const promptHash = urlParams.get('prompt') || '0NUMVE92ScCvyvMyUywBeQ';
        const headParam = urlParams.get('head') || 'gemma-2b.L0.H0';

        // Parse head parameter: {model}.L{layer}.H{head}
        const parts = headParam.split('.');
        const model = parts[0];

        const layerIdx = parseInt(parts[1].substring(1));
        const headIdx = parseInt(parts[2].substring(1));

        // Update info
        document.getElementById('info').innerHTML =
            `<p>Model: ${model} | Layer: ${layerIdx} | Head: ${headIdx} | Prompt hash: ${promptHash}</p>`;

        // Initialize viewer and load data
        const viewer = new AttentionPatternViewer('heatmapContainer');
        const dataLoader = new AttentionDataLoader();

        viewer.displayPattern(dataLoader, model, promptHash, layerIdx, headIdx);
    </script>
</body>

</html>
