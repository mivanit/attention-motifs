<!DOCTYPE html>
<html lang="en">
<!-- note to AI assistants: if you are asked to modify this, 
 give modifications for the different scripts, css, html header, and html body all separately. 
 the joined file you see is bundled from those multiple source files
-->
<!-- header -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention Head Analysis</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="notif.css">
    <script src="config.js"></script>
    <script src="notif.js"></script>
    <script>getConfig();</script>
    <script src="array.js"></script>
    <script src="AttentionPedia.js"></script>
    <script src="head_embeds.js"></script>
    <script src="prompts.js"></script>
    <script src="headInfo.js"></script>
    <script src="app.js"></script>
</head>
<!-- body -->

<body>
    <div class="container" x-data="attentionApp" x-init="await init()">
        <div class="section">
            <table class="pattern-table">
                <thead>
                    <tr>
                        <th>Head</th>
                        <th>Distance</th>
                        <th>Classifications</th>
                        <template x-for="prompt in prompts" :key="prompt.hash">
                            <th class="prompt-header" @mouseenter="showPromptTooltip($event, prompt)" @mouseleave="hidePromptTooltip()">
                                <div class="prompt-hash" x-text="prompt.hash"></div>
                                <div class="prompt-tokens" x-text="`${prompt.n_tokens} tokens`"></div>
                            </th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loading state -->
                    <tr x-show="loading">
                        <td :colspan="3 + prompts.length" style="text-align: center; padding: 20px; color: #666;">
                            Loading attention heads data...
                        </td>
                    </tr>
                    <!-- Debug info -->
                    <tr x-show="!loading && heads_display_with_distances.length === 0">
                        <td :colspan="3 + prompts.length" style="text-align: center; padding: 20px; color: #666;">
                            No heads data available (length: <span x-text="heads_display_with_distances.length"></span>)
                        </td>
                    </tr>
                    <tr x-show="!loading && heads_display_with_distances.length > 0" style="background: #f0f0f0;">
                        <td :colspan="3 + prompts.length" style="text-align: center; padding: 10px; font-size: 12px;">
                            Debug: Found <span x-text="heads_display_with_distances.length"></span> heads to display
                        </td>
                    </tr>
                    <!-- Simple test row to see if template works -->
                    <tr x-show="!loading && heads_display_with_distances.length > 0" style="background: #ffffcc;">
                        <td>TEST ROW</td>
                        <td>WORKS</td>
                        <td>YEP</td>
                        <template x-for="prompt in prompts" :key="prompt.hash">
                            <td>IMG</td>
                        </template>
                    </tr>
                    <!-- Test x-for loop -->
                    <template x-for="(headRow, index) in heads_display_with_distances.slice(0, 2)" :key="`test-${index}`">
                        <tr style="background: #ffcccc;">
                            <td x-text="`Item ${index}`"></td>
                            <td x-text="headRow.headId || 'NO_ID'"></td>
                            <td x-text="headRow.isGap ? 'GAP' : 'HEAD'"></td>
                            <template x-for="prompt in prompts" :key="prompt.hash">
                                <td>TEST</td>
                            </template>
                        </tr>
                    </template>
                    <!-- Minimal actual template test -->
                    <template x-for="(headRow, index) in heads_display_with_distances.slice(0, 1)" :key="`minimal-${index}`">
                        <tr x-show="!headRow.isGap" style="background: #ccffcc;">
                            <td x-text="headRow.headId"></td>
                            <td x-text="headRow.distanceText"></td>
                            <td>Classifications here</td>
                            <template x-for="prompt in prompts" :key="prompt.hash">
                                <td>Pattern</td>
                            </template>
                        </tr>
                    </template>
                    <template x-for="(headRow, index) in heads_display_with_distances" :key="headRow.headId || `gap-${index}`">
                        <!-- Always show regular head row for testing -->
                        <tr>
                            <td class="head-info" x-text="headRow.headId"></td>
                            <td class="distance-cell" :style="`background-color: ${headRow.distanceColor}`" x-text="headRow.distanceText"></td>
                            <td class="classifications-cell" :class="headRow.hasMatchingClassification ? 'matching-classification' : ''">
                                Classifications loading...
                            </td>
                            <template x-for="prompt in prompts" :key="prompt.hash">
                                <td>
                                    <div class="pattern-loading">Loading...</div>
                                </td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
