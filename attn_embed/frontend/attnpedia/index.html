    <script>
    /**
     * Configuration Handler
     * 
     * Provides a flexible configuration system with multiple override levels:
     * 1. Default configuration (lowest priority)
     * 2. Inline configuration override (INLINE_CONFIG)
     * 3. External config.json file
     * 4. URL parameters (highest priority)
     * 
     * Features:
     * - Deep merging of configuration objects
     * - URL parameter parsing with dot notation support
     * - Automatic URL synchronization with debouncing
     * - Configuration export functionality
     * - Reset to loaded state capability
     */
    
    // Configuration constants
    const CONFIG_FILE_PATH = "config.json";
    const URL_UPDATE_DEBOUNCE_DELAY = 500; // ms
    const FLOAT_COMPARISON_EPSILON = 0.001;
    
    // Keys to skip during URL serialization
    const URL_SKIP_PATHS = [
    	'data.cache',
    	'network.headers',
    	'tempData'
    ];
    
    // Keys to skip during config comparison
    const COMPARISON_SKIP_KEYS = [
    	'timestamp',
    	'sessionId',
    	'tempData'
    ];
    
    // For inline config overrides - replace this with external script if needed
    var INLINE_CONFIG = null;
    
    // the line below might be replaced by an external build script to inject a config
    /*$$$INLINE_CONFIG$$$*/
    
    // Global variables for configuration management
    let CONFIG = null;
    let LOADED_CONFIG = null; // Store the config as loaded from file for comparison
    let URL_UPDATE_TIMEOUT = null;
    
    /**
     * Get default configuration object
     * @returns {object} Default configuration
     */
    function getDefaultConfig() {
    	let default_cfg = {
    		head_viewing: "gpt2-small:L5:H5",
    		heads_display: null,
    		table: {
    			n_nearby: 2,
    			n_share_class: 2
    		},
    		n_prompts: 5,
    		pattern_size: 120,
    		prompts_url: "../../../../data/patterns/gpt2-small/prompts.jsonl",
    		patterns_path: "../../../../data/patterns/",
    		attnpedia_url: "ap.json",
    		headDistsnpy_url: "../../../../data/features/head_dists_raw/distances.npy",
    		headDistsmeta_url: "../../../../data/features/head_dists_raw/dists_meta.json",
    	};
    
    	if (INLINE_CONFIG) {
    		// If INLINE_CONFIG is set, merge it into the default config
    		deepMerge(default_cfg, INLINE_CONFIG);
    		console.log("Merged inline config overrides");
    	}
    
    	return default_cfg;
    }
    
    /**
     * Load config.json (if present) and merge into CONFIG.
     * Also parse URL parameters and apply them to CONFIG.
     * Priority: URL params > config.json > inline config > defaults
     * @returns {Promise<object>} resolved CONFIG object
     */
    async function getConfig() {
    	// Initialize with defaults
    	CONFIG = getDefaultConfig();
    
    	try {
    		// First, try to load config.json
    		const r = await fetch(CONFIG_FILE_PATH);
    		if (r.ok) {
    			const loaded = await r.json();
    			// Deep merge loaded config into CONFIG
    			deepMerge(CONFIG, loaded);
    			// Store a deep copy of the loaded config for URL comparison
    			LOADED_CONFIG = JSON.parse(JSON.stringify(CONFIG));
    			console.log("Loaded config.json");
    		} else {
    			console.warn("config.json not found, using defaults");
    			// If no config.json, use defaults for comparison
    			LOADED_CONFIG = JSON.parse(JSON.stringify(CONFIG));
    		}
    	} catch (e) {
    		// if the inline config is null, then failing to find config.json is fine
    		if (!INLINE_CONFIG) {
    			console.error("Config load error:", e);
    		} else {
    			console.warn("Failed to load config.json, but it's fine because an inline config was provided");
    		}
    		// On error, use defaults for comparison
    		LOADED_CONFIG = JSON.parse(JSON.stringify(CONFIG));
    	}
    
    	// Parse URL parameters and override CONFIG values (highest priority)
    	parseURLParams();
    
    	return CONFIG;
    }
    
    /**
     * Deep merge source object into target object
     * @param {object} target - Target object to merge into
     * @param {object} source - Source object to merge from
     */
    function deepMerge(target, source) {
    	for (const key in source) {
    		if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
    			if (!target[key]) target[key] = {};
    			deepMerge(target[key], source[key]);
    		} else {
    			target[key] = source[key];
    		}
    	}
    }
    
    /**
     * Parse URL parameters and update CONFIG
     * Supports nested paths like: ?theme=light&ui.showToolbar=false&performance.maxItems=2000
     * Also supports arrays like: ?data.sources=file1.json,file2.json,file3.json
     * @param {URLSearchParams} [params] - Optional URLSearchParams object, defaults to current URL
     */
    function parseURLParams(params = null) {
    	if (!params) {
    		params = new URLSearchParams(window.location.search);
    	}
    
    	for (const [key, value] of params) {
    		setNestedConfigValue(CONFIG, key, parseConfigValue(value));
    	}
    }
    
    /**
     * Set a nested configuration value using dot notation
     * Example: setNestedConfigValue(CONFIG, "ui.showToolbar", false)
     * @param {object} obj - Object to modify
     * @param {string} path - Dot-separated path
     * @param {any} value - Value to set
     */
    function setNestedConfigValue(obj, path, value) {
    	const keys = path.split('.');
    	let current = obj;
    
    	for (let i = 0; i < keys.length - 1; i++) {
    		const key = keys[i];
    		if (!(key in current) || typeof current[key] !== 'object') {
    			current[key] = {};
    		}
    		current = current[key];
    	}
    
    	const finalKey = keys[keys.length - 1];
    	current[finalKey] = value;
    	console.log(`URL param override: ${path} = ${value}`);
    }
    
    /**
     * Parse a string value from URL params into appropriate type
     * Handles arrays (comma-separated values), booleans, numbers, and strings
     * @param {string} value - String value from URL parameter
     * @returns {any} Parsed value
     */
    function parseConfigValue(value) {
    	// Boolean
    	if (value === 'true') return true;
    	if (value === 'false') return false;
    
    	// Array (comma-separated) - but handle single values too
    	if (value.includes(',')) {
    		return value.split(',').map(v => v.trim()).filter(v => v.length > 0);
    	}
    
    	// Number
    	if (!isNaN(value) && !isNaN(parseFloat(value))) {
    		return parseFloat(value);
    	}
    
    	// String (including hex colors, URLs, etc.)
    	return value;
    }
    
    /**
     * Update the URL with current CONFIG state
     * Debounced to avoid excessive URL updates
     * @param {number} [delay] - Debounce delay in milliseconds (uses global constant if not provided)
     */
    function updateURL(delay = URL_UPDATE_DEBOUNCE_DELAY) {
    	if (URL_UPDATE_TIMEOUT) {
    		clearTimeout(URL_UPDATE_TIMEOUT);
    	}
    
    	URL_UPDATE_TIMEOUT = setTimeout(() => {
    		const params = generateURLParams();
    		const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    		window.history.replaceState({}, '', newURL);
    		URL_UPDATE_TIMEOUT = null;
    	}, delay);
    }
    
    /**
     * Generate URL search params from current CONFIG state
     * Only includes values that differ from the loaded config (not defaults)
     * @returns {URLSearchParams} URL parameters representing config differences
     */
    function generateURLParams() {
    	if (!LOADED_CONFIG) {
    		// Fallback to default config if loaded config not available
    		return new URLSearchParams();
    	}
    
    	const params = new URLSearchParams();
    	const differences = findConfigDifferences(CONFIG, LOADED_CONFIG);
    
    	for (const [path, value] of differences) {
    		// Skip certain fields that shouldn't be in URLs
    		if (shouldSkipInURL(path)) {
    			continue;
    		}
    
    		// Special handling for arrays
    		if (Array.isArray(value)) {
    			if (value.length > 0) {
    				params.set(path, value.join(','));
    			}
    		} else {
    			params.set(path, value.toString());
    		}
    	}
    
    	return params;
    }
    
    /**
     * Check if a config path should be skipped when generating URL parameters
     * @param {string} path - Config path (dot notation)
     * @returns {boolean} True if should be skipped
     */
    function shouldSkipInURL(path) {
    	return URL_SKIP_PATHS.some(skipPath => path.startsWith(skipPath));
    }
    
    /**
     * Find differences between current config and loaded config
     * Returns array of [path, value] tuples
     * Uses epsilon comparison for floats
     * @param {object} current - Current configuration
     * @param {object} base - Base configuration to compare against
     * @param {string} [prefix=''] - Current path prefix
     * @returns {Array<[string, any]>} Array of [path, value] differences
     */
    function findConfigDifferences(current, base, prefix = '') {
    	const differences = [];
    
    	for (const key in current) {
    		// Skip certain keys that shouldn't be compared
    		if (shouldSkipInComparison(key)) {
    			continue;
    		}
    
    		const currentPath = prefix ? `${prefix}.${key}` : key;
    		const currentValue = current[key];
    		const baseValue = base[key];
    
    		if (Array.isArray(currentValue)) {
    			// Special handling for arrays
    			if (!Array.isArray(baseValue) || !arraysEqual(currentValue, baseValue)) {
    				differences.push([currentPath, currentValue]);
    			}
    		} else if (typeof currentValue === 'object' && currentValue !== null) {
    			if (typeof baseValue === 'object' && !Array.isArray(baseValue) && baseValue !== null) {
    				differences.push(...findConfigDifferences(currentValue, baseValue, currentPath));
    			} else {
    				// Base doesn't have this object, include all of current
    				differences.push([currentPath, JSON.stringify(currentValue)]);
    			}
    		} else {
    			// Compare primitive values with epsilon for floats
    			let valuesEqual = false;
    
    			if (typeof currentValue === 'number' && typeof baseValue === 'number') {
    				// Use epsilon comparison for floats
    				valuesEqual = Math.abs(currentValue - baseValue) < FLOAT_COMPARISON_EPSILON;
    			} else {
    				// Direct comparison for other types
    				valuesEqual = currentValue === baseValue;
    			}
    
    			if (!valuesEqual) {
    				differences.push([currentPath, currentValue]);
    			}
    		}
    	}
    
    	return differences;
    }
    
    /**
     * Check if a config key should be skipped during comparison
     * @param {string} key - Configuration key
     * @returns {boolean} True if should be skipped
     */
    function shouldSkipInComparison(key) {
    	return COMPARISON_SKIP_KEYS.includes(key);
    }
    
    /**
     * Helper function to compare arrays for equality
     * @param {Array} arr1 - First array
     * @param {Array} arr2 - Second array
     * @returns {boolean} True if arrays are equal
     */
    function arraysEqual(arr1, arr2) {
    	if (arr1.length !== arr2.length) return false;
    	for (let i = 0; i < arr1.length; i++) {
    		if (arr1[i] !== arr2[i]) return false;
    	}
    	return true;
    }
    
    /**
     * Get the current configuration as a formatted JSON string
     * @param {number} [indent=2] - JSON indentation spaces
     * @returns {string} Formatted JSON configuration
     */
    function getConfigAsJSON(indent = 2) {
    	return JSON.stringify(CONFIG, null, indent);
    }
    
    /**
     * Export current configuration to a new browser tab
     * Creates a downloadable JSON file with current config
     */
    function exportConfigToNewTab() {
    	const configText = getConfigAsJSON();
    	const blob = new Blob([configText], { type: 'application/json' });
    	const url = URL.createObjectURL(blob);
    	const newWindow = window.open(url, '_blank');
    
    	// Clean up the object URL after a delay
    	setTimeout(() => {
    		URL.revokeObjectURL(url);
    	}, 1000);
    }
    
    /**
     * Reset CONFIG to the loaded config.json state and clear URL parameters
     * Useful for reverting all changes back to the original loaded state
     */
    function resetConfigToLoaded() {
    	if (!LOADED_CONFIG) {
    		console.warn("No loaded config available, resetting to defaults");
    		CONFIG = getDefaultConfig();
    	} else {
    		// Deep copy the loaded config back to CONFIG
    		CONFIG = JSON.parse(JSON.stringify(LOADED_CONFIG));
    	}
    
    	// Clear URL parameters by navigating to clean URL
    	const cleanURL = window.location.pathname;
    	window.history.replaceState({}, '', cleanURL);
    
    	// Clear the URL update timeout if it exists
    	if (URL_UPDATE_TIMEOUT) {
    		clearTimeout(URL_UPDATE_TIMEOUT);
    		URL_UPDATE_TIMEOUT = null;
    	}
    
    	console.log("Config reset to loaded state and URL cleared");
    }
    
    /**
     * Get a nested configuration value using dot notation
     * Example: getConfigValue("ui.showToolbar")
     * @param {string} path - Dot-separated path to config value
     * @param {any} [defaultValue] - Default value if path doesn't exist
     * @returns {any} Configuration value or default
     */
    function getConfigValue(path, defaultValue = undefined) {
    	const keys = path.split('.');
    	let current = CONFIG;
    
    	for (const key of keys) {
    		if (current && typeof current === 'object' && key in current) {
    			current = current[key];
    		} else {
    			return defaultValue;
    		}
    	}
    
    	return current;
    }
    
    /**
     * Set a nested configuration value and optionally update URL
     * Example: setConfigValue("theme", "light", true)
     * @param {string} path - Dot-separated path to config value
     * @param {any} value - Value to set
     * @param {boolean} [updateUrl=true] - Whether to update URL parameters
     */
    function setConfigValue(path, value, updateUrl = true) {
    	setNestedConfigValue(CONFIG, path, value);
    
    	if (updateUrl) {
    		updateURL();
    	}
    }
    
    /**
     * Initialize the configuration system
     * Call this once when your application starts
     * @returns {Promise<object>} Resolved configuration object
     */
    async function initConfig() {
    	try {
    		return await getConfig();
    	} catch (error) {
    		console.error("Failed to initialize configuration:", error);
    		// Fallback to defaults
    		CONFIG = getDefaultConfig();
    		LOADED_CONFIG = JSON.parse(JSON.stringify(CONFIG));
    		return CONFIG;
    	}
    }
    </script>

    <script>
    /* notif.js - Standalone notification system */
    class NotificationManager {
        constructor(options = {}) {
            // Timeout settings
            this.defaultTimeout = options.defaultTimeout || 4000;
            this.successTimeout = options.successTimeout || 2000;
            this.fadeTimeout = options.fadeTimeout || 300;
    
            // Layout settings
            this.topOffset = options.topOffset || 20;
            this.spacing = options.spacing || 60;
            this.slideOffset = options.slideOffset || -20;
    
            this.notifications = new Map(); // Map of id -> notification data
            this.nextId = 0;
            this.container = null;
            this.isReady = false;
    
            // Initialize when DOM is ready
            this._initWhenReady();
        }
    
        _initWhenReady() {
            if (document.body) {
                this._createContainer();
                this.isReady = true;
            } else if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    this._createContainer();
                    this.isReady = true;
                });
            } else {
                // DOM is ready but body might not be parsed yet
                setTimeout(() => this._initWhenReady(), 10);
            }
        }
    
        _createContainer() {
            if (this.container) return; // Already created
    
            this.container = document.createElement('div');
            this.container.className = 'notification-container';
            document.body.appendChild(this.container);
        }
    
        _ensureReady() {
            if (!this.isReady) {
                console.warn('NotificationManager not ready yet, initializing synchronously');
                this._createContainer();
                this.isReady = true;
            }
        }
    
        _createNotificationElement(id, type, message) {
            this._ensureReady();
    
            const element = document.createElement('div');
            element.className = `notification-indicator visible ${type}`;
            element.dataset.id = id;
    
            if (type === 'spinner') {
                element.innerHTML = `
                    <span class="notification-spinner"></span>
                    <span class="notification-text">${message}</span>
                `;
            } else if (type === 'pbar') {
                element.innerHTML = `
                    <div class="notification-text">${message}</div>
                    <div class="notification-progress-container">
                        <div class="notification-progress-bar" style="width: 0%"></div>
                    </div>
                `;
            } else {
                element.innerHTML = `
                    <span class="notification-text">${message}</span>
                `;
            }
    
            this.container.appendChild(element);
            this._updatePositions();
            return element;
        }
    
        _updatePositions() {
            if (!this.container) return;
    
            const notifications = Array.from(this.container.children);
            notifications.forEach((el, index) => {
                el.style.top = `${this.topOffset + index * this.spacing}px`;
            });
        }
    
        _removeNotification(id) {
            const notifData = this.notifications.get(id);
            if (!notifData) return;
    
            // Clear timeout if exists
            if (notifData.timeout) {
                clearTimeout(notifData.timeout);
            }
    
            // Remove element with fade animation
            notifData.element.style.opacity = '0';
            notifData.element.style.transform = `translateX(-50%) translateY(${this.slideOffset}px)`;
    
            setTimeout(() => {
                if (notifData.element.parentNode) {
                    notifData.element.parentNode.removeChild(notifData.element);
                }
                this.notifications.delete(id);
                this._updatePositions();
            }, this.fadeTimeout);
        }
    
        /**
         * Show a regular notification message
         * @param {string} message - Message to display
         * @param {number} timeout - Auto-hide timeout in ms (default from constructor)
         */
        show(message, timeout = null) {
            console.log(message);
    
            const id = this.nextId++;
            const element = this._createNotificationElement(id, 'show', message);
    
            const hideTimeout = timeout || this.defaultTimeout;
            const timeoutId = setTimeout(() => {
                this._removeNotification(id);
            }, hideTimeout);
    
            this.notifications.set(id, {
                element,
                type: 'show',
                timeout: timeoutId
            });
        }
    
        /**
         * Show a persistent spinner with message
         * @param {string} message - Loading message to display
         * @returns {object} Spinner control object with .complete() method
         */
        spinner(message) {
            console.log(message);
    
            const id = this.nextId++;
            const element = this._createNotificationElement(id, 'spinner', message);
    
            this.notifications.set(id, {
                element,
                type: 'spinner',
                timeout: null
            });
    
            return {
                complete: () => {
                    this._removeNotification(id);
                }
            };
        }
    
        /**
         * Show a persistent progress bar with message
         * @param {string} message - Loading message to display
         * @returns {object} Progress bar control object with .progress(value) method
         */
        pbar(message) {
            console.log(message);
    
            const id = this.nextId++;
            const element = this._createNotificationElement(id, 'pbar', message);
    
            this.notifications.set(id, {
                element,
                type: 'pbar',
                timeout: null
            });
    
            return {
                progress: (value) => {
                    const progressBar = element.querySelector('.notification-progress-bar');
                    if (progressBar) {
                        const percentage = Math.max(0, Math.min(100, value * 100));
                        progressBar.style.width = `${percentage}%`;
                    }
                },
                complete: () => {
                    this._removeNotification(id);
                }
            };
        }
    
        /**
         * Show success message
         * @param {string} message - Success message
         * @param {number} timeout - Auto-hide timeout in ms (default from constructor)
         */
        success(message, timeout = null) {
            console.log(message);
    
            const id = this.nextId++;
            const element = this._createNotificationElement(id, 'success', message);
    
            const hideTimeout = timeout || this.successTimeout;
            const timeoutId = setTimeout(() => {
                this._removeNotification(id);
            }, hideTimeout);
    
            this.notifications.set(id, {
                element,
                type: 'success',
                timeout: timeoutId
            });
        }
    
        /**
         * Show error message
         * @param {string} message - Error message
         * @param {Error} err - Error object to log
         * @param {number} timeout - Auto-hide timeout in ms (default from constructor)
         */
        error(message, err = null, timeout = null) {
            if (err) {
                console.error(err);
            } else {
                console.error(message);
            }
    
            const id = this.nextId++;
            const element = this._createNotificationElement(id, 'error', message);
    
            const hideTimeout = timeout || this.defaultTimeout;
            const timeoutId = setTimeout(() => {
                this._removeNotification(id);
            }, hideTimeout);
    
            this.notifications.set(id, {
                element,
                type: 'error',
                timeout: timeoutId
            });
        }
    
        /**
         * Hide all notifications
         */
        clear() {
            for (const [id] of this.notifications) {
                this._removeNotification(id);
            }
        }
    }
    
    // Initialize global instance when DOM is ready
    let NOTIF;
    
    // Initialize immediately if DOM is already ready, otherwise wait
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            NOTIF = new NotificationManager();
        });
    } else {
        // DOM already loaded
        NOTIF = new NotificationManager();
    }
    </script>

    // ------------------------------------------------------------
    // this file has been modified from original code at:

    // https://github.com/aplbrain/npyjs/blob/b0cd99b7f4c2bff791b4977e16dec3478519920b/LICENSE
    // removed float16 support for brevity -- we don't need it
    // ------------------------------------------------------------
    class npyjs {
    
    	constructor() {
    		this.dtypes = {
    			"<u1": {
    				name: "uint8",
    				size: 8,
    				arrayConstructor: Uint8Array,
    			},
    			"|u1": {
    				name: "uint8",
    				size: 8,
    				arrayConstructor: Uint8Array,
    			},
    			"<u2": {
    				name: "uint16",
    				size: 16,
    				arrayConstructor: Uint16Array,
    			},
    			"|i1": {
    				name: "int8",
    				size: 8,
    				arrayConstructor: Int8Array,
    			},
    			"<i2": {
    				name: "int16",
    				size: 16,
    				arrayConstructor: Int16Array,
    			},
    			"<u4": {
    				name: "uint32",
    				size: 32,
    				arrayConstructor: Uint32Array,
    			},
    			"<i4": {
    				name: "int32",
    				size: 32,
    				arrayConstructor: Int32Array,
    			},
    			"<u8": {
    				name: "uint64",
    				size: 64,
    				arrayConstructor: BigUint64Array,
    			},
    			"<i8": {
    				name: "int64",
    				size: 64,
    				arrayConstructor: BigInt64Array,
    			},
    			"<f4": {
    				name: "float32",
    				size: 32,
    				arrayConstructor: Float32Array
    			},
    			"<f8": {
    				name: "float64",
    				size: 64,
    				arrayConstructor: Float64Array
    			},
    			// "<f2": {
    			//     name: "float16",
    			//     size: 16,
    			//     arrayConstructor: Uint16Array,
    			//     converter: this.convertFloat16 ? this.float16ToFloat32Array : undefined
    			// },
    		};
    	}
    
    	parse(arrayBufferContents) {
    		// const version = arrayBufferContents.slice(6, 8); // Uint8-encoded
    		const headerLength = new DataView(arrayBufferContents.slice(8, 10)).getUint8(0);
    		const offsetBytes = 10 + headerLength;
    
    		const hcontents = new TextDecoder("utf-8").decode(
    			new Uint8Array(arrayBufferContents.slice(10, 10 + headerLength))
    		);
    		const header = JSON.parse(
    			hcontents
    				.toLowerCase() // True -> true
    				.replace(/'/g, '"')
    				.replace("(", "[")
    				.replace(/,*\),*/g, "]")
    		);
    		const shape = header.shape;
    		const dtype = this.dtypes[header.descr];
    
    		if (!dtype) {
    			console.error(`Unsupported dtype: ${header.descr}`);
    			return null;
    		}
    
    		const nums = new dtype.arrayConstructor(
    			arrayBufferContents,
    			offsetBytes
    		);
    
    		// Convert float16 to float32 if converter exists
    		const data = dtype.converter ? dtype.converter.call(this, nums) : nums;
    
    		return {
    			dtype: dtype.name,
    			data: data,
    			shape,
    			fortranOrder: header.fortran_order
    		};
    	}
    
    	async load(filename, callback, fetchArgs) {
    		/*
    		Loads an array from a stream of bytes.
    		*/
    		fetchArgs = fetchArgs || {};
    		let arrayBuf;
    		// If filename is ArrayBuffer
    		if (filename instanceof ArrayBuffer) {
    			arrayBuf = filename;
    		}
    		// If filename is a file path
    		else {
    			const resp = await fetch(filename, { ...fetchArgs });
    			arrayBuf = await resp.arrayBuffer();
    		}
    		const result = this.parse(arrayBuf);
    		if (callback) {
    			return callback(result);
    		}
    		return result;
    	}
    }
    
    
    class NDArray {
    	/**
    	 * Creates a multidimensional array similar to NumPy arrays
    	 * 
    	 * @param {any} data - The array data
    	 * @param {Array<number>} shape - The shape of the array
    	 * @param {string} dtype - The data type of the array
    	 */
    	constructor(data, shape, dtype) {
    		this.data = data;
    		this.shape = shape;
    		this.dtype = dtype;
    		this.ndim = shape.length;
    
    		// Calculate total size from shape
    		this._size = shape.reduce((acc, dim) => acc * dim, 1);
    
    		// Validate data length matches shape
    		if (data.length !== this._size) {
    			throw new Error(`Data length ${data.length} doesn't match shape ${shape} (expected ${this._size})`);
    		}
    	}
    
    	/**
    	 * Converts multidimensional indices to flat index
    	 * 
    	 * @param {Array<number|null>} indices - Array of indices, can contain null for slicing
    	 * @returns {number|Array<number>} - Flat index or array of indices for slicing
    	 * @private
    	 */
    	_getIndices(indices) {
    		// Handle case where all dimensions are requested (no indices)
    		if (indices.length === 0) {
    			return [...Array(this._size).keys()];
    		}
    
    		// Check that we don't have too many indices
    		if (indices.filter(idx => idx !== null).length > this.shape.length) {
    			throw new Error(`Too many indices for array with shape ${this.shape}`);
    		}
    
    		// If we have exact indices (no nulls), calculate flat index
    		if (!indices.includes(null) && indices.length === this.shape.length) {
    			// Validate all indices
    			for (let i = 0; i < indices.length; i++) {
    				if (indices[i] < 0) {
    					indices[i] = this.shape[i] + indices[i]; // Handle negative indices like numpy
    				}
    
    				if (indices[i] < 0 || indices[i] >= this.shape[i]) {
    					throw new Error(`Index ${indices[i]} is out of bounds for axis ${i} with size ${this.shape[i]}`);
    				}
    			}
    
    			// Calculate flat index using strides
    			let flatIndex = 0;
    			let stride = 1;
    
    			for (let i = this.shape.length - 1; i >= 0; i--) {
    				flatIndex += indices[i] * stride;
    				stride *= this.shape[i];
    			}
    
    			return flatIndex;
    		}
    
    		// Handle slicing (when some indices are null)
    		// This returns all flat indices that match the specified dimensions
    		const resultIndices = [];
    		const completeIndices = [...indices];
    
    		// Fill in missing indices with zeros
    		while (completeIndices.length < this.shape.length) {
    			completeIndices.push(0);
    		}
    
    		// Find which dimensions need to be iterated over (those with null)
    		const dimToIterate = [];
    		for (let i = 0; i < this.shape.length; i++) {
    			if (i >= indices.length || indices[i] === null) {
    				dimToIterate.push(i);
    			}
    		}
    
    		// Generate all combinations of indices for the dimensions to iterate over
    		const generateIndices = (currentDim, currentIndices) => {
    			if (currentDim >= dimToIterate.length) {
    				// Calculate flat index for this combination
    				let flatIndex = 0;
    				let stride = 1;
    
    				for (let i = this.shape.length - 1; i >= 0; i--) {
    					flatIndex += currentIndices[i] * stride;
    					stride *= this.shape[i];
    				}
    
    				resultIndices.push(flatIndex);
    				return;
    			}
    
    			const dim = dimToIterate[currentDim];
    			for (let i = 0; i < this.shape[dim]; i++) {
    				currentIndices[dim] = i;
    				generateIndices(currentDim + 1, currentIndices);
    			}
    		};
    
    		generateIndices(0, completeIndices);
    		return resultIndices;
    	}
    
    	/**
    	 * Gets values at specified indices
    	 * 
    	 * @param {...(number|null)} args - Indices for each dimension, null for full dimension
    	 * @returns {any} - Value or subarray at the specified location
    	 */
    	get(...args) {
    		// Handle case where args is array
    		let indices = args;
    		if (args.length === 1 && Array.isArray(args[0])) {
    			indices = args[0];
    		}
    
    		const flatIndices = this._getIndices(indices);
    
    		// If we got a single index, return the single value
    		if (typeof flatIndices === 'number') {
    			return this.data[flatIndices];
    		}
    
    		// Otherwise, create a new array with the values
    		// We need to calculate the shape of the result
    		const resultShape = [];
    		for (let i = 0; i < this.shape.length; i++) {
    			if (i >= indices.length || indices[i] === null) {
    				resultShape.push(this.shape[i]);
    			}
    		}
    
    		// If result is empty, it means we want the entire array
    		if (resultShape.length === 0) {
    			return this;
    		}
    
    		// Create new data array with the values at the flat indices
    		const resultData = new this.data.constructor(flatIndices.length);
    		for (let i = 0; i < flatIndices.length; i++) {
    			resultData[i] = this.data[flatIndices[i]];
    		}
    
    		return new NDArray(resultData, resultShape, this.dtype);
    	}
    
    	/**
    	 * Sets values at specified indices
    	 * 
    	 * @param {...*} args - Indices followed by value to set
    	 */
    	set(...args) {
    		// Handle case where args is array
    		let indices, value;
    		if (args.length === 2 && Array.isArray(args[0])) {
    			indices = args[0];
    			value = args[1];
    		} else {
    			value = args[args.length - 1];
    			indices = args.slice(0, args.length - 1);
    		}
    
    		const flatIndices = this._getIndices(indices);
    
    		// If we got a single index, set the single value
    		if (typeof flatIndices === 'number') {
    			this.data[flatIndices] = value;
    			return;
    		}
    
    		// Otherwise, set all indices to the value
    		// If value is an array, distribute its values
    		if (Array.isArray(value) || (value instanceof NDArray)) {
    			const valueArray = value instanceof NDArray ? value.data : value;
    			if (valueArray.length !== flatIndices.length) {
    				throw new Error(`Cannot broadcast ${valueArray.length} values to ${flatIndices.length} indices`);
    			}
    
    			for (let i = 0; i < flatIndices.length; i++) {
    				this.data[flatIndices[i]] = valueArray[i];
    			}
    		} else {
    			// Set all indices to the same value
    			for (const idx of flatIndices) {
    				this.data[idx] = value;
    			}
    		}
    	}
    
    	/**
    	 * Returns a string representation of the array
    	 * 
    	 * @returns {string} String representation of the array
    	 */
    	toString() {
    		// Simple representation for 1D arrays
    		if (this.shape.length === 1) {
    			return `[${Array.from(this.data).join(', ')}]`;
    		}
    
    		// For higher dimensions, we'll just show shape and type
    		return `NDArray(${this.shape.join('X')}, ${this.dtype})`;
    	}
    
    	static parse(arrayBufferContents) {
    		const npy = new npyjs();
    		const npyData = npy.parse(arrayBufferContents);
    		if (!npyData) {
    			throw new Error('Failed to parse NPY data');
    		}
    		// Convert data to NDArray
    		return new NDArray(npyData.data, npyData.shape, npyData.dtype);
    	}
    
    	static async load(filename, callback, fetchArgs) {
    		const npy = new npyjs();
    		const npyData = await npy.load(filename, null, fetchArgs);
    		if (!npyData) {
    			throw new Error('Failed to load NPY data');
    		}
    		// Convert data to NDArray
    		return new NDArray(npyData.data, npyData.shape, npyData.dtype);
    	}
    }

    <script>
    const ATTNPEDIA_URL = CONFIG.attnpedia_url;

    		else {
    			return [];

    	async get_type_meta(type) {

    <script>
    const HEADDISTSNPY_URL = CONFIG.headDistsnpy_url;
    const HEADDISTSMETA_URL = CONFIG.headDistsmeta_url;
    // TODO: fallback to getting from github?
    // || "https://raw.githubusercontent.com/<TODO>";
    
    async function _load_dists_meta(path_meta = HEADDISTSMETA_URL) {
    	const r = await fetch(path_meta);
    	if (r.ok) {
    		const loaded = await r.json();
    		return loaded;
    	} else {
    		throw new Error(`Failed to load head embeddings data from ${path_meta}`);
    	}
    }
    
    async function _load_dists_npy(path_npy = HEADDISTSNPY_URL) {
    	return NDArray.load(path_npy);
    }
    
    
    class HeadDistances {
    	constructor() {
    		this._is_loaded = false;
    		this.head_dists_meta = null;
    		this.head_dists_arr = null;
    		this._ensureLoaded();
    	}
    
    	async _ensureLoaded() {
    		if (!this._is_loaded) {
    			this.head_dists_meta = await _load_dists_meta();
    			this.head_dists_arr = await _load_dists_npy();
    			this._is_loaded = true;
    		}
    	}
    
    	async get_head_loc() {
    		await this._ensureLoaded();
    	}
    
    	get_head_idx(head_name) {
    		const idx = this.head_dists_meta.cls_values.indexOf(head_name);
    		if (idx === -1) {
    			throw new Error(`Head not found: ${head_name}`);
    		}
    		return idx;
    	}
    
    	get_head_name(head_idx) {
    		if (head_idx < 0 || head_idx >= this.head_dists_meta.cls_values.length) {
    			throw new Error(`Invalid head index: ${head_idx}`);
    		}
    		return this.head_dists_meta.cls_values[head_idx];
    	}
    
    	async getNearestHeads(head_name, n = 5) {
    		await this._ensureLoaded();
    		
    		const head_idx = this.get_head_idx(head_name);
    		const distanceRow = this.head_dists_arr.get(head_idx);
    		const distanceArray = Array.from(distanceRow.data);
    		
    		// Sort distances and get indices of n nearest (excluding self)
    		const indexed_dists = Array.from(distanceArray, (dist, idx) => ({ dist, idx }));
    		indexed_dists.sort((a, b) => a.dist - b.dist);
    		const best_n_items = indexed_dists.slice(1, n + 1);
    		
    		return {
    			head_names: best_n_items.map(item => this.get_head_name(item.idx)),
    			distances: best_n_items.map(item => item.dist)
    		};
    	}
    
    	async getHeadDistance(head_name1, head_name2) {
    		await this._ensureLoaded();
    		const head_idx1 = this.get_head_idx(head_name1);
    		const head_idx2 = this.get_head_idx(head_name2);
    		
    		const distanceRow = this.head_dists_arr.get(head_idx1);
    		return distanceRow.data[head_idx2];
    	}
    
    	async getHeadDistances(head_name, head_names_list) {
    		await this._ensureLoaded();
    		const head_idx = this.get_head_idx(head_name);
    		const distanceRow = this.head_dists_arr.get(head_idx);
    		const distanceArray = Array.from(distanceRow.data);
    		
    		return head_names_list.map(target_head => {
    			const target_idx = this.get_head_idx(target_head);
    			const distance = distanceArray[target_idx];
    			return {
    				head_name: target_head,
    				distance: distance
    			};
    		});
    	}
    }
    </script>
    <!-- end 'head_embeds.js' -->
        <!-- begin 'prompts.js' -->
    <script>
    const PROMPTS_URL = CONFIG.prompts_url;
    
    async function load_prompts(path = PROMPTS_URL) {
    	const r = await fetch(path);
    	if (r.ok) {
    		const text = await r.text();
    		const lines = text.trim().split('\n');
    		const prompts = [];
    		
    		for (const line of lines) {
    			if (line.trim()) {
    				try {
    					const prompt = JSON.parse(line);
    					prompts.push(prompt);
    				} catch (e) {
    					console.warn('Failed to parse prompt line:', line, e);
    				}
    			}
    		}
    		
    		return prompts;
    	} else {
    		throw new Error(`Failed to load prompts data from ${path}`);
    	}
    }
    
    class PromptsLoader {
    	constructor() {
    		this._data = null;
    		this._loaded = false;
    	}
    
    	async _ensureLoaded() {
    		if (!this._loaded) {
    			this._data = await load_prompts();
    			this._loaded = true;
    		}
    	}
    
    	async getPrompts() {
    		await this._ensureLoaded();
    		return this._data || [];
    	}
    
    	async getPromptByHash(hash) {
    		await this._ensureLoaded();
    		return this._data?.find(prompt => prompt.hash === hash) || null;
    	}
    
    	async getPromptHashes() {
    		await this._ensureLoaded();
    		return this._data?.map(prompt => prompt.hash) || [];
    	}
    }
    </script>
    <!-- end 'prompts.js' -->

    <script>
    class HeadInfo {
        constructor(id, model, layer, head) {
            this.id = id;
            this.model = model;
            this.layer = layer;
            this.head = head;
            this.classifications = [];
        }
    
        static from_id(id) {
            // split by ":", should have 3 components
            // `{model}:L{layer}:H{head}`
            const parts = id.split(':');
            if (parts.length !== 3) {
                throw new Error(`Invalid id format: ${id}. Expected format: {model}:L{layer}:H{head}`);
            }
            const [model, layerPart, headPart] = parts;
            if (!layerPart.startsWith('L')) {
                throw new Error(`Invalid layer format: ${layerPart}. Expected format: L{number}`);
            }
            if (!headPart.startsWith('H')) {
                throw new Error(`Invalid head format: ${headPart}. Expected format: H{number}`);
            }
            const layer = parseInt(layerPart.slice(1), 10);
            const head = parseInt(headPart.slice(1), 10);
            if (isNaN(layer) || isNaN(head)) {
                throw new Error(`Invalid numeric values in id: ${id}`);
            }
            return new HeadInfo(id, model, layer, head);
        }
    
        async get_pattern_url(promptHash) {
            return `${this.model}/prompts/${promptHash}/L${this.layer}/H${this.head}/attn.png`;
        }
    }
    </script>

        <!-- begin 'app.js' -->
    <script>
    document.addEventListener('alpine:init', () => {
    	Alpine.data('attentionApp', () => ({
    		loading: true,
    		error: null,
    		prompts: [],
    		heads_display: [],
    		heads_display_with_distances: [],
    		current_head: null,
    		
    		// Error tracking for aggregated notifications
    		failureTracker: {
    			patterns: { failed: 0, total: 0 },
    			classifications: { failed: 0, total: 0 }
    		},
    
    		async init() {
    			try {
    				this.attention_pedia = new AttentionPedia();
    				this.head_distances = new HeadDistances();
    				this.prompts_loader = new PromptsLoader();
    				const allPrompts = await this.prompts_loader.getPrompts();
    				const n_prompts = CONFIG.n_prompts || 10;
    				this.prompts = allPrompts.slice(0, n_prompts);
    				this.heads_display = CONFIG.heads_display;
    				this.current_head = CONFIG.head_viewing;
    				
    				// Debug logging
    				console.log('Patterns we are looking at:', this.prompts.map(p => p.hash));
    				console.log('Current head viewing:', this.current_head);
    				console.log('Heads display config:', this.heads_display);
    				this.promptTooltip = null;
    				
    				// Set pattern size CSS variable
    				const patternSize = CONFIG.pattern_size || 120;
    				document.documentElement.style.setProperty('--pattern-size', `${patternSize}px`);
    				
    				await this.updateHeadsWithDistances();
    				this.loading = false;
    				
    				// Check for aggregated errors after a short delay to let components load
    				setTimeout(() => {
    					this.showAggregatedErrors();
    					this.resetFailureTracker();
    				}, 2000);
    			} catch (error) {
    				NOTIF.error('Failed to initialize application data', error);
    				this.loading = false;
    				this.error = error.message;
    			}
    		},
    
    		async updateHeadsWithDistances() {
    			if (!this.current_head) {
    				console.log('No current head set, table will be empty');
    				this.heads_display_with_distances = [];
    				return;
    			}
    
    			// If heads_display is explicitly set, use it
    			if (this.heads_display && Array.isArray(this.heads_display)) {
    				const headsWithDistances = await this.head_distances.getHeadDistances(this.current_head, this.heads_display);
    				const maxDistance = Math.max(...headsWithDistances.map(h => h.distance || 0));
    				
    				// Get current head classifications for matching
    				const currentHeadClassifications = await this.attention_pedia.get_head_types(this.current_head);
    				
    				// Build the entire array at once instead of pushing items
    				const newHeadsArray = [];
    				for (const item of headsWithDistances.sort((a, b) => (a.distance || 0) - (b.distance || 0))) {
    					const distance = item.distance !== undefined ? item.distance : 0;
    					
    					// Check if this head has matching classifications
    					const headClassifications = await this.attention_pedia.get_head_types(item.head_name);
    					const hasMatchingClassification = headClassifications.some(cls => 
    						currentHeadClassifications.includes(cls)
    					);
    					
    					newHeadsArray.push({
    						headId: item.head_name,
    						distance: distance,
    						distanceText: distance === 0 ? 'Current' : distance.toFixed(3),
    						distanceColor: this.getDistanceColor(distance, maxDistance),
    						hasMatchingClassification: hasMatchingClassification && item.head_name !== this.current_head,
    						isGap: false
    					});
    				}
    				
    				// Assign the complete array at once to trigger Alpine.js reactivity
    				this.heads_display_with_distances = newHeadsArray;
    				console.log('Final heads list (explicit config):', this.heads_display_with_distances.map(h => h.headId || 'GAP'));
    				return;
    			}
    
    			// Auto-populate table with current head + nearby + same class heads
    			const headsToShow = new Set();
    			headsToShow.add(this.current_head);
    
    			// Add nearest heads
    			const n_nearby = CONFIG.table?.n_nearby || 3;
    			const nearestHeads = await this.head_distances.getNearestHeads(this.current_head, n_nearby);
    			nearestHeads.head_names.forEach(head => headsToShow.add(head));
    
    			// Get all heads with distances to identify gaps
    			const allHeadsWithDistances = await this.head_distances.getHeadDistances(this.current_head, Array.from(headsToShow));
    			const sortedByDistance = allHeadsWithDistances.sort((a, b) => a.distance - b.distance);
    
    			// Add same class heads and track where they fit in distance order
    			const n_share_class = CONFIG.table?.n_share_class || 2;
    			const currentHeadTypes = await this.attention_pedia.get_head_types(this.current_head);
    			const sameClassHeads = new Set();
    			
    			for (const type of currentHeadTypes) {
    				const sameTypeHeads = await this.attention_pedia.get_type_heads(type);
    				sameTypeHeads.slice(0, n_share_class).forEach(head => {
    					if (!headsToShow.has(head)) {
    						headsToShow.add(head);
    						sameClassHeads.add(head);
    					}
    				});
    			}
    
    			const finalHeadsWithDistances = await this.head_distances.getHeadDistances(this.current_head, Array.from(headsToShow));
    
    			// Create ordered list with gap indicators
    			const sortedFinal = finalHeadsWithDistances.sort((a, b) => a.distance - b.distance);
    			const rowsWithGaps = this.insertGapRows(sortedFinal, nearestHeads, sameClassHeads);
    
    			const maxDistance = Math.max(...finalHeadsWithDistances.map(h => h.distance || 0));
    
    			// Get current head classifications for matching
    			const currentHeadClassifications = await this.attention_pedia.get_head_types(this.current_head);
    			
    			// Build the entire array at once instead of pushing items
    			const newHeadsArray = [];
    			for (const item of rowsWithGaps) {
    				if (item.isGap) {
    					// Add gap row
    					newHeadsArray.push({
    						isGap: true,
    						gapCount: item.gapCount,
    						nextDistance: item.nextDistance,
    						expandable: true,
    						expanded: false
    					});
    				} else {
    					const distance = item.distance !== undefined ? item.distance : 0;
    					
    					// Check if this head has matching classifications
    					const headClassifications = await this.attention_pedia.get_head_types(item.head_name);
    					const hasMatchingClassification = headClassifications.some(cls => 
    						currentHeadClassifications.includes(cls)
    					);
    					
    					newHeadsArray.push({
    						headId: item.head_name,
    						distance: distance,
    						distanceText: distance === 0 ? 'Current' : distance.toFixed(3),
    						distanceColor: this.getDistanceColor(distance, maxDistance),
    						hasMatchingClassification: hasMatchingClassification && item.head_name !== this.current_head,
    						isGap: false
    					});
    				}
    			}
    			
    			// Assign the complete array at once to trigger Alpine.js reactivity
    			this.heads_display_with_distances = newHeadsArray;
    			console.log('Final heads list (auto-populated):', this.heads_display_with_distances.map(h => h.headId || 'GAP'));
    			console.log('Full heads_display_with_distances structure:', this.heads_display_with_distances);
    			console.log('Number of items in heads_display_with_distances:', this.heads_display_with_distances.length);
    			console.log('First few items detailed:', this.heads_display_with_distances.slice(0, 3));
    			console.log('First item properties:', JSON.stringify(this.heads_display_with_distances[0], null, 2));
    			console.log('Is first item a gap?', this.heads_display_with_distances[0].isGap);
    			console.log('Loading state:', this.loading);
    			console.log('All items isGap status:', this.heads_display_with_distances.map((item, i) => `${i}: ${item.isGap} (${item.headId || 'GAP'})`));
    			
    			// Force Alpine.js reactivity update
    			this.$nextTick(() => {
    				console.log('After $nextTick, length:', this.heads_display_with_distances.length);
    			});
    		},
    
    		insertGapRows(sortedHeads, nearestHeads, sameClassHeads) {
    			const result = [];
    			let lastNearbyIndex = -1;
    			
    			// Find the last index of nearby heads in the sorted list
    			for (let i = 0; i < sortedHeads.length; i++) {
    				if (nearestHeads.head_names.includes(sortedHeads[i].head_name) || sortedHeads[i].head_name === this.current_head) {
    					lastNearbyIndex = i;
    				}
    			}
    			
    			// Add all heads up to and including the last nearby head
    			for (let i = 0; i <= lastNearbyIndex; i++) {
    				result.push(sortedHeads[i]);
    			}
    			
    			// Check for gaps when adding same-class heads
    			let nextNearbyIndex = lastNearbyIndex + 1;
    			for (let i = lastNearbyIndex + 1; i < sortedHeads.length; i++) {
    				if (sameClassHeads.has(sortedHeads[i].head_name)) {
    					// Check if there's a gap
    					const gapSize = i - nextNearbyIndex;
    					if (gapSize > 0) {
    						result.push({
    							isGap: true,
    							gapCount: gapSize,
    							nextDistance: sortedHeads[i].distance
    						});
    					}
    					result.push(sortedHeads[i]);
    					nextNearbyIndex = i + 1;
    				}
    			}
    			
    			return result;
    		},
    
    		getDistanceColor(distance, maxDistance) {
    			if (distance === 0) return 'rgba(0, 123, 255, 0.1)';
    			const intensity = Math.min(distance / maxDistance, 1);
    			const blue = Math.floor(255 * (1 - intensity * 0.7));
    			return `rgba(0, 123, ${blue}, ${0.2 + intensity * 0.6})`;
    		},
    
    		showPromptTooltip(event, prompt) {
    			// Hide existing tooltip
    			this.hidePromptTooltip();
    
    			const tooltip = document.createElement('div');
    			tooltip.className = 'prompt-tooltip show';
    			tooltip.innerHTML = `<strong>Text:</strong><br>${prompt.text}<br><br><strong>Source:</strong> ${prompt.meta?.pile_set_name || 'Unknown'}`;
    			document.body.appendChild(tooltip);
    
    			// Position tooltip
    			const rect = event.target.getBoundingClientRect();
    			tooltip.style.left = (rect.left + window.scrollX) + 'px';
    			tooltip.style.top = (rect.bottom + window.scrollY + 5) + 'px';
    
    			this.promptTooltip = tooltip;
    		},
    
    		hidePromptTooltip() {
    			if (this.promptTooltip) {
    				this.promptTooltip.remove();
    				this.promptTooltip = null;
    			}
    		},
    
    		async expandGap(index) {
    			// TODO: Implement gap expansion logic
    			// This would fetch the skipped heads and insert them into the table
    			console.log('Expanding gap at index:', index);
    			// For now, just mark as expanded
    			this.heads_display_with_distances[index].expanded = true;
    			this.heads_display_with_distances[index].expandable = false;
    		},
    
    		showAggregatedErrors() {
    			const { patterns, classifications } = this.failureTracker;
    			
    			if (patterns.failed > 0) {
    				NOTIF.error(`Failed to load ${patterns.failed}/${patterns.total} attention patterns`);
    			}
    			
    			if (classifications.failed > 0) {
    				NOTIF.error(`Failed to load ${classifications.failed}/${classifications.total} classification sets`);
    			}
    		},
    
    		resetFailureTracker() {
    			this.failureTracker.patterns = { failed: 0, total: 0 };
    			this.failureTracker.classifications = { failed: 0, total: 0 };
    		},
    
    		patternComponent(headId, promptHash) {
    			const app = this;
    			return {
    				loading: true,
    				imageUrl: null,
    				error: null,
    
    				async init() {
    					app.failureTracker.patterns.total++;
    					try {
    						const headInfo = HeadInfo.from_id(headId);
    						const imageUrl_rel = await headInfo.get_pattern_url(promptHash);
    						this.imageUrl = `${CONFIG.patterns_path}/${imageUrl_rel}`;
    						this.loading = false;
    					} catch (error) {
    						app.failureTracker.patterns.failed++;
    						this.loading = false;
    						// Throw error immediately instead of failing silently
    						throw new Error(`Failed to load pattern for ${headId}/${promptHash}: ${error.message}`);
    					}
    				}
    			};
    		},
    
    		classificationComponent(headId) {
    			const app = this;
    			return {
    				classifications: [],
    				typesMetadata: {},
    				currentTooltip: null,
    				hideTimeout: null,
    
    				async loadData() {
    					app.failureTracker.classifications.total++;
    					try {
    						const types = await app.attention_pedia.get_head_types(headId);
    						this.classifications = types;
    
    						for (const type of types) {
    							this.typesMetadata[type] = await app.attention_pedia.get_type_meta(type);
    						}
    					} catch (error) {
    						app.failureTracker.classifications.failed++;
    						// Throw error immediately instead of failing silently
    						throw new Error(`Failed to load classifications for ${headId}: ${error.message}`);
    					}
    				},
    
    				showTooltip(event, type) {
    					// Clear any existing timeout
    					if (this.hideTimeout) {
    						clearTimeout(this.hideTimeout);
    						this.hideTimeout = null;
    					}
    
    					// Hide any existing tooltip
    					this.hideCurrentTooltip();
    
    					const meta = this.typesMetadata[type];
    					const content = `${type}<br>${meta.notes}<br>${meta.n_heads} heads<br><a href="${meta.url}" target="_blank">${meta.url}</a>`;
    
    					const tooltip = document.createElement('div');
    					tooltip.className = 'tooltip show';
    					tooltip.innerHTML = content;
    					document.body.appendChild(tooltip);
    
    					// Position to the right of the element
    					const rect = event.target.getBoundingClientRect();
    					tooltip.style.left = (rect.right + window.scrollX + 10) + 'px';
    					tooltip.style.top = (rect.top + window.scrollY) + 'px';
    
    					this.currentTooltip = tooltip;
    
    					// Add hover listeners to keep tooltip open
    					tooltip.addEventListener('mouseenter', () => {
    						if (this.hideTimeout) {
    							clearTimeout(this.hideTimeout);
    							this.hideTimeout = null;
    						}
    					});
    
    					tooltip.addEventListener('mouseleave', () => {
    						this.startHideTimer();
    					});
    				},
    
    				hideTooltip() {
    					this.startHideTimer();
    				},
    
    				startHideTimer() {
    					if (this.hideTimeout) {
    						clearTimeout(this.hideTimeout);
    					}
    					this.hideTimeout = setTimeout(() => {
    						this.hideCurrentTooltip();
    					}, 300);
    				},
    
    				hideCurrentTooltip() {
    					if (this.currentTooltip) {
    						this.currentTooltip.remove();
    						this.currentTooltip = null;
    					}
    				}
    			};
    		}
    	}));
    });
    </script>
    <!-- end 'app.js' -->

<body>
    <div class="container" x-data="attentionApp" x-init="await init()">
        <div class="section">
            <table class="pattern-table">
                <thead>
                    <tr>
                        <th>Head</th>
                        <th>Distance</th>
                        <th>Classifications</th>
                        <template x-for="prompt in prompts" :key="prompt.hash">
                            <th class="prompt-header" @mouseenter="showPromptTooltip($event, prompt)" @mouseleave="hidePromptTooltip()">
                                <div class="prompt-hash" x-text="prompt.hash"></div>
                                <div class="prompt-tokens" x-text="`${prompt.n_tokens} tokens`"></div>
                            </th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loading state -->
                    <tr x-show="loading">
                        <td :colspan="3 + prompts.length" style="text-align: center; padding: 20px; color: #666;">
                            Loading attention heads data...
                        </td>
                    </tr>
                    <tr x-show="!loading && heads_display_with_distances.length === 0">
                        <td :colspan="3 + prompts.length" style="text-align: center; padding: 20px; color: #666;">
                            No heads data available
                        </td>
                    </tr>
                    <template x-for="(headRow, index) in heads_display_with_distances" :key="headRow.headId || `gap-${index}`">
                        <tr>
                            <td class="head-info" x-text="headRow.headId"></td>
                            <td class="distance-cell" :style="`background-color: ${headRow.distanceColor}`" x-text="headRow.distanceText"></td>
                            <td class="classifications-cell" :class="headRow.hasMatchingClassification ? 'matching-classification' : ''" 
                                x-data="classificationComponent(headRow.headId)" x-init="await loadData()">
                                <template x-if="classifications.length > 0">
                                    <div>
                                        <template x-for="(type, index) in classifications" :key="type">
                                            <span class="classification-tag" 
                                                  @mouseenter="showTooltip($event, type)" 
                                                  @mouseleave="hideTooltip()"
                                                  x-text="type">
                                            </span>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="classifications.length === 0">
                                    <span class="no-classifications">No classifications</span>
                                </template>
                            </td>
                            <template x-for="prompt in prompts" :key="prompt.hash">
                                <td x-data="patternComponent(headRow.headId, prompt.hash)" x-init="await init()">
                                    <template x-if="loading">
                                        <div class="pattern-loading">Loading...</div>
                                    </template>
                                    <template x-if="error">
                                        <div class="pattern-error" x-text="error"></div>
                                    </template>
                                    <template x-if="!loading && !error && imageUrl">
                                        <img :src="imageUrl" class="pattern-image" :alt="`Pattern for ${headRow.headId} on ${prompt.hash}`">
                                    </template>
                                </td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>
</body>
