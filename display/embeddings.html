<!DOCTYPE html>
<html>
<head>
  <title>Vue-Based 3D PCA Plot</title>
  <!-- Load Vue -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
  <!-- Load Plotly.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.2/plotly.min.js"></script>
  <!-- Load scripts -->
  <script src="array.js"></script>
  <script src="dataframe.js"></script>
  <!-- Load color utilities -->
  <script src="colorutil.js"></script>
  <!-- Load styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>{{ title }}</h1>
    
    <div class="controls">
      <div class="control-group">
        <button @click="clearSelection">Clear Selection</button>
        <button class="secondary" @click="regenerateColors">Regenerate Colors</button>
        <div class="combo-select">
          <input 
            type="text" 
            v-model="selectedColumn" 
            @focus="showDropdown = true"
            @blur="hideDropdownDelayed"
            placeholder="Select column"
          />
          <div class="dropdown" v-if="showDropdown">
            <div 
              v-for="column in availableColumns" 
              class="dropdown-item"
              @mousedown.prevent="selectColumn(column)"
            >
              {{ column }}
            </div>
          </div>
        </div>
      </div>
      <div class="status-message">{{ statusMessage }}</div>
    </div>
    
    <div id="plot-container" class="plot-container" ref="plotContainer">
      <div v-if="isLoading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
        <div style="border: 4px solid rgba(0, 0, 0, 0.1); border-radius: 50%; border-top: 4px solid #3498db; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto;"></div>
        <p style="text-align: center;">Loading data...</p>
      </div>
    </div>
    
    <div>
      <h3>Selected Values:</h3>
      <div class="selection-display">
        <template v-if="selectedValues.length === 0">None</template>
        <span 
          v-for="(val, i) in selectedValues" 
          :key="val"
          class="selected-value"
          :style="{ backgroundColor: getSelectionColor(i) }"
        >
          {{ val }}
          <div class="remove-btn" @click="removeSelectedValue(val)" title="Remove">×</div>
        </span>
      </div>
    </div>
    
    <div class="config-display">
      <div class="config-header" @click="toggleConfigCollapse">
        <h3>Plot Configuration</h3>
        <span class="collapse-icon" :class="{ rotated: configCollapsed }">▼</span>
      </div>
      <div class="config-content" v-show="!configCollapsed">
        <div class="config-section">
          <h4>Non-selected Points</h4>
          <div class="control-row">
            <div class="control-label">Color:</div>
            <div class="control-input">
              <input type="color" v-model="nonSelectedColor" @change="updatePlot">
            </div>
          </div>
          <div class="control-row">
            <div class="control-label">Opacity:</div>
            <div class="control-input">
              <input type="range" min="0" max="1" step="0.1" v-model.number="nonSelectedOpacity" @change="updatePlot">
              <input type="number" min="0" max="1" step="0.1" v-model.number="nonSelectedOpacity" @change="updatePlot">
            </div>
          </div>
          <div class="control-row">
            <div class="control-label">Size:</div>
            <div class="control-input">
              <input type="range" min="1" max="10" step="0.5" v-model.number="nonSelectedSize" @change="updatePlot">
              <input type="number" min="1" max="10" step="0.5" v-model.number="nonSelectedSize" @change="updatePlot">
            </div>
          </div>
        </div>
        <div class="config-section">
          <h4>Selected Points</h4>
          <div class="control-row">
            <div class="control-label">Opacity:</div>
            <div class="control-input">
              <input type="range" min="0" max="1" step="0.1" v-model.number="selectedOpacity" @change="updatePlot">
              <input type="number" min="0" max="1" step="0.1" v-model.number="selectedOpacity" @change="updatePlot">
            </div>
          </div>
          <div class="control-row">
            <div class="control-label">Size:</div>
            <div class="control-input">
              <input type="range" min="1" max="10" step="0.5" v-model.number="selectedSize" @change="updatePlot">
              <input type="number" min="1" max="10" step="0.5" v-model.number="selectedSize" @change="updatePlot">
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="url-section">
      <h3>Generated Link:</h3>
      <div>
        <input 
          type="text" 
          v-model="baseUrl" 
          placeholder="Enter base URL"
        />
        <div class="generated-links" v-if="selectedValues.length > 0">
          <h4>Combined Link:</h4>
          <a 
            :href="combinedUrl"
            target="_blank"
            class="generated-link"
          >
            {{ combinedUrl }}
          </a>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // Add a style for the spinner animation
    const styleSheet = document.createElement('style');
    styleSheet.innerText = `
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    `;
    document.head.appendChild(styleSheet);

    /**
     * Creates a layout configuration for a Plotly 3D scatter plot
     * @param {string} title - Title of the plot
     * @param {Object|null} cameraPosition - Optional camera position to preserve
     * @returns {Object} Layout configuration object for Plotly
     */
    function createPlotLayout(title, cameraPosition = null) {
      const layout = {
        title: title,
        scene: {
          xaxis: { title: 'PC1' },
          yaxis: { title: 'PC2' },
          zaxis: { title: 'PC3' },
          camera: { eye: { x: 1.5, y: 1.5, z: 1.5 } }
        },
        margin: { l: 0, r: 0, b: 0, t: 50 }
      };
      
      // Apply saved camera position if provided
      if (cameraPosition) {
        layout.scene.camera = cameraPosition;
      }
      
      return layout;
    }

    /**
     * Creates a default trace configuration for a Plotly 3D scatter plot
     * @returns {Object} Base trace configuration
     */
    function createDefaultTraceConfig() {
      return {
        mode: 'markers',
        type: 'scatter3d',
        hovertemplate: '%{customdata}<br>X: %{x:.2f}<br>Y: %{y:.2f}<br>Z: %{z:.2f}'
      };
    }

    // Create Vue app
    const app = Vue.createApp({
      data() {
        return {
          title: 'Interactive 3D PCA Plot',
          statusMessage: 'Loading data...',
          isLoading: true,
          selectedValues: [],
          plotData: null,
          pcaArray: null,
          dataFrame: null,
          showDropdown: false,
          selectedColumn: '', // Will be set after loading data
          availableColumns: [],
          selectionColors: [
            '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', 
            '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'
          ],
          initialSelectionColors: [
            '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', 
            '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'
          ],
          nonSelectedColor: '#969696', // Gray for non-selected points
          nonSelectedOpacity: 0.4,
          nonSelectedSize: 4,
          selectedOpacity: 1.0,
          selectedSize: 6,
          baseUrl: 'https://miv.name/pattern-lens/demo/?',
          dropdownTimeout: null,
          configCollapsed: false,
          // Default trace configuration
          defaultTraceConfig: createDefaultTraceConfig(),
          // Store current camera position
          currentCameraPosition: null
        };
      },
      
      computed: {
        // Compute combined URL with all selected values
        combinedUrl() {
          if (!this.selectedValues.length) return this.baseUrl || 'https://miv.name/pattern-lens/demo/?';
          
          const base = this.baseUrl || 'https://miv.name/pattern-lens/demo/?';
          return base + this.selectedValues.map(val => encodeURIComponent(val)).join('&');
        }
      },
      
      methods: {
        // Load PCA data and metadata
        async loadData() {
          this.isLoading = true;
          this.statusMessage = 'Loading PCA data...';
          
          try {
            // Load PCA data from NPY file
            this.pcaArray = await NDArray.load("../data/features/pca_data.npy");
            this.statusMessage = 'Loading feature metadata...';
            
            // Load metadata from JSONL file
            const response = await fetch("../data/features/features_scaled.jsonl");
            const text = await response.text();
            this.dataFrame = DataFrame.from_jsonl(text);
            
            // Prepare the data for plotting
            this.processData();
            
            // Set available columns for selection
            this.availableColumns = this.dataFrame.columns.filter(col => 
              // Exclude numerical columns, keep only categorical ones
              // Assuming categorical columns have a reasonable number of unique values
              this.dataFrame.col_unique(col).size < 50
            );
            
            // Set default selected column
            if (this.availableColumns.includes('activation.model')) {
              this.selectedColumn = 'activation.model';
            } else if (this.availableColumns.length > 0) {
              this.selectedColumn = this.availableColumns[0];
            }
            
            this.statusMessage = 'Data loaded successfully';
            this.isLoading = false;
            
            // Initialize the plot after data is loaded
            this.initPlot();
          } catch (error) {
            console.error("Error loading data:", error);
            this.statusMessage = `Error loading data: ${error.message}`;
            this.isLoading = false;
          }
        },
        
        // Process loaded data into a format suitable for plotting
        processData() {
          if (!this.pcaArray || !this.dataFrame) {
            throw new Error("PCA data or metadata not loaded");
          }
          
          // Extract the first 3 principal components for the 3D plot
          const pcaData = this.pcaArray;
          
          // Create the plot data object
          this.plotData = {
            x: [], 
            y: [], 
            z: [],
          };
          
          // Add metadata columns from the DataFrame to plotData
          for (const column of this.dataFrame.columns) {
            this.plotData[column] = this.dataFrame.col(column);
          }
          
          // Extract X, Y, Z coordinates from PCA data
          for (let i = 0; i < pcaData.shape[0]; i++) {
            this.plotData.x.push(pcaData.get(i, 0));
            this.plotData.y.push(pcaData.get(i, 1));
            this.plotData.z.push(pcaData.get(i, 2));
          }
        },
        
        // Get current camera position from the plot
        getCurrentCameraPosition() {
          if (this.$refs.plotContainer && this.$refs.plotContainer._fullLayout) {
            try {
              // Deep clone to avoid reference issues
              return JSON.parse(JSON.stringify(
                this.$refs.plotContainer._fullLayout.scene.camera
              ));
            } catch (e) {
              console.warn("Could not get camera position:", e);
              return null;
            }
          }
          return null;
        },
        
        // Select a column from the dropdown
        selectColumn(column) {
          this.selectedColumn = column;
          this.showDropdown = false;
          this.selectedValues = []; // Clear selection when changing column
          this.updatePlot();
        },
        
        // Hide dropdown with delay to allow for click
        hideDropdownDelayed() {
          this.dropdownTimeout = setTimeout(() => {
            this.showDropdown = false;
          }, 200);
        },
        
        // Create traces grouped by categorical value (for initial view)
        createTracesByCategory() {
          if (!this.plotData || !this.selectedColumn) return [];
          
          const uniqueValues = [...this.dataFrame.col_unique(this.selectedColumn)];
          const traces = [];
          
          // Colors for category differentiation
          const colors = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b'];
          
          // Create a trace for each unique value
          uniqueValues.forEach((value, index) => {
            const indices = [];
            
            // Find all points with this value
            for (let i = 0; i < this.plotData[this.selectedColumn].length; i++) {
              if (this.plotData[this.selectedColumn][i] === value) {
                indices.push(i);
              }
            }
            
            traces.push({
              ...this.defaultTraceConfig,
              x: indices.map(i => this.plotData.x[i]),
              y: indices.map(i => this.plotData.y[i]),
              z: indices.map(i => this.plotData.z[i]),
              name: String(value),
              marker: {
                size: this.nonSelectedSize,
                color: colors[index % colors.length],
                opacity: 0.8
              },
              customdata: indices.map(i => `${this.selectedColumn}: ${this.plotData[this.selectedColumn][i]}`)
            });
          });
          
          return traces;
        },
        
        // Create traces with selection highlighting
        createTracesWithSelection() {
          if (!this.plotData) return [];
          
          // First, separate points into selected and non-selected
          const selectedIndices = {};
          const nonSelectedIndices = [];
          
          // Group points by selection status
          for (let i = 0; i < this.plotData[this.selectedColumn].length; i++) {
            const value = this.plotData[this.selectedColumn][i];
            
            if (this.selectedValues.includes(value)) {
              if (!selectedIndices[value]) {
                selectedIndices[value] = [];
              }
              selectedIndices[value].push(i);
            } else {
              nonSelectedIndices.push(i);
            }
          }
          
          const traces = [];
          
          // Add non-selected points (with configurable color/opacity)
          if (nonSelectedIndices.length > 0) {
            traces.push({
              ...this.defaultTraceConfig,
              x: nonSelectedIndices.map(i => this.plotData.x[i]),
              y: nonSelectedIndices.map(i => this.plotData.y[i]),
              z: nonSelectedIndices.map(i => this.plotData.z[i]),
              name: 'Other Points',
              marker: {
                size: this.nonSelectedSize,
                color: this.nonSelectedColor,
                opacity: this.nonSelectedOpacity
              },
              customdata: nonSelectedIndices.map(i => `${this.selectedColumn}: ${this.plotData[this.selectedColumn][i]}`)
            });
          }
          
          // Add a trace for each selected value
          Object.keys(selectedIndices).forEach((value, index) => {
            const indices = selectedIndices[value];
            
            traces.push({
              ...this.defaultTraceConfig,
              x: indices.map(i => this.plotData.x[i]),
              y: indices.map(i => this.plotData.y[i]),
              z: indices.map(i => this.plotData.z[i]),
              name: `Selected: ${value}`,
              marker: {
                size: this.selectedSize,
                color: this.getSelectionColor(index),
                opacity: this.selectedOpacity
              },
              customdata: indices.map(i => `${this.selectedColumn}: ${this.plotData[this.selectedColumn][i]}`)
            });
          });
          
          return traces;
        },
        
        // Initialize the plot
        initPlot() {
          this.statusMessage = 'Creating plot...';
          
          if (!this.plotData) {
            console.error("Plot data not available");
            this.statusMessage = 'Error: Plot data not available';
            return;
          }
          
          // Create initial traces by the selected categorical column
          const traces = this.createTracesByCategory();
          
          // Create the plot
          Plotly.newPlot(
            this.$refs.plotContainer, 
            traces, 
            createPlotLayout(this.title)
          );
          
          // Add click handler with proper binding
          const boundHandlePointClick = this.handlePointClick.bind(this);
          this.$refs.plotContainer.on('plotly_click', boundHandlePointClick);
          
          // Add relayout event handler to capture camera position changes
          this.$refs.plotContainer.on('plotly_relayout', (eventData) => {
            // Update our stored camera position when user interacts with the plot
            this.currentCameraPosition = this.getCurrentCameraPosition();
          });
          
          this.statusMessage = 'Plot ready - click points to select values';
        },
        
        // Handle point clicks
        handlePointClick(data) {
          if (data.points && data.points.length > 0) {
            const point = data.points[0];
            console.log("Clicked point:", point);
            
            if (point.customdata) {
              // Extract value from customdata (format: "column: value")
              const customData = point.customdata;
              const match = customData.match(new RegExp(`${this.selectedColumn}: (.*)`));
              
              if (match && match[1]) {
                const value = match[1];
                console.log(`Clicked ${this.selectedColumn}:`, value);
                
                // Store current camera position before update
                this.currentCameraPosition = this.getCurrentCameraPosition();
                
                // Toggle selection
                const index = this.selectedValues.indexOf(value);
                
                if (index >= 0) {
                  // Remove if already selected
                  this.selectedValues.splice(index, 1);
                  console.log("Removed value:", value);
                } else {
                  // Add if not already selected
                  this.selectedValues.push(value);
                  console.log("Added value:", value);
                }
                
                // Update the visualization after a short delay to avoid recursion
                const boundUpdatePlot = this.updatePlot.bind(this);
                setTimeout(boundUpdatePlot, 10);
              }
            }
          }
        },
        
        // Update the plot based on selection
        updatePlot() {
          try {
            // Store current camera position before update if not already stored
            if (!this.currentCameraPosition) {
              this.currentCameraPosition = this.getCurrentCameraPosition();
            }
            
            // Update title based on selection
            let plotTitle = 'Interactive 3D PCA Plot';
            if (this.selectedValues.length > 0) {
              plotTitle += ` - Selected ${this.selectedColumn}: ${this.selectedValues.join(', ')}`;
            }
            this.title = plotTitle;
            
            // Create new traces based on selection state
            const traces = this.selectedValues.length > 0 
              ? this.createTracesWithSelection() 
              : this.createTracesByCategory();
            
            // First remove old click handlers to prevent duplicates
            if (this.$refs.plotContainer && this.$refs.plotContainer.removeAllListeners) {
              this.$refs.plotContainer.removeAllListeners('plotly_click');
            }
            
            // Use complete redraw with newPlot to avoid potential issues
            // Apply saved camera position in the layout
            Plotly.newPlot(
              this.$refs.plotContainer, 
              traces, 
              createPlotLayout(this.title, this.currentCameraPosition)
            );
            
            // Add click handler again after plot is redrawn with proper binding
            const boundHandlePointClick = this.handlePointClick.bind(this);
            this.$refs.plotContainer.on('plotly_click', boundHandlePointClick);
            
            // Re-add the relayout event handler
            this.$refs.plotContainer.on('plotly_relayout', (eventData) => {
              this.currentCameraPosition = this.getCurrentCameraPosition();
            });
            
            this.statusMessage = 'Plot updated';
          } catch (error) {
            console.error("Error updating plot:", error);
            this.statusMessage = 'Error updating plot';
          }
        },
        
        // Toggle config section collapse
        toggleConfigCollapse() {
          this.configCollapsed = !this.configCollapsed;
        },
        
        // Clear selection
        clearSelection() {
          // Store current camera position before clearing
          this.currentCameraPosition = this.getCurrentCameraPosition();
          
          this.selectedValues = [];
          // Reset colors back to initial set
          this.selectionColors = [...this.initialSelectionColors];
          this.updatePlot();
        },
        
        // Remove a specific value from selection
        removeSelectedValue(value) {
          // Store current camera position before removing value
          this.currentCameraPosition = this.getCurrentCameraPosition();
          
          const index = this.selectedValues.indexOf(value);
          if (index >= 0) {
            this.selectedValues.splice(index, 1);
            this.updatePlot();
          }
        },
        
        // Get selection color for display
        getSelectionColor(index) {
          return this.selectionColors[index % this.selectionColors.length];
        },
        
        // Generate new random colors that are visually distinct
        regenerateColors() {
          // Store current camera position before changing colors
          this.currentCameraPosition = this.getCurrentCameraPosition();
          
          const colorCount = 9; // Number of colors to generate
          // Using the imported generateDistinctColors function from colorutil.js
          const newColors = generateDistinctColors(colorCount);
          
          this.selectionColors = newColors;
          // Save the new colors as the initial set too
          this.initialSelectionColors = [...newColors];
          this.statusMessage = 'Colors regenerated';
          
          // Always update the plot
          this.updatePlot();
        }
      },
      
      mounted() {
        // Load data when component is mounted
        this.loadData();
      }
    });
    
    app.mount('#app');
  </script>
</body>
</html>
