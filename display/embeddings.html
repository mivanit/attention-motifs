<!DOCTYPE html>
<html>
<head>
  <title>Vue-Based 3D Plot with Simple Selection</title>
  <!-- Load Vue -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
  <!-- Load Plotly.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.26.2/plotly.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      align-items: center;
    }
    .status-message {
      color: #666;
      font-style: italic;
    }
    button {
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .plot-container {
      height: 600px;
      width: 100%;
      margin: 20px 0;
      position: relative;
    }
    .selection-display {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 30px;
    }
    .selected-value {
      display: inline-block;
      margin-right: 10px;
      padding: 5px 10px;
      border-radius: 3px;
      font-weight: bold;
      color: white;
    }
    .config-display {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>{{ title }}</h1>
    
    <div class="controls">
      <button @click="clearSelection">Clear Selection</button>
      <div class="status-message">{{ statusMessage }}</div>
    </div>
    
    <div id="plot-container" class="plot-container" ref="plotContainer"></div>
    
    <div>
      <h3>Selected Classes:</h3>
      <div class="selection-display">
        <template v-if="selectedClasses.length === 0">None</template>
        <span 
          v-for="(val, i) in selectedClasses" 
          :key="val"
          class="selected-value"
          :style="{ backgroundColor: getSelectionColor(i) }"
        >
          {{ val }}
        </span>
      </div>
    </div>
    
    <!-- Space for future configuration options -->
    <div class="config-display">
      <h3>Plot Configuration:</h3>
      <p>Future settings will appear here</p>
    </div>
  </div>
  
  <script>
    // Create Vue app
    const { createApp, ref, reactive, onMounted } = Vue;
    
    createApp({
      setup() {
        // Basic state
        const title = ref('3D Scatter Plot by Model');
        const statusMessage = ref('Initializing...');
        const selectedClasses = ref([]);
        const plotContainer = ref(null);
        const plotData = ref(null);
        
        // Colors for selected classes
        const selectionColors = [
          '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', 
          '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'
        ];
        
        // Generate data for the plot
        const generateData = () => {
          statusMessage.value = 'Generating data...';
          
          // Generate 100 points with 3 dimensions
          const numPoints = 100;
          const classes = ["class-A", "class-B", "class-C"];
          const models = ["model-1", "model-2", "model-3", "model-4"];
          
          const x = [];
          const y = [];
          const z = [];
          const classValues = [];
          const modelValues = [];
          
          // Generate points grouped by class for better visualization
          for (let i = 0; i < numPoints; i++) {
            // Determine which class group this point belongs to
            const classIndex = Math.floor(i / (numPoints / classes.length));
            const className = classes[Math.min(classIndex, classes.length - 1)];
            
            // Add some clustering based on class
            let xBase = 0, yBase = 0, zBase = 0;
            
            if (className === "class-A") {
              xBase = -5;
              yBase = -5;
              zBase = -5;
            } else if (className === "class-B") {
              xBase = 5;
              yBase = 5;
              zBase = -5;
            } else {
              xBase = 0;
              yBase = 0;
              zBase = 5;
            }
            
            // Add random variation around the class center
            x.push(xBase + (Math.random() - 0.5) * 5);
            y.push(yBase + (Math.random() - 0.5) * 5);
            z.push(zBase + (Math.random() - 0.5) * 5);
            
            // Store class and model info
            classValues.push(className);
            modelValues.push(models[i % models.length]);
          }
          
          return { x, y, z, classValues, modelValues };
        };
        
        // Create traces grouped by model (for initial view)
        const createTracesByModel = () => {
          if (!plotData.value) return [];
          
          const uniqueModels = [...new Set(plotData.value.modelValues)];
          const traces = [];
          
          // Create a trace for each model
          uniqueModels.forEach((model, index) => {
            const indices = [];
            
            // Find all points for this model
            for (let i = 0; i < plotData.value.modelValues.length; i++) {
              if (plotData.value.modelValues[i] === model) {
                indices.push(i);
              }
            }
            
            // Create points array for this model
            const x = indices.map(i => plotData.value.x[i]);
            const y = indices.map(i => plotData.value.y[i]);
            const z = indices.map(i => plotData.value.z[i]);
            
            // Create custom data for hovering and selection
            const customdata = indices.map(i => [
              plotData.value.classValues[i],
              plotData.value.modelValues[i]
            ]);
            
            // Choose color based on index
            const colors = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b'];
            const color = colors[index % colors.length];
            
            // Create the trace
            traces.push({
              x: x,
              y: y,
              z: z,
              mode: 'markers',
              type: 'scatter3d',
              name: model,
              marker: {
                size: 5,
                color: color,
                opacity: 0.8
              },
              customdata: customdata,
              hovertemplate: 'Class: %{customdata[0]}<br>Model: %{customdata[1]}<br>X: %{x:.2f}<br>Y: %{y:.2f}<br>Z: %{z:.2f}'
            });
          });
          
          return traces;
        };
        
        // Create traces with selection highlighting
        const createTracesWithSelection = () => {
          if (!plotData.value) return [];
          
          // First, separate points into selected and non-selected
          const selectedIndices = {};
          const nonSelectedIndices = [];
          
          // Group points by selection status
          for (let i = 0; i < plotData.value.classValues.length; i++) {
            const className = plotData.value.classValues[i];
            
            if (selectedClasses.value.includes(className)) {
              if (!selectedIndices[className]) {
                selectedIndices[className] = [];
              }
              selectedIndices[className].push(i);
            } else {
              nonSelectedIndices.push(i);
            }
          }
          
          const traces = [];
          
          // Add non-selected points (with reduced opacity)
          if (nonSelectedIndices.length > 0) {
            const x = nonSelectedIndices.map(i => plotData.value.x[i]);
            const y = nonSelectedIndices.map(i => plotData.value.y[i]);
            const z = nonSelectedIndices.map(i => plotData.value.z[i]);
            
            const customdata = nonSelectedIndices.map(i => [
              plotData.value.classValues[i],
              plotData.value.modelValues[i]
            ]);
            
            traces.push({
              x: x,
              y: y,
              z: z,
              mode: 'markers',
              type: 'scatter3d',
              name: 'Other Points',
              marker: {
                size: 5,
                color: 'rgba(150, 150, 150, 0.5)',
                opacity: 0.4  // Increased opacity to make points more visible
              },
              customdata: customdata,
              hovertemplate: 'Class: %{customdata[0]}<br>Model: %{customdata[1]}<br>X: %{x:.2f}<br>Y: %{y:.2f}<br>Z: %{z:.2f}'
            });
          }
          
          // Add a trace for each selected class
          Object.keys(selectedIndices).forEach((className, index) => {
            const indices = selectedIndices[className];
            const color = selectionColors[index % selectionColors.length];
            
            const x = indices.map(i => plotData.value.x[i]);
            const y = indices.map(i => plotData.value.y[i]);
            const z = indices.map(i => plotData.value.z[i]);
            
            const customdata = indices.map(i => [
              plotData.value.classValues[i],
              plotData.value.modelValues[i]
            ]);
            
            traces.push({
              x: x,
              y: y,
              z: z,
              mode: 'markers',
              type: 'scatter3d',
              name: `Selected: ${className}`,
              marker: {
                size: 5,
                color: color,
                opacity: 1.0
              },
              customdata: customdata,
              hovertemplate: 'Class: %{customdata[0]}<br>Model: %{customdata[1]}<br>X: %{x:.2f}<br>Y: %{y:.2f}<br>Z: %{z:.2f}'
            });
          });
          
          return traces;
        };
        
        // Initialize the plot
        const initPlot = () => {
          statusMessage.value = 'Creating plot...';
          
          // Generate data if not already done
          if (!plotData.value) {
            plotData.value = generateData();
          }
          
          // Create initial traces (by model)
          const traces = createTracesByModel();
          
          // Define layout
          const layout = {
            title: title.value,
            scene: {
              xaxis: { title: 'X' },
              yaxis: { title: 'Y' },
              zaxis: { title: 'Z' },
              camera: { eye: { x: 1.5, y: 1.5, z: 1.5 } }
            },
            margin: { l: 0, r: 0, b: 0, t: 50 }
          };
          
          // Create the plot
          Plotly.newPlot(plotContainer.value, traces, layout);
          
          // Add click handler
          plotContainer.value.on('plotly_click', handlePointClick);
          
          statusMessage.value = 'Plot ready - click points to select classes';
        };
        
        // Handle point clicks
        const handlePointClick = (data) => {
          if (data.points && data.points.length > 0) {
            const point = data.points[0];
            console.log("Clicked point:", point);
            
            if (point.customdata && point.customdata.length > 0) {
              // Get the class value from customdata
              const className = point.customdata[0];
              console.log("Clicked class:", className);
              
              // Toggle selection
              const index = selectedClasses.value.indexOf(className);
              
              // Create a new array instead of modifying in place to ensure Vue detection
              if (index >= 0) {
                // Remove if already selected
                const newSelection = [...selectedClasses.value];
                newSelection.splice(index, 1);
                selectedClasses.value = newSelection;
                console.log("Removed class:", className);
              } else {
                // Add if not already selected
                selectedClasses.value = [...selectedClasses.value, className];
                console.log("Added class:", className);
              }
              
              // Update the visualization after a short delay to avoid recursion
              setTimeout(() => {
                updatePlot();
              }, 10);
            }
          }
        };
        
        // Update the plot based on selection
        const updatePlot = () => {
          try {
            // Update title based on selection
            let plotTitle = '3D Scatter Plot by Model';
            if (selectedClasses.value.length > 0) {
              plotTitle += ` - Selected: ${selectedClasses.value.join(', ')}`;
            }
            title.value = plotTitle;
            
            // Create new traces based on selection state
            const traces = selectedClasses.value.length > 0 
              ? createTracesWithSelection() 
              : createTracesByModel();
            
            // Get current layout and update title
            const layout = {
              title: plotTitle,
              scene: {
                xaxis: { title: 'X' },
                yaxis: { title: 'Y' },
                zaxis: { title: 'Z' },
                camera: { eye: { x: 1.5, y: 1.5, z: 1.5 } }
              },
              margin: { l: 0, r: 0, b: 0, t: 50 }
            };
            
            // First remove old click handlers to prevent duplicates
            if (plotContainer.value && plotContainer.value.removeAllListeners) {
              plotContainer.value.removeAllListeners('plotly_click');
            }
            
            // Use complete redraw with newPlot to avoid potential issues
            Plotly.newPlot(plotContainer.value, traces, layout);
            
            // Add click handler again after plot is redrawn
            plotContainer.value.on('plotly_click', handlePointClick);
            
            statusMessage.value = 'Plot updated';
          } catch (error) {
            console.error("Error updating plot:", error);
            statusMessage.value = 'Error updating plot';
          }
        };
        
        // Clear selection
        const clearSelection = () => {
          // Replace the array entirely rather than modifying in place
          selectedClasses.value = [];
          
          // Update the plot after a short delay
          setTimeout(() => {
            updatePlot();
          }, 10);
        };
        
        // Get selection color for display
        const getSelectionColor = (index) => {
          return selectionColors[index % selectionColors.length];
        };
        
        // Initialize on mount
        onMounted(() => {
          initPlot();
        });
        
        return {
          title,
          statusMessage,
          selectedClasses,
          plotContainer,
          clearSelection,
          getSelectionColor
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
